[project]
name = "studiekamerat-backend"
version = "0.1.0"
description = "Backend for Studiekamerat (FastAPI)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
    "sqlalchemy[asyncio]==2.1.8",
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
]

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
