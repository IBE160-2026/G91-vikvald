# Runs the backend and frontend unit tests on every pull request to main (AR-20).
# End-to-end tests are not run here: they need the whole app running in Docker.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Tests must never reach a real model provider.
  LLM_PROVIDER: mock

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # uv reads the Python version from backend/.python-version.
      - name: Install backend dependencies
        run: uv sync --locked
        working-directory: backend

      - name: Run backend tests
        run: uv run pytest
        working-directory: backend

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend
