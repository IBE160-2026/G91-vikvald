ircle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 0 0 11z" fill="#15181F" stroke="none"/></g><rect x="65.8" y="304.8" width="33.5" height="33.5" rx="6" fill="#FFFFFF" stroke="#3A3FB0" stroke-width="1.5"/><text x="82.5" y="326.5" font-size="13" font-weight="600" fill="#3A3FB0" text-anchor="middle">2</text><rect x="106.5" y="304.5" width="34" height="34" rx="6" fill="none" stroke="#DCDCD6" stroke-width="1"/><text x="123.5" y="326.5" font-size="12" font-weight="400" fill="#5A6070" text-anchor="middle">3</text><rect x="147.5" y="304.5" width="34" height="34" rx="6" fill="none" stroke="#DCDCD6" stroke-width="1"/><text x="164.5" y="326.5" font-size="12" font-weight="400" fill="#5A6070" text-anchor="middle">4</text><rect x="188.5" y="304.5" width="34" height="34" rx="6" fill="none" stroke="#DCDCD6" stroke-width="1"/><text x="205.5" y="326.5" font-size="12" font-weight="400" fill="#5A6070" text-anchor="middle">5</text><rect x="229.5" y="304.5" width="34" height="34" rx="6" fill="none" stroke="#DCDCD6" stroke-width="1"/><text x="246.5" y="326.5" font-size="12" font-weight="400" fill="#5A6070" text-anchor="middle">6</text><rect x="24.5" y="345.5" width="34" height="34" rx="6" fill="none" stroke="#DCDCD6" stroke-width="1"/><text x="41.5" y="367.5" font-size="12" font-weight="400" fill="#5A6070" text-anchor="middle">7</text><rect x="65.5" y="345.5" width="34" height="34" rx="6" fill="none" stroke="#DCDCD6" stroke-width="1"/><text x="82.5" y="367.5" font-size="12" font-weight="400" fill="#5A6070" text-anchor="middle">8</text><rect x="106.5" y="345.5" width="34" height="34" rx="6" fill="none" stroke="#DCDCD6" stroke-width="1"/><text x="123.5" y="367.5" font-size="12" font-weight="400" fill="#5A6070" text-anchor="middle">9</text><rect x="147.5" y="345.5" width="34" height="34" rx="6" fill="none" stroke="#DCDCD6" stroke-width="1"/><text x="164.5" y="367.5" font-size="12" font-weight="400" fill="#5A6070" text-anchor="middle">10</text><rect x="24" y="395" width="20" height="20" rx="4" fill="#E8F3EB"/><g transform="translate(26 397) scale(1)" fill="none" stroke="#1C6E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.25 3.25L13 4.5"/></g><text x="56" y="410" font-size="14" font-weight="400" fill="#15181F">Riktig</text><rect x="24" y="427" width="20" height="20" rx="4" fill="#EEEDE7"/><g transform="translate(26 429) scale(1)" fill="none" stroke="#15181F" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 0 0 11z" fill="#15181F" stroke="none"/></g><text x="56" y="442" font-size="14" font-weight="400" fill="#15181F">Delvis riktig</text><rect x="24" y="459" width="20" height="20" rx="4" fill="#FCEBE9"/><g transform="translate(26 461) scale(1)" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></g><text x="56" y="474" font-size="14" font-weight="400" fill="#15181F">Feil</text><rect x="24.5" y="491.5" width="19" height="19" rx="4" fill="none" stroke="#DCDCD6" stroke-width="1"/><text x="56" y="506" font-size="14" font-weight="400" fill="#15181F">Ikke besvart ennå</text><rect x="24.5" y="836.5" width="239" height="39" rx="8" fill="#FFFFFF" stroke="#858B96" stroke-width="1" filter="url(#lift)"/><text x="105.2" y="861.2" font-size="15" font-weight="600" fill="#15181F">Avslutt økt</text><text x="448" y="204" font-size="12" font-weight="600" fill="#5A6070" letter-spacing="0.8">SPØRSMÅL 2 AV 10</text><text x="448" y="240" font-size="26" font-weight="600" fill="#15181F" letter-spacing="-0.4">Forklar forskjellen på segmentering og posisjonering,</text><text x="448" y="274" font-size="26" font-weight="600" fill="#15181F" letter-spacing="-0.4">og gi et eksempel.</text><text x="448" y="318" font-size="14" font-weight="600" fill="#15181F">Ditt svar</text><text x="1280" y="318" font-size="13" font-weight="400" fill="#5A6070" text-anchor="end">Levert · 37 ord</text><rect x="448.5" y="330.5" width="831" height="111" rx="8" fill="#FFFFFF" stroke="#858B96" stroke-width="1"/><text x="472" y="366" font-size="16" font-weight="400" fill="#15181F">Segmentering er å dele markedet inn i grupper med like behov, for eksempel etter alder eller livsstil.</text><text x="472" y="390" font-size="16" font-weight="400" fill="#15181F">Posisjonering er hvordan vi vil at merket skal oppfattes. Eksempel: Et treningssenter kan dele kundene inn i</text><text x="472" y="414" font-size="16" font-weight="400" fill="#15181F">studenter og pensjonister.</text><rect x="448" y="466" width="832" height="208" rx="12" fill="#FFFFFF" stroke="#DDDCD5" stroke-width="1" filter="url(#lift)"/><text x="472" y="502" font-size="15" font-weight="600" fill="#15181F">Modellsvar</text><text x="472" y="530" font-size="16" font-weight="400" fill="#15181F">Segmentering er å dele markedet inn i grupper med like behov eller kjennetegn. Posisjonering er å skape et</text><text x="472" y="554" font-size="16" font-weight="400" fill="#15181F">tydelig og ønsket bilde av merket i målgruppens bevissthet, sammenlignet med konkurrentene. Eksempel: Et</text><text x="472" y="578" font-size="16" font-weight="400" fill="#15181F">treningssenter deler markedet etter livsfase, velger studenter som målgruppe og posisjonerer seg som det</text><text x="472" y="602" font-size="16" font-weight="400" fill="#15181F">rimelige og sosiale alternativet.</text><line x1="449" y1="626.5" x2="1279" y2="626.5" stroke="#EAE9E3" stroke-width="1"/><g transform="translate(472 642) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="496" y="655" font-size="14" font-weight="400" fill="#5A6070">Kilde</text><text x="535.6" y="655" font-size="14" font-weight="500" fill="#15181F">segmentering.pdf, side 3</text><line x1="535.6" y1="659.5" x2="699.1" y2="659.5" stroke="#DDDCD5" stroke-width="1"/><circle cx="990.3" cy="650" r="4" fill="#B83E0C"/><text x="1256" y="655" font-size="14" font-weight="400" fill="#5A6070" text-anchor="end">Uke 36: Segmentering og posisjonering</text><text x="448" y="726" font-size="16" font-weight="600" fill="#15181F">Hvordan gikk det?</text><text x="448" y="748" font-size="14" font-weight="400" fill="#5A6070">Vurder selv mot modellsvaret.</text><rect x="752.5" y="706.5" width="167" height="47" rx="8" fill="#FFFFFF" stroke="#858B96" stroke-width="1" filter="url(#lift)"/><g transform="translate(810.9 722) scale(1)" fill="none" stroke="#B42318" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></g><text x="834.9" y="735.6" font-size="16" font-weight="600" fill="#15181F">Feil</text><rect x="928" y="702" width="176" height="56" rx="11" fill="none" stroke="#15181F" stroke-width="2"/><rect x="932.5" y="706.5" width="167" height="47" rx="8" fill="#FFFFFF" stroke="#858B96" stroke-width="1" filter="url(#lift)"/><g transform="translate(959.5 722) scale(1)" fill="none" stroke="#15181F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 0 0 11z" fill="#15181F" stroke="none"/></g><text x="983.5" y="735.6" font-size="16" font-weight="600" fill="#15181F">Delvis riktig</text><rect x="1112.5" y="706.5" width="167" height="47" rx="8" fill="#FFFFFF" stroke="#858B96" stroke-width="1" filter="url(#lift)"/><g transform="translate(1162.1 722) scale(1)" fill="none" stroke="#1C6E36" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.25 3.25L13 4.5"/></g><text x="1186.1" y="735.6" font-size="16" font-weight="600" fill="#15181F">Riktig</text><rect x="898.4" y="778.5" width="21" height="21" rx="5" fill="#FFFFFF" stroke="#DDDCD5" stroke-width="1"/><text x="908.9" y="793.5" font-size="12" font-weight="500" fill="#5A6070" text-anchor="middle">1</text><text x="927.9" y="794" font-size="14" font-weight="400" fill="#5A6070">Feil</text><rect x="974.5" y="778.5" width="21" height="21" rx="5" fill="#FFFFFF" stroke="#DDDCD5" stroke-width="1"/><text x="985" y="793.5" font-size="12" font-weight="500" fill="#5A6070" text-anchor="middle">2</text><text x="1004" y="794" font-size="14" font-weight="400" fill="#5A6070">Delvis riktig</text><rect x="1103.8" y="778.5" width="21" height="21" rx="5" fill="#FFFFFF" stroke="#DDDCD5" stroke-width="1"/><text x="1114.3" y="793.5" font-size="12" font-weight="500" fill="#5A6070" text-anchor="middle">3</text><text x="1133.3" y="794" font-size="14" font-weight="400" fill="#5A6070">Riktig</text><rect x="1194.4" y="778.5" width="33.2" height="21" rx="5" fill="#FFFFFF" stroke="#DDDCD5" stroke-width="1"/><text x="1211" y="793.5" font-size="12" font-weight="500" fill="#5A6070" text-anchor="middle">Esc</text><text x="1236.1" y="794" font-size="14" font-weight="400" fill="#5A6070">avslutt</text>
