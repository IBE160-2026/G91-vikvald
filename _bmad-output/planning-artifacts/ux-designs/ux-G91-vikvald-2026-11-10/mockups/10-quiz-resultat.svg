ecap="round" stroke-linejoin="round"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></g><text x="56" y="483" font-size="14" font-weight="400" fill="#15181F">Feil</text><g transform="translate(24 843) scale(1)" fill="none" stroke="#5A6070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.25 3.25L13 4.5"/></g><text x="48" y="856" font-size="14" font-weight="400" fill="#5A6070">Økten er ferdig og lagret</text><text x="448" y="124" font-size="12" font-weight="600" fill="#5A6070" letter-spacing="0.8">QUIZ FERDIG</text><text x="448" y="164" font-size="32" font-weight="600" fill="#15181F" letter-spacing="-0.5">11 av 15 riktige</text><text x="448" y="194" font-size="15" font-weight="400" fill="#5A6070">Markedsføring, hele emnet · her er de 4 du svarte feil på, med riktig svar og kilde</text><rect x="448" y="224" width="832" height="544" rx="12" fill="#FFFFFF" stroke="#DDDCD5" stroke-width="1" filter="url(#lift)"/><rect x="472.5" y="242.5" width="31" height="31" rx="7" fill="#FFFFFF" stroke="#DDDCD5" stroke-width="1"/><text x="488" y="263" font-size="14" font-weight="600" fill="#15181F" text-anchor="middle">4</text><text x="520" y="264" font-size="16" font-weight="600" fill="#15181F">Hvilken av disse beskriver best posisjonering?</text><g transform="translate(1035.5 251) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="1059.5" y="264" font-size="14" font-weight="500" fill="#15181F">merkevare-notater.pdf, side 7</text><line x1="1059.5" y1="268.5" x2="1256" y2="268.5" stroke="#DDDCD5" stroke-width="1"/><g transform="translate(520 279) scale(1)" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></g><text x="544" y="292" font-size="14" font-weight="600" fill="#B42318">Ditt svar</text><text x="632" y="292" font-size="15" font-weight="400" fill="#15181F">Å velge hvilke segmenter bedriften skal satse på</text><g transform="translate(520 303) scale(1)" fill="none" stroke="#1C6E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.25 3.25L13 4.5"/></g><text x="544" y="316" font-size="14" font-weight="600" fill="#1C6E36">Riktig svar</text><text x="632" y="316" font-size="15" font-weight="600" fill="#15181F">Å skape et tydelig og ønsket bilde av merket i målgruppens bevissthet</text><text x="632" y="340" font-size="14" font-weight="400" fill="#5A6070">Å velge segmenter er målgruppevalg. Det skjer før posisjoneringen.</text><line x1="449" y1="360.5" x2="1279" y2="360.5" stroke="#EAE9E3" stroke-width="1"/><rect x="472.5" y="378.5" width="31" height="31" rx="7" fill="#FFFFFF" stroke="#DDDCD5" stroke-width="1"/><text x="488" y="399" font-size="14" font-weight="600" fill="#15181F" text-anchor="middle">7</text><text x="520" y="400" font-size="16" font-weight="600" fill="#15181F">Hva kjennetegner et impulskjøp?</text><g transform="translate(1083.7 387) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="1107.7" y="400" font-size="14" font-weight="500" fill="#15181F">kjopsatferd.pdf, side 5</text><line x1="1107.7" y1="404.5" x2="1256" y2="404.5" stroke="#DDDCD5" stroke-width="1"/><g transform="translate(520 415) scale(1)" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></g><text x="544" y="428" font-size="14" font-weight="600" fill="#B42318">Ditt svar</text><text x="632" y="428" font-size="15" font-weight="400" fill="#15181F">Kunden sammenligner mange alternativer</text><g transform="translate(520 439) scale(1)" fill="none" stroke="#1C6E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.25 3.25L13 4.5"/></g><text x="544" y="452" font-size="14" font-weight="600" fill="#1C6E36">Riktig svar</text><text x="632" y="452" font-size="15" font-weight="600" fill="#15181F">Kjøpet er ikke planlagt og utløses ofte i butikken</text><text x="632" y="476" font-size="14" font-weight="400" fill="#5A6070">Å sammenligne mange alternativer hører til omfattende kjøpsbeslutninger.</text><line x1="449" y1="496.5" x2="1279" y2="496.5" stroke="#EAE9E3" stroke-width="1"/><rect x="472.5" y="514.5" width="31" height="31" rx="7" fill="#FFFFFF" stroke="#DDDCD5" stroke-width="1"/><text x="488" y="535" font-size="14" font-weight="600" fill="#15181F" text-anchor="middle">11</text><text x="520" y="536" font-size="16" font-weight="600" fill="#15181F">Hva kalles valget av segmenter å satse på?</text><g transform="translate(1068.5 523) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="1092.5" y="536" font-size="14" font-weight="500" fill="#15181F">segmentering.pdf, side 6</text><line x1="1092.5" y1="540.5" x2="1256" y2="540.5" stroke="#DDDCD5" stroke-width="1"/><g transform="translate(520 551) scale(1)" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></g><text x="544" y="564" font-size="14" font-weight="600" fill="#B42318">Ditt svar</text><text x="632" y="564" font-size="15" font-weight="400" fill="#15181F">Segmentering</text><g transform="translate(520 575) scale(1)" fill="none" stroke="#1C6E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.25 3.25L13 4.5"/></g><text x="544" y="588" font-size="14" font-weight="600" fill="#1C6E36">Riktig svar</text><text x="632" y="588" font-size="15" font-weight="600" fill="#15181F">Målgruppevalg</text><text x="632" y="612" font-size="14" font-weight="400" fill="#5A6070">Segmentering er å dele markedet inn i grupper. Valget av grupper kommer etterpå.</text><line x1="449" y1="632.5" x2="1279" y2="632.5" stroke="#EAE9E3" stroke-width="1"/><rect x="472.5" y="650.5" width="31" height="31" rx="7" fill="#FFFFFF" stroke="#DDDCD5" stroke-width="1"/><text x="488" y="671" font-size="14" font-weight="600" fill="#15181F" text-anchor="middle">13</text><text x="520" y="672" font-size="16" font-weight="600" fill="#15181F">Hva måler konverteringsrate?</text><g transform="translate(1007 659) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="1031" y="672" font-size="14" font-weight="500" fill="#15181F">digital-markedsforing.pdf, side 11</text><line x1="1031" y1="676.5" x2="1256" y2="676.5" stroke="#DDDCD5" stroke-width="1"/><g transform="translate(520 687) scale(1)" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></g><text x="544" y="700" font-size="14" font-weight="600" fill="#B42318">Ditt svar</text><text x="632" y="700" font-size="15" font-weight="400" fill="#15181F">Andelen som ser annonsen</text><g transform="translate(520 711) scale(1)" fill="none" stroke="#1C6E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.25 3.25L13 4.5"/></g><text x="544" y="724" font-size="14" font-weight="600" fill="#1C6E36">Riktig svar</text><text x="632" y="724" font-size="15" font-weight="600" fill="#15181F">Andelen besøkende som gjør en ønsket handling, f.eks. kjøper</text><text x="632" y="748" font-size="14" font-weight="400" fill="#5A6070">Andelen som ser annonsen, kalles rekkevidde.</text><rect x="1092" y="796" width="192" height="56" rx="11" fill="none" stroke="#15181F" stroke-width="2"/><rect x="1096" y="800" width="184" height="48" rx="8" fill="#3A3FB0"/><g transform="translate(1120 816) scale(1)" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.46-3.54"/><path d="M12 1.75v3h-3"/></g><text x="1144" y="829.6" font-size="16" font-weight="600" fill="#FFFFFF">Ta quizen igjen</text><rect x="909.5" y="800.5" width="170" height="47" rx="8" fill="#FFFFFF" stroke="#858B96" stroke-width="1" filter="url(#lift)"/><text x="932.8" y="829.6" font-size="16" font-weight="600" fill="#15181F">Tilbake til emnet</text><rect x="448.5" y="814.5" width="43.7" height="21" rx="5" fill="#FFFFFF" stroke="#DDDCD5" stroke-width="1"/><text x="470.3" y="829.5" font-size="12" font-weight="500" fill="#5A6070" text-anchor="middle">Enter</text><text x="500.7" y="830" font-size="14" font-weight="400" fill="#5A6070">ta quizen igjen</text><rect x="618.5" y="814.5" width="33.2" height="21" rx="5" fill="#FFFFFF" stroke="#DDDCD5" stroke-width="1"/><text x="635.1" y="829.5" font-size="12" font-weight="500" fill="#5A6070" text-anchor="middle">Esc</text><text x="660.3" y="830" font-size="14" font-weight="400" fill="#5A6070">tilbake til emnet</text>
