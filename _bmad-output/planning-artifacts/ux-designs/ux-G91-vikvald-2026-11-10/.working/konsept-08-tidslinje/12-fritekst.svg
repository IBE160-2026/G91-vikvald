<title>Studiekamerat – fritekstspørsmål 2 av 10</title>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FBE8E6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#B42318" stroke-width="3"/></pattern></defs>
<rect width="1440" height="900" fill="#F6F5F1"/>
<rect x="0" y="0" width="1440" height="64" rx="0" fill="#FFFFFF" /><line x1="0" y1="64" x2="1440" y2="64" stroke="#D6D3CB" stroke-width="1" /><line x1="40" y1="32" x2="66" y2="32" stroke="#B83E0C" stroke-width="5" stroke-linecap="round"/><circle cx="53" cy="32" r="6" fill="#FFFFFF" stroke="#B83E0C" stroke-width="3"/><text x="78" y="39" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#161B26" text-anchor="start" >Studiekamerat</text><text x="250" y="38" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="start" >Fritekst</text><text x="326.8" y="38" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5262" text-anchor="start" >· Markedsføring, hele emnet</text><rect x="1236" y="12" width="164" height="40" rx="4" fill="#FFFFFF" stroke="#161B26" stroke-width="2" /><text x="1318.0" y="38.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#161B26" text-anchor="middle" >Avslutt økt</text><line x1="240" y1="112" x2="346.6666666666667" y2="112" stroke="#161B26" stroke-width="4" stroke-linecap="round"/><line x1="346.6666666666667" y1="112" x2="1200" y2="112" stroke="#D6D3CB" stroke-width="4" stroke-linecap="round"/><circle cx="240.0" cy="112" r="7" fill="#161B26"/><circle cx="346.7" cy="112" r="15" fill="#FFFFFF" stroke="#161B26" stroke-width="3"/><text x="346.7" y="118" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="800" fill="#161B26" text-anchor="middle" >2</text><circle cx="453.3" cy="112" r="6" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="2.5"/><circle cx="560.0" cy="112" r="6" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="2.5"/><circle cx="666.7" cy="112" r="6" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="2.5"/><circle cx="773.3" cy="112" r="6" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="2.5"/><circle cx="880.0" cy="112" r="6" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="2.5"/><circle cx="986.7" cy="112" r="6" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="2.5"/><circle cx="1093.3" cy="112" r="6" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="2.5"/><circle cx="1200.0" cy="112" r="6" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="2.5"/><text x="240" y="152" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="start" >Spørsmål 2 av 10</text><text x="80" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#161B26" text-anchor="start" >Forklar forskjellen på segmentering og posisjonering,</text><text x="80" y="250" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#161B26" text-anchor="start" >og gi et eksempel.</text><text x="80" y="306" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#161B26" text-anchor="start" >Ditt svar</text><rect x="80" y="318" width="620" height="300" rx="4" fill="#FFFFFF" stroke="#161B26" stroke-width="1.5" /><text x="104" y="356" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#161B26" text-anchor="start" >Segmentering er å dele markedet inn i grupper av kunder med</text>
<text x="104" y="384" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#161B26" text-anchor="start" >like behov. Posisjonering er hvordan vi vil at kundene skal</text>
<text x="104" y="412" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#161B26" text-anchor="start" >oppfatte merket. For eksempel kan et treningssenter</text>
<text x="104" y="440" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#161B26" text-anchor="start" >segmentere etter alder og så posisjonere seg som det</text>
<text x="104" y="468" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#161B26" text-anchor="start" >rimelige alternativet for studenter.</text><text x="700" y="642" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5262" text-anchor="end" >264 tegn</text><rect x="740" y="290" width="620" height="352" rx="4" fill="#FBEDE5" /><rect x="740" y="290" width="6" height="352" rx="0" fill="#B83E0C" /><text x="770" y="330" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#161B26" text-anchor="start" >Modellsvar</text><text x="770" y="366" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >Segmentering deler markedet inn i grupper med like behov eller</text>
<text x="770" y="392" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >kjennetegn, for eksempel alder eller livsstil. Posisjonering</text>
<text x="770" y="418" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >kommer etterpå: bedriften bestemmer hvilket bilde merket skal</text>
<text x="770" y="444" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >ha i målgruppens bevissthet, sammenlignet med konkurrentene.</text>
<text x="770" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >Eksempel: Et bilmerke segmenterer etter familiesituasjon og</text>
<text x="770" y="496" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >posisjonerer seg som det tryggeste valget for barnefamilier.</text><text x="770" y="536" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="start" text-decoration="underline">Kilde: segmentering-notater.pdf, side 3</text><line x1="770" y1="568" x2="804" y2="568" stroke="#B83E0C" stroke-width="5" stroke-linecap="round"/><circle cx="787" cy="568" r="7" fill="#B83E0C" stroke="#FFFFFF" stroke-width="2.5"/><text x="816" y="574" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#B83E0C" text-anchor="start" >Uke 36: Segmentering og posisjonering</text><text x="80" y="690" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="800" fill="#161B26" text-anchor="start" >Sammenlign med modellsvaret. Hvordan gikk det?</text><rect x="80" y="712" width="170" height="54" rx="4" fill="#FFFFFF" stroke="#161B26" stroke-width="2" /><text x="165.0" y="745.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#161B26" text-anchor="middle" >✓  Riktig</text><rect x="261" y="707" width="230" height="64" rx="7" fill="none" stroke="#1F56D6" stroke-width="3" /><rect x="266" y="712" width="220" height="54" rx="4" fill="#FFFFFF" stroke="#161B26" stroke-width="2" /><text x="376.0" y="745.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#161B26" text-anchor="middle" >~  Delvis riktig</text><rect x="502" y="712" width="150" height="54" rx="4" fill="#FFFFFF" stroke="#161B26" stroke-width="2" /><text x="577.0" y="745.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#161B26" text-anchor="middle" >✗  Feil</text><text x="680" y="744" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5262" text-anchor="start" >Du vurderer selv. Svaret ditt lagres ikke.</text><rect x="0" y="788" width="1440" height="112" rx="0" fill="#FFFFFF" /><line x1="0" y1="900" x2="1440" y2="900" stroke="#D6D3CB" stroke-width="1" /><line x1="80.0" y1="802" x2="80.0" y2="888" stroke="#ECEAE4" stroke-width="1" /><text x="86.0" y="816" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#4B5262" text-anchor="start" letter-spacing="1.5">AUG</text><line x1="254.1" y1="802" x2="254.1" y2="888" stroke="#ECEAE4" stroke-width="1" /><text x="260.1" y="816" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#4B5262" text-anchor="start" letter-spacing="1.5">SEP</text><line x1="561.3" y1="802" x2="561.3" y2="888" stroke="#ECEAE4" stroke-width="1" /><text x="567.3" y="816" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#4B5262" text-anchor="start" letter-spacing="1.5">OKT</text><line x1="878.7" y1="802" x2="878.7" y2="888" stroke="#ECEAE4" stroke-width="1" /><text x="884.7" y="816" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#4B5262" text-anchor="start" letter-spacing="1.5">NOV</text><line x1="1185.9" y1="802" x2="1185.9" y2="888" stroke="#ECEAE4" stroke-width="1" /><text x="1191.9" y="816" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#4B5262" text-anchor="start" letter-spacing="1.5">DES</text><line x1="141.4" y1="856" x2="970.9" y2="856" stroke="#B83E0C" stroke-width="6" stroke-linecap="round"/><line x1="970.9" y1="856" x2="1257.6" y2="856" stroke="#B83E0C" stroke-width="6" stroke-dasharray="2 9" stroke-linecap="round"/><circle cx="141.4" cy="856" r="7" fill="#B83E0C" stroke="#B83E0C" stroke-width="3.5"/><circle cx="213.1" cy="856" r="7" fill="#B83E0C" stroke="#B83E0C" stroke-width="3.5"/><circle cx="284.8" cy="856" r="13" fill="#B83E0C" stroke="#FFFFFF" stroke-width="4"/><circle cx="284.8" cy="856" r="17" fill="none" stroke="#161B26" stroke-width="2"/><circle cx="356.5" cy="856" r="7" fill="#B83E0C" stroke="#B83E0C" stroke-width="3.5"/><circle cx="428.2" cy="856" r="7" fill="#FFFFFF" stroke="#B83E0C" stroke-width="3.5"/><circle cx="571.5" cy="856" r="7" fill="#FFFFFF" stroke="#B83E0C" stroke-width="3.5"/><circle cx="714.9" cy="856" r="7" fill="#FFFFFF" stroke="#B83E0C" stroke-width="3.5"/><circle cx="858.2" cy="856" r="7" fill="#FFFFFF" stroke="#B83E0C" stroke-width="3.5"/><rect x="266.8" y="822" width="318.0" height="0.1" rx="4" fill="none" /><rect x="292.8" y="822" width="318.0" height="26" rx="3" fill="#161B26" /><text x="304.8" y="840" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" >Spørsmålet hører hjemme her · 04.09</text><line x1="970.9" y1="824" x2="970.9" y2="892" stroke="#161B26" stroke-width="2" /><rect x="920.9" y="824" width="100" height="22" rx="11" fill="#F6F5F1" stroke="#161B26" stroke-width="1.5" /><text x="970.9" y="840" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#161B26" text-anchor="middle" >I dag 10.11</text><rect x="1247.6" y="846" width="20" height="20" rx="2" fill="#161B26" /><rect x="1253.6" y="852" width="8" height="8" rx="1" fill="#FFFFFF" /><text x="1277.6" y="844" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#161B26" text-anchor="start" >Eksamen 08.12</text><text x="1277.6" y="864" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#161B26" text-anchor="start" >om 4 uker</text><text x="26" y="861" font-family="'Helvetica Neue', Arial, sans-serif" font-size="1" font-weight="400" fill="#161B26" text-anchor="start" ></text>
