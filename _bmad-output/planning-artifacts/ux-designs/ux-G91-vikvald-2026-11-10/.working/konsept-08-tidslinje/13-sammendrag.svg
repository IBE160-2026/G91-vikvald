', Arial, sans-serif" font-size="18" font-weight="400" fill="#4B5262" text-anchor="start" >Uke 37: Merkevare · laget 12.09.2026 fra 2 filer</text><rect x="1150" y="206" width="210" height="50" rx="4" fill="#FFFFFF" stroke="#161B26" stroke-width="2" /><text x="1255.0" y="237.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="middle" >Lag nytt sammendrag</text><text x="1360" y="278" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#4B5262" text-anchor="end" >Erstatter dette sammendraget</text><line x1="100" y1="330" x2="100" y2="744" stroke="#B83E0C" stroke-width="5" /><rect x="91" y="744" width="18" height="18" rx="2" fill="#161B26" /><circle cx="100" cy="324" r="12" fill="#B83E0C" stroke="#FFFFFF" stroke-width="3"/><text x="134" y="330" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#161B26" text-anchor="start" >1. Hva er en merkevare</text><line x1="100" y1="358" x2="122" y2="358" stroke="#B83E0C" stroke-width="3" /><circle cx="122" cy="358" r="4" fill="#B83E0C"/><text x="140" y="364" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >Et navn, symbol eller design som skiller et produkt fra konkurrentenes.</text><text x="1360" y="364" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="400" fill="#161B26" text-anchor="end" >merkevare-notater.pdf, side 2</text><line x1="140" y1="378" x2="1360" y2="378" stroke="#ECEAE4" stroke-width="1" /><line x1="100" y1="398" x2="122" y2="398" stroke="#B83E0C" stroke-width="3" /><circle cx="122" cy="398" r="4" fill="#B83E0C"/><text x="140" y="404" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >Merket er et løfte til kunden om hva hen kan forvente, hver gang.</text><text x="1360" y="404" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="400" fill="#161B26" text-anchor="end" >merkevare-notater.pdf, side 3</text><line x1="140" y1="418" x2="1360" y2="418" stroke="#ECEAE4" stroke-width="1" /><circle cx="100" cy="464" r="12" fill="#B83E0C" stroke="#FFFFFF" stroke-width="3"/><text x="134" y="470" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#161B26" text-anchor="start" >2. Merkevareekvitet</text><line x1="100" y1="498" x2="122" y2="498" stroke="#B83E0C" stroke-width="3" /><circle cx="122" cy="498" r="4" fill="#B83E0C"/><text x="140" y="504" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >Merverdien et merke gir ut over produktets funksjonelle egenskaper.</text><text x="1360" y="504" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="400" fill="#161B26" text-anchor="end" >merkevare-notater.pdf, side 4</text><line x1="140" y1="518" x2="1360" y2="518" stroke="#ECEAE4" stroke-width="1" /><line x1="100" y1="538" x2="122" y2="538" stroke="#B83E0C" stroke-width="3" /><circle cx="122" cy="538" r="4" fill="#B83E0C"/><text x="140" y="544" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >Bygges av kjennskap, assosiasjoner, oppfattet kvalitet og lojalitet.</text><text x="1360" y="544" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="400" fill="#161B26" text-anchor="end" >merkevare-notater.pdf, side 5</text><line x1="140" y1="558" x2="1360" y2="558" stroke="#ECEAE4" stroke-width="1" /><line x1="100" y1="578" x2="122" y2="578" stroke="#B83E0C" stroke-width="3" /><circle cx="122" cy="578" r="4" fill="#B83E0C"/><text x="140" y="584" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >Sterk ekvitet gjør at kundene betaler mer og bytter merke sjeldnere.</text><text x="1360" y="584" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="400" fill="#161B26" text-anchor="end" >merkevare-forelesning2.pdf, side 2</text><line x1="140" y1="598" x2="1360" y2="598" stroke="#ECEAE4" stroke-width="1" /><circle cx="100" cy="644" r="12" fill="#B83E0C" stroke="#FFFFFF" stroke-width="3"/><text x="134" y="650" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#161B26" text-anchor="start" >3. Merkevarestrategier</text><line x1="100" y1="678" x2="122" y2="678" stroke="#B83E0C" stroke-width="3" /><circle cx="122" cy="678" r="4" fill="#B83E0C"/><text x="140" y="684" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >Linjeutvidelse bruker et kjent merke på nye varianter i samme kategori.</text><text x="1360" y="684" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="400" fill="#161B26" text-anchor="end" >merkevare-forelesning2.pdf, side 3</text><line x1="140" y1="698" x2="1360" y2="698" stroke="#ECEAE4" stroke-width="1" /><line x1="100" y1="718" x2="122" y2="718" stroke="#B83E0C" stroke-width="3" /><circle cx="122" cy="718" r="4" fill="#B83E0C"/><text x="140" y="724" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >Merkeutvidelse tar merket inn i en ny kategori, med risiko for å utvanne det.</text><text x="1360" y="724" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="400" fill="#161B26" text-anchor="end" >merkevare-forelesning2.pdf, side 4</text><line x1="140" y1="738" x2="1360" y2="738" stroke="#ECEAE4" stroke-width="1" />
