s-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="start" >Riktig svar: Å skape et tydelig og ønsket bilde av merket i</text><text x="92" y="554" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="start" >målgruppens bevissthet.</text><path d="M 70 566 l 11 11 M 81 566 l -11 11" stroke="#B42318" stroke-width="3" stroke-linecap="round"/><text x="92" y="578" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#161B26" text-anchor="start" >Ditt svar: Å velge hvilke segmenter bedriften skal satse på.</text><text x="68" y="608" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#161B26" text-anchor="start" >Det du valgte, er målgruppevalg.</text><text x="68" y="636" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#161B26" text-anchor="start" text-decoration="underline">Kilde: merkevare-notater.pdf, side 7</text><rect x="730" y="440" width="670" height="206" rx="6" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="1" /><rect x="730" y="440" width="6" height="206" rx="0" fill="#B42318" /><text x="758" y="472" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#4B5262" text-anchor="start" >Spørsmål 6</text><circle cx="900" cy="467" r="6" fill="#B83E0C" stroke="#FFFFFF" stroke-width="2"/><text x="912" y="472" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#B83E0C" text-anchor="start" >Uke 35: Kjøpsatferd</text><text x="758" y="502" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#161B26" text-anchor="start" >Hva kjennetegner et høyinvolveringskjøp?</text><path d="M 758 528 l 5 5 l 9 -11" fill="none" stroke="#1D7037" stroke-width="3" stroke-linecap="round"/><text x="782" y="532" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="start" >Riktig svar: Kjøperen bruker mye tid på å søke informasjon og</text><text x="782" y="554" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="start" >sammenligne.</text><path d="M 760 566 l 11 11 M 771 566 l -11 11" stroke="#B42318" stroke-width="3" stroke-linecap="round"/><text x="782" y="578" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#161B26" text-anchor="start" >Ditt svar: Kjøpet skjer av vane, uten vurdering.</text><text x="758" y="608" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#161B26" text-anchor="start" >Vanekjøp er typisk lavinvolvering.</text><text x="758" y="636" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#161B26" text-anchor="start" text-decoration="underline">Kilde: kjopsatferd-notater.pdf, side 5</text><rect x="40" y="662" width="670" height="206" rx="6" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="1" /><rect x="40" y="662" width="6" height="206" rx="0" fill="#B42318" /><text x="68" y="694" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#4B5262" text-anchor="start" >Spørsmål 9</text><circle cx="210" cy="689" r="6" fill="#B83E0C" stroke="#FFFFFF" stroke-width="2"/><text x="222" y="694" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#B83E0C" text-anchor="start" >Uke 36: Segmentering og posisjonering</text><text x="68" y="724" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#161B26" text-anchor="start" >Hvilken er en demografisk segmenteringsvariabel?</text><path d="M 68 750 l 5 5 l 9 -11" fill="none" stroke="#1D7037" stroke-width="3" stroke-linecap="round"/><text x="92" y="754" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="start" >Riktig svar: Alder.</text