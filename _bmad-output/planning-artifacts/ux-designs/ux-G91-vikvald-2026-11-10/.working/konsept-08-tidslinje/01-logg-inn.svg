<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" role="img">
<title>Studiekamerat – logg inn</title>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#FBE8E6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#B42318" stroke-width="3"/></pattern></defs>
<rect width="1440" height="900" fill="#F6F5F1"/>
<rect x="720" y="0" width="720" height="900" rx="0" fill="#FFFFFF" /><line x1="80" y1="80" x2="106" y2="80" stroke="#B83E0C" stroke-width="5" stroke-linecap="round"/><circle cx="93" cy="80" r="6" fill="#FFFFFF" stroke="#B83E0C" stroke-width="3"/><text x="118" y="87" font-family="'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="800" fill="#161B26" text-anchor="start" >Studiekamerat</text><text x="80" y="210" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#161B26" text-anchor="start" >Hele semesteret</text><text x="80" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="800" fill="#161B26" text-anchor="start" >på én linje.</text><text x="80" y="318" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#161B26" text-anchor="start" >Last opp forelesningsnotatene dine, øv på dem, og se</text>
<text x="80" y="346" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#161B26" text-anchor="start" >hele tiden hvor langt det er igjen til eksamen.</text><path d="M 80 470 L 440 470 L 530 560 L 620 560" fill="none" stroke="#B83E0C" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><circle cx="120" cy="470" r="8" fill="#B83E0C" stroke="#B83E0C" stroke-width="3.5"/><circle cx="180" cy="470" r="8" fill="#B83E0C" stroke="#B83E0C" stroke-width="3.5"/><circle cx="240" cy="470" r="8" fill="#B83E0C" stroke="#B83E0C" stroke-width="3.5"/><circle cx="300" cy="470" r="8" fill="#B83E0C" stroke="#B83E0C" stroke-width="3.5"/><circle cx="360" cy="470" r="8" fill="#FFFFFF" stroke="#B83E0C" stroke-width="3.5"/><circle cx="420" cy="470" r="8" fill="#FFFFFF" stroke="#B83E0C" stroke-width="3.5"/><text x="80" y="452" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#B83E0C" text-anchor="start" >Markedsføring</text><path d="M 80 560 L 440 560 L 440 560 L 620 560" fill="none" stroke="#0B6585" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><circle cx="140" cy="560" r="8" fill="#0B6585" stroke="#0B6585" stroke-width="3.5"/><circle cx="230" cy="560" r="8" fill="#0B6585" stroke="#0B6585" stroke-width="3.5"/><circle cx="320" cy="560" r="8" fill="#FFFFFF" stroke="#0B6585" stroke-width="3.5"/><circle cx="410" cy="560" r="8" fill="#FFFFFF" stroke="#0B6585" stroke-width="3.5"/><text x="80" y="542" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#0B6585" text-anchor="start" >Samfunnsøkonomi</text><path d="M 80 650 L 440 650 L 530 560 L 620 560" fill="none" stroke="#2D6A3B" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><circle cx="330" cy="650" r="8" fill="#FFFFFF" stroke="#2D6A3B" stroke-width="3.5"/><circle cx="400" cy="650" r="8" fill="#FFFFFF" stroke="#2D6A3B" stroke-width="3.5"/><text x="80" y="632" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#2D6A3B" text-anchor="start" >Organisasjon og ledelse</text><line x1="560" y1="410" x2="560" y2="690" stroke="#161B26" stroke-width="2" stroke-dasharray="4 5"/><text x="560" y="712" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#161B26" text-anchor="middle" >I dag</text><rect x="620" y="540" width="44" height="40" rx="3" fill="#161B26" /><rect x="632" y="552" width="20" height="16" rx="2" fill="#FFFFFF" /><text x="642" y="610" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#161B26" text-anchor="middle" >Eksamen</text><text x="80" y="800" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5262" text-anchor="start" >Et studentprosjekt i IBE160 · Notatene dine er bare synlige for deg.</text><text x="880" y="190" font-family="'Helvetica Neue', Arial, sans-serif" font-size="36" font-weight="800" fill="#161B26" text-anchor="start" >Logg inn</text><text x="880" y="226" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4B5262" text-anchor="start" >Velkommen tilbake. Fortsett der du slapp.</text><text x="880" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="start" >E-post</text><rect x="880" y="302" width="440" height="52" rx="4" fill="#FFFFFF" stroke="#161B26" stroke-width="1.5" /><text x="896" y="335" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >klara@example.no</text><text x="880" y="396" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="start" >Passord</text><rect x="880" y="408" width="440" height="52" rx="4" fill="#FFFFFF" stroke="#B42318" stroke-width="2.5" /><text x="896" y="441" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >••••••</text><text x="1304" y="441" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="end" text-decoration="underline">Vis</text><path d="M 881 478 l 11 11 M 892 478 l -11 11" stroke="#B42318" stroke-width="3" stroke-linecap="round"/><text x="902" y="489" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#B42318" text-anchor="start" >Feil e-post eller passord. Prøv igjen.</text><rect x="880" y="524" width="440" height="54" rx="4" fill="#161B26" /><text x="1100.0" y="557.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Logg inn</text><line x1="880" y1="614" x2="1320" y2="614" stroke="#D6D3CB" stroke-width="1" /><text x="880" y="652" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >Ny her?</text><text x="950" y="652" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#161B26" text-anchor="start" text-decoration="underline">Opprett konto</text><text x="880" y="690" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5262" text-anchor="start" text-decoration="underline">Glemt passordet?</text>
</svg>
