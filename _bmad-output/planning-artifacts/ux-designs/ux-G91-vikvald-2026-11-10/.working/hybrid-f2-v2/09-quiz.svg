="1"/><text x="164.5" y="367.5" font-size="12" font-weight="400" fill="#4F5968" text-anchor="middle">10</text><rect x="188.5" y="345.5" width="34" height="34" rx="6" fill="none" stroke="#B6C1CE" stroke-width="1"/><text x="205.5" y="367.5" font-size="12" font-weight="400" fill="#4F5968" text-anchor="middle">11</text><rect x="229.5" y="345.5" width="34" height="34" rx="6" fill="none" stroke="#B6C1CE" stroke-width="1"/><text x="246.5" y="367.5" font-size="12" font-weight="400" fill="#4F5968" text-anchor="middle">12</text><rect x="24.5" y="386.5" width="34" height="34" rx="6" fill="none" stroke="#B6C1CE" stroke-width="1"/><text x="41.5" y="408.5" font-size="12" font-weight="400" fill="#4F5968" text-anchor="middle">13</text><rect x="65.5" y="386.5" width="34" height="34" rx="6" fill="none" stroke="#B6C1CE" stroke-width="1"/><text x="82.5" y="408.5" font-size="12" font-weight="400" fill="#4F5968" text-anchor="middle">14</text><rect x="106.5" y="386.5" width="34" height="34" rx="6" fill="none" stroke="#B6C1CE" stroke-width="1"/><text x="123.5" y="408.5" font-size="12" font-weight="400" fill="#4F5968" text-anchor="middle">15</text><rect x="24" y="436" width="20" height="20" rx="4" fill="#E8F3EB"/><g transform="translate(26 438) scale(1)" fill="none" stroke="#1C6E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.25 3.25L13 4.5"/></g><text x="56" y="451" font-size="14" font-weight="400" fill="#15181F">Riktig</text><rect x="24" y="468" width="20" height="20" rx="4" fill="#FCEBE9"/><g transform="translate(26 470) scale(1)" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></g><text x="56" y="483" font-size="14" font-weight="400" fill="#15181F">Feil</text><rect x="24.5" y="500.5" width="19" height="19" rx="4" fill="none" stroke="#B6C1CE" stroke-width="1"/><text x="56" y="515" font-size="14" font-weight="400" fill="#15181F">Ikke besvart ennå</text><rect x="24.5" y="836.5" width="239" height="39" rx="8" fill="#FFFFFF" stroke="#7F8A99" stroke-width="1" filter="url(#lift)"/><text x="105.2" y="861.2" font-size="15" font-weight="600" fill="#15181F">Avslutt økt</text><text x="448" y="172" font-size="12" font-weight="600" fill="#566070" letter-spacing="0.8">SPØRSMÅL 4 AV 15</text><text x="448" y="208" font-size="26" font-weight="600" fill="#15181F" letter-spacing="-0.4">Hvilken av disse beskriver best posisjonering?</text><text x="448" y="236" font-size="15" font-weight="400" fill="#566070">Du svarte C. Svaret er bekreftet.</text><rect x="448.8" y="264.8" width="830.5" height="62.5" rx="10" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1" filter="url(#lift)"/><rect x="464.5" y="280.5" width="31" height="31" rx="7" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1"/><text x="480" y="301" font-size="14" font-weight="600" fill="#15181F" text-anchor="middle">A</text><text x="512" y="301.5" font-size="16" font-weight="400" fill="#15181F">Å dele markedet inn i grupper med like behov</text><rect x="448.8" y="340.8" width="830.5" height="62.5" rx="10" fill="#E8F3EB" stroke="#1C6E36" stroke-width="1.5"/><rect x="464.5" y="356.5" width="31" height="31" rx="7" fill="#FFFFFF" stroke="#1C6E36" stroke-width="1"/><text x="480" y="377" font-size="14" font-weight="600" fill="#15181F" text-anchor="middle">B</text><text x="512" y="377.5" font-size="16" font-weight="600" fill="#15181F">Å skape et tydelig og ønsket bilde av merket i målgruppens bevissthet</text><g transform="translate(1162.3 364) scale(1)" fill="none" stroke="#1C6E36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.25 3.25L13 4.5"/></g><text x="1256" y="377" font-size="14" font-weight="600" fill="#1C6E36" text-anchor="end">Riktig svar</text><rect x="448.8" y="416.8" width="830.5" height="62.5" rx="10" fill="#FCEBE9" stroke="#B42318" stroke-width="1.5"/><rect x="464.5" y="432.5" width="31" height="31" rx="7" fill="#FFFFFF" stroke="#B42318" stroke-width="1"/><text x="480" y="453" font-size="14" font-weight="600" fill="#15181F" text-anchor="middle">C</text><text x="512" y="453.5" font-size="16" font-weight="400" fill="#15181F">Å velge hvilke segmenter bedriften skal satse på</text><g transform="translate(1176.4 440) scale(1)" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l8 8"/><path d="M12 4l-8 8"/></g><text x="1256" y="453" font-size="14" font-weight="600" fill="#B42318" text-anchor="end">Ditt svar</text><rect x="448.8" y="492.8" width="830.5" height="62.5" rx="10" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1" filter="url(#lift)"/><rect x="464.5" y="508.5" width="31" height="31" rx="7" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1"/><text x="480" y="529" font-size="14" font-weight="600" fill="#15181F" text-anchor="middle">D</text><text x="512" y="529.5" font-size="16" font-weight="400" fill="#15181F">Å fastsette prisen ut fra konkurrentenes priser</text><rect x="448" y="580" width="832" height="160" rx="12" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1" filter="url(#lift)"/><text x="472" y="616" font-size="15" font-weight="600" fill="#15181F">Forklaring</text><text x="472" y="644" font-size="16" font-weight="400" fill="#15181F">Posisjonering handler om hvilket bilde merket skal ha i målgruppens bevissthet, sammenlignet med</text><text x="472" y="668" font-size="16" font-weight="400" fill="#15181F">konkurrentene. C beskriver målgruppevalg: å velge segmenter. Det skjer før posisjoneringen.</text><line x1="449" y1="692.5" x2="1279" y2="692.5" stroke="#E8ECF0" stroke-width="1"/><g transform="translate(472 708) scale(1)" fill="none" stroke="#566070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="496" y="721" font-size="14" font-weight="400" fill="#566070">Kilde</text><text x="535.6" y="721" font-size="14" font-weight="500" fill="#15181F">merkevare-notater.pdf, side 7</text><line x1="535.6" y1="725.5" x2="732.1" y2="725.5" stroke="#DCE1E7" stroke-width="1"/><circle cx="1119.8" cy="716" r="4" fill="#B83E0C"/><text x="1256" y="721" font-size="14" font-weight="400" fill="#566070" text-anchor="end">Uke 37: Merkevare</text><rect x="1088" y="768" width="196" height="56" rx="11" fill="none" stroke="#2A5BD7" stroke-width="2"/><rect x="1092" y="772" width="188" height="48" rx="8" fill="#1F2D42"/><text x="1116" y="801.6" font-size="16" font-weight="600" fill="#FFFFFF">Neste spørsmål</text><g transform="translate(1240 788) scale(1)" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10"/><path d="M9 4l4 4-4 4"/></g><rect x="448.5" y="786.5" width="37.4" height="21" rx="5" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1"/><text x="467.2" y="801.5" font-size="12" font-weight="500" fill="#566070" text-anchor="middle">A–D</text><text x="494.4" y="802" font-size="14" font-weight="400" fill="#566070">velg svar</text><rect x="576.8" y="786.5" width="43.7" height="21" rx="5" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1"/><text x="598.6" y="801.5" font-size="12" font-weight="500" fill="#566070" text-anchor="middle">Enter</text><text x="629" y="802" font-size="14" font-weight="400" fill="#566070">neste spørsmål</text><rect x="750.5" y="786.5" width="33.2" height="21" rx="5" fill="#FFFFFF" stroke="#DCE1E7" stroke-width="1"/><text x="767.1" y="801.5" font-size="12" font-weight="500" fill="#566070" text-anchor="middle">Esc</text><text x="792.2" y="802" font-size="14" font-weight="400" fill="#566070">avslutt</text>
