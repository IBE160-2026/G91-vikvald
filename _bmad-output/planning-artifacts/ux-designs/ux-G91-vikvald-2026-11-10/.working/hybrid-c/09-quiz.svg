idth="420" height="450" rx="6" fill="#FFFFFF" stroke="#161B26" stroke-width="2" /><text x="992" y="184" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#161B26" text-anchor="start" >Forklaring</text><text x="992" y="222" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >Posisjonering handler om hvilket bilde</text>
