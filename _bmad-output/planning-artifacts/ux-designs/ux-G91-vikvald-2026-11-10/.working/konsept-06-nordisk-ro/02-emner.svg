<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Gill Sans', 'Gill Sans MT', Seravek, 'Segoe UI', Calibri, 'Helvetica Neue', Arial, sans-serif">
<title>Studiekamerat – Emnene dine</title>
<rect width="1440" height="900" fill="#F3F0E8"/>
<text x="64" y="46" font-size="19" fill="#2E4A3B" font-weight="600" text-anchor="start" letter-spacing="0.4">Studiekamerat</text><path d="M44 48 L50 30 L56 48 Z" fill="#2E4A3B"/><text x="1176" y="46" font-size="16" fill="#2E4A3B" font-weight="500" text-anchor="start" >Emner</text><line x1="1176" y1="54" x2="1218.0" y2="54" stroke="#2E4A3B" stroke-width="1.5"/><text x="1256" y="46" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Konto</text><text x="1336" y="46" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Logg ut</text><text x="360" y="192" font-size="44" fill="#232B27" font-weight="300" text-anchor="start" >Emnene dine</text><text x="360" y="232" font-size="17" fill="#56615B" font-weight="400" text-anchor="start" >Velg et emne for å se forelesningene og øve.</text><rect x="930" y="168" width="150" height="48" rx="6" fill="none" stroke="#2E4A3B" stroke-width="1.5"/><text x="1005.0" y="198.0" font-size="16" fill="#2E4A3B" font-weight="500" text-anchor="middle" >+ Nytt emne</text><line x1="360" y1="312" x2="1080" y2="312" stroke="#DDD6C6" stroke-width="1"/><text x="360" y="368" font-size="26" fill="#232B27" font-weight="400" text-anchor="start" >Markedsføring</text><text x="360" y="398" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >8 forelesninger  ·  Sist øvd i går</text><path d="M1056 372 h18 m-7 -7 l7 7 l-7 7" fill="none" stroke="#2E4A3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="360" y1="432" x2="1080" y2="432" stroke="#DDD6C6" stroke-width="1"/><text x="360" y="488" font-size="26" fill="#232B27" font-weight="400" text-anchor="start" >Samfunnsøkonomi</text><text x="360" y="518" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >5 forelesninger  ·  Sist øvd for 6 dager siden</text><path d="M1056 492 h18 m-7 -7 l7 7 l-7 7" fill="none" stroke="#2E4A3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="360" y1="552" x2="1080" y2="552" stroke="#DDD6C6" stroke-width="1"/><text x="360" y="608" font-size="26" fill="#232B27" font-weight="400" text-anchor="start" >Organisasjon og ledelse</text><text x="360" y="638" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >2 forelesninger  ·  Ikke øvd ennå</text><path d="M1056 612 h18 m-7 -7 l7 7 l-7 7" fill="none" stroke="#2E4A3B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="360" y1="672" x2="1080" y2="672" stroke="#DDD6C6" stroke-width="1"/><text x="720" y="780" font-size="16" fill="#56615B" font-weight="400" text-anchor="middle" >Et emne samler forelesningene dine. Under hver forelesning legger du notatene.</text>
</svg>
