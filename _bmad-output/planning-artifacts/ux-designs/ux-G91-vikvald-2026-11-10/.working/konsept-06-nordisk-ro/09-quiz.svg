<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Gill Sans', 'Gill Sans MT', Seravek, 'Segoe UI', Calibri, 'Helvetica Neue', Arial, sans-serif">
<title>Studiekamerat – Quiz, spørsmål 4 av 15</title>
<rect width="1440" height="900" fill="#F3F0E8"/>
<path d="M64 33 l10 10 M74 33 l-10 10" stroke="#56615B" stroke-width="1.6" stroke-linecap="round"/><text x="84" y="44" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Avslutt quiz</text><text x="720" y="44" font-size="16" fill="#56615B" font-weight="400" text-anchor="middle" >Uke 37: Merkevare  ·  Quiz</text><text x="1376" y="44" font-size="16" fill="#232B27" font-weight="500" text-anchor="end" >Spørsmål 4 av 15</text><rect x="0" y="72" width="1440" height="3" fill="#E7E0D0"/><rect x="0" y="72" width="384" height="3" fill="#2E4A3B"/><text x="360" y="156" font-size="28" fill="#232B27" font-weight="400" text-anchor="start" >Hvilken av disse beskriver best posisjonering?</text><rect x="360" y="192" width="720" height="64" rx="6" fill="#FBFAF7" stroke="#DDD6C6" stroke-width="1"/><text x="384" y="231" font-size="18" fill="#56615B" font-weight="600" text-anchor="start" >A</text><text x="416" y="231" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Å dele markedet inn i grupper med like behov</text><rect x="360" y="268" width="720" height="64" rx="6" fill="#E3EBE3" stroke="#2E4A3B" stroke-width="2"/><text x="384" y="307" font-size="18" fill="#2E4A3B" font-weight="600" text-anchor="start" >B</text><text x="416" y="296" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Å skape et tydelig og ønsket bilde av merket i</text><text x="416" y="318" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >målgruppens bevissthet</text><path d="M930 301 l5 6 l10 -12" fill="none" stroke="#2E4A3B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="1056" y="307" font-size="16" fill="#2E4A3B" font-weight="600" text-anchor="end" >Riktig svar</text><rect x="360" y="344" width="720" height="64" rx="6" fill="#F6E4DE" stroke="#9B3A2C" stroke-width="2"/><text x="384" y="383" font-size="18" fill="#9B3A2C" font-weight="600" text-anchor="start" >C</text><text x="416" y="383" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Å velge hvilke segmenter bedriften skal satse på</text><path d="M950 371 l11 11 M961 371 l-11 11" stroke="#9B3A2C" stroke-width="2.2" stroke-linecap="round"/><text x="1056" y="383" font-size="16" fill="#9B3A2C" font-weight="600" text-anchor="end" >Ditt svar</text><rect x="360" y="420" width="720" height="64" rx="6" fill="#FBFAF7" stroke="#DDD6C6" stroke-width="1"/><text x="384" y="459" font-size="18" fill="#56615B" font-weight="600" text-anchor="start" >D</text><text x="416" y="459" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Å fastsette prisen ut fra konkurrentenes priser</text><path d="M360 533 l11 11 M371 533 l-11 11" stroke="#9B3A2C" stroke-width="2.2" stroke-linecap="round"/><text x="384" y="544" font-size="20" fill="#9B3A2C" font-weight="500" text-anchor="start" >Ikke riktig denne gangen.</text><text x="360" y="584" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Posisjonering handler om hvilket bilde merket skal ha i målgruppens bevissthet,</text>
<text x="360" y="612" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >sammenlignet med konkurrentene. Å velge segmenter (C) kalles målgruppevalg og kommer før</text>
<text x="360" y="640" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >posisjoneringen.</text><text x="360" y="676" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Kilde: merkevare-notater.pdf, side 7</text><rect x="878" y="744" width="202" height="52" rx="6" fill="#2E4A3B" stroke="#2E4A3B" stroke-width="1.5"/><text x="979.0" y="776.0" font-size="16" fill="#FFFFFF" font-weight="500" text-anchor="middle" >Neste spørsmål  →</text><text x="360" y="776" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >3 riktige så langt</text>
</svg>
