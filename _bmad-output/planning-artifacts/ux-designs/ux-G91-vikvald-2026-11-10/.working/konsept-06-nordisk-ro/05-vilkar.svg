<rect x="1167" y="328" width="73" height="40" rx="6" fill="#2E4A3B" stroke="#2E4A3B" stroke-width="1.5"/><text x="1203.5" y="354.0" font-size="16" fill="#FFFFFF" font-weight="500" text-anchor="middle" >Øv</text><text x="1147" y="354" font-size="16" fill="#2E4A3B" font-weight="400" text-anchor="end" text-decoration="underline">Lag flere</text><line x1="760" y1="384" x2="1240" y2="384" stroke="#DDD6C6"/><text x="760" y="416" font-size="18" fill="#232B27" font-weight="500" text-anchor="start" >Quiz</text><text x="760" y="440" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >15 spørsmål</text><rect x="1124" y="400" width="116" height="40" rx="6" fill="none" stroke="#2E4A3B" stroke-width="1.5"/><text x="1182.0" y="426.0" font-size="16" fill="#2E4A3B" font-weight="500" text-anchor="middle" >Ta quiz</text><text x="1104" y="426" font-size="16" fill="#2E4A3B" font-weight="400" text-anchor="end" text-decoration="underline">Lag flere</text><line x1="760" y1="456" x2="1240" y2="456" stroke="#DDD6C6"/><text x="760" y="488" font-size="18" fill="#232B27" font-weight="500" text-anchor="start" >Huskeregler</text><text x="760" y="512" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >3 modellkort</text><rect x="1167" y="472" width="73" height="40" rx="6" fill="none" stroke="#2E4A3B" stroke-width="1.5"/><text x="1203.5" y="498.0" font-size="16" fill="#2E4A3B" font-weight="500" text-anchor="middle" >Øv</text><text x="1147" y="498" font-size="16" fill="#2E4A3B" font-weight="400" text-anchor="end" text-decoration="underline">Lag flere</text><line x1="760" y1="528" x2="1240" y2="528" stroke="#DDD6C6"/><text x="760" y="560" font-size="18" fill="#232B27" font-weight="500" text-anchor="start" >Fritekstspørsmål</text><text x="760" y="584" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Ingen ennå</text><rect x="1159" y="544" width="81" height="40" rx="6" fill="none" stroke="#2E4A3B" stroke-width="1.5"/><text x="1199.5" y="570.0" font-size="16" fill="#2E4A3B" font-weight="500" text-anchor="middle" >Lag</text><line x1="760" y1="600" x2="1240" y2="600" stroke="#DDD6C6"/><text x="760" y="632" font-size="18" fill="#232B27" font-weight="500" text-anchor="start" >Sammendrag</text><text x="760" y="656" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Ikke laget</text><rect x="1159" y="616" width="81" height="40" rx="6" fill="none" stroke="#2E4A3B" stroke-width="1.5"/><text x="1199.5" y="642.0" font-size="16" fill="#2E4A3B" font-weight="500" text-anchor="middle" >Lag</text><line x1="760" y1="672" x2="1240" y2="672" stroke="#DDD6C6"/><text x="760" y="712" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Alt innhold viser hvilken fil og side det kommer fra.</text><rect width="1440" height="900" fill="#232B27" opacity="0.42"/><rect x="400" y="96" width="640" height="712" rx="8" fill="#FBFAF7"/><text x="456" y="168" font-size="32" fill="#232B27" font-weight="300" text-anchor="start" >Før du laster opp</text><text x="456" y="204" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Les dette én gang. Du må godta før første opplasting.</text><line x1="456" y1="258" x2="468" y2="258" stroke="#2E4A3B" stroke-width="2"/><text x="484" y="264" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Du er selv ansvarlig for materialet du laster opp.</text><line x1="456" y1="307" x2="468" y2="307" stroke="#2E4A3B" stroke-width="2"/><text x="484" y="313" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Last bare opp egne notater eller materiale du har rett til å</text>
<text x="484" y="340" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >bruke.</text><line x1="456" y1="383" x2="468" y2="383" stroke="#2E4A3B" stroke-width="2"/><text x="484" y="389" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Notatene sendes til språkmodellen hos Google, i EU, for å</text>
<text x="484" y="416" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >lage øvingsmateriale.</text><line x1="456" y1="459" x2="468" y2="459" stroke="#2E4A3B" stroke-width="2"/><text x="484" y="465" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Google kan logge forespørslene en periode for å oppdage</text>
<text x="484" y="492" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >misbruk.</text><line x1="456" y1="535" x2="468" y2="535" stroke="#2E4A3B" stroke-width="2"/><text x="484" y="541" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Ikke last opp personopplysninger, for eksempel navn på</text>
