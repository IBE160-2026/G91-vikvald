<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Gill Sans', 'Gill Sans MT', Seravek, 'Segoe UI', Calibri, 'Helvetica Neue', Arial, sans-serif">
<title>Studiekamerat – Sammendrag Uke 37</title>
<rect width="1440" height="900" fill="#F3F0E8"/>
<text x="64" y="46" font-size="19" fill="#2E4A3B" font-weight="600" text-anchor="start" letter-spacing="0.4">Studiekamerat</text><path d="M44 48 L50 30 L56 48 Z" fill="#2E4A3B"/><text x="1176" y="46" font-size="16" fill="#2E4A3B" font-weight="500" text-anchor="start" >Emner</text><line x1="1176" y1="54" x2="1218.0" y2="54" stroke="#2E4A3B" stroke-width="1.5"/><text x="1256" y="46" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Konto</text><text x="1336" y="46" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Logg ut</text><text x="400" y="118" font-size="16"><tspan fill="#56615B" text-decoration="underline">Emner</tspan><tspan dx="10" fill="#56615B">/</tspan><tspan dx="10" fill="#56615B" text-decoration="underline">Markedsføring</tspan><tspan dx="10" fill="#56615B">/</tspan><tspan dx="10" fill="#56615B" text-decoration="underline">Uke 37: Merkevare</tspan><tspan dx="10" fill="#56615B">/</tspan><tspan dx="10" fill="#232B27">Sammendrag</tspan></text><text x="400" y="178" font-size="44" fill="#232B27" font-weight="300" text-anchor="start" >Sammendrag</text><text x="400" y="212" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Uke 37: Merkevare · laget 11.09.2026 fra 2 filer</text><rect x="821" y="168" width="219" height="44" rx="6" fill="none" stroke="#2E4A3B" stroke-width="1.5"/><text x="930.5" y="196.0" font-size="16" fill="#2E4A3B" font-weight="500" text-anchor="middle" >Lag nytt sammendrag</text><text x="1040" y="232" font-size="14" fill="#56615B" font-weight="400" text-anchor="end" >Erstatter dette sammendraget</text><text x="400" y="292" font-size="20" fill="#2E4A3B" font-weight="600" text-anchor="start" >Hva er en merkevare</text><circle cx="404" cy="322" r="3" fill="#56615B"/><text x="424" y="328" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Et merke er et navn, symbol eller design som skiller et produkt fra</text>
<text x="424" y="354" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >konkurrentenes.</text><text x="424" y="378" font-size="15" fill="#56615B" font-weight="400" text-anchor="start" >Kilde: merkevare-notater.pdf, side 2</text><circle cx="404" cy="404" r="3" fill="#56615B"/><text x="424" y="410" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >En merkevare er summen av inntrykkene kunden har av merket, ikke bare</text>
<text x="424" y="436" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >logoen.</text><text x="424" y="460" font-size="15" fill="#56615B" font-weight="400" text-anchor="start" >Kilde: merkevare-notater.pdf, side 3</text><text x="400" y="510" font-size="20" fill="#2E4A3B" font-weight="600" text-anchor="start" >Merkevareekvitet</text><circle cx="404" cy="540" r="3" fill="#56615B"/><text x="424" y="546" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Merkevareekvitet er merverdien merket gir, ut over produktets funksjonelle</text>
<text x="424" y="572" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >egenskaper.</text><text x="424" y="596" font-size="15" fill="#56615B" font-weight="400" text-anchor="start" >Kilde: merkevare-notater.pdf, side 4</text><circle cx="404" cy="622" r="3" fill="#56615B"/><text x="424" y="628" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Den bygges av kjennskap, assosiasjoner, oppfattet kvalitet og lojalitet.</text><text x="424" y="652" font-size="15" fill="#56615B" font-weight="400" text-anchor="start" >Kilde: merkevare-notater.pdf, side 5</text><text x="400" y="702" font-size="20" fill="#2E4A3B" font-weight="600" text-anchor="start" >Merkevarestrategier</text><circle cx="404" cy="732" r="3" fill="#56615B"/><text x="424" y="738" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Paraplystrategi betyr at flere produkter deler samme merkenavn.</text><text x="424" y="762" font-size="15" fill="#56615B" font-weight="400" text-anchor="start" >Kilde: merkevare-forelesning2.pdf, side 2</text><circle cx="404" cy="788" r="3" fill="#56615B"/><text x="424" y="794" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Individuell strategi gir hvert produkt sitt eget navn, og sprer risikoen.</text><text x="424" y="818" font-size="15" fill="#56615B" font-weight="400" text-anchor="start" >Kilde: merkevare-forelesning2.pdf, side 3</text>
</svg>
