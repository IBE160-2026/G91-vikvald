<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Gill Sans', 'Gill Sans MT', Seravek, 'Segoe UI', Calibri, 'Helvetica Neue', Arial, sans-serif">
<title>Studiekamerat – Quizresultat</title>
<rect width="1440" height="900" fill="#F3F0E8"/>
<path d="M64 33 l10 10 M74 33 l-10 10" stroke="#56615B" stroke-width="1.6" stroke-linecap="round"/><text x="84" y="44" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Lukk</text><text x="720" y="44" font-size="16" fill="#56615B" font-weight="400" text-anchor="middle" >Uke 37: Merkevare  ·  Quiz</text><text x="1376" y="44" font-size="16" fill="#232B27" font-weight="500" text-anchor="end" >Ferdig</text><rect x="0" y="72" width="1440" height="3" fill="#E7E0D0"/><rect x="0" y="72" width="1440" height="3" fill="#2E4A3B"/><text x="320" y="176" font-size="48" fill="#232B27" font-weight="300" text-anchor="start" >11 av 15 riktige</text><text x="320" y="214" font-size="17" fill="#56615B" font-weight="400" text-anchor="start" >Godt jobbet. Her er de fire du bommet på, med riktig svar.</text><rect x="864" y="142" width="256" height="48" rx="6" fill="none" stroke="#2E4A3B" stroke-width="1.5"/><text x="992.0" y="172.0" font-size="16" fill="#2E4A3B" font-weight="500" text-anchor="middle" >Tilbake til forelesningen</text><rect x="688" y="142" width="160" height="48" rx="6" fill="#2E4A3B" stroke="#2E4A3B" stroke-width="1.5"/><text x="768.0" y="172.0" font-size="16" fill="#FFFFFF" font-weight="500" text-anchor="middle" >Ta quizen igjen</text><line x1="320" y1="256" x2="1120" y2="256" stroke="#DDD6C6"/><text x="320" y="292" font-size="19" fill="#232B27" font-weight="500" text-anchor="start" >1.  Hvilken av disse beskriver best posisjonering?</text><path d="M346 318 l5 6 l10 -12" fill="none" stroke="#2E4A3B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="368" y="324" font-size="16" fill="#2E4A3B" font-weight="500" text-anchor="start" >Riktig svar: Å skape et tydelig og ønsket bilde av merket i målgruppens bevissthet</text><path d="M347 343 l11 11 M358 343 l-11 11" stroke="#9B3A2C" stroke-width="2.2" stroke-linecap="round"/><text x="368" y="354" font-size="16" fill="#9B3A2C" font-weight="400" text-anchor="start" >Ditt svar: Å velge hvilke segmenter bedriften skal satse på</text><text x="368" y="384" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Segmentvalg kommer før posisjonering.</text><text x="1120" y="384" font-size="16" fill="#56615B" font-weight="400" text-anchor="end" >Kilde: merkevare-notater.pdf, side 7</text><line x1="320" y1="410" x2="1120" y2="410" stroke="#DDD6C6"/><text x="320" y="446" font-size="19" fill="#232B27" font-weight="500" text-anchor="start" >2.  Hva er merkevareekvitet?</text><path d="M346 472 l5 6 l10 -12" fill="none" stroke="#2E4A3B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="368" y="478" font-size="16" fill="#2E4A3B" font-weight="500" text-anchor="start" >Riktig svar: Merverdien et merke gir, ut over produktets funksjonelle egenskaper</text><path d="M347 497 l11 11 M358 497 l-11 11" stroke="#9B3A2C" stroke-width="2.2" stroke-linecap="round"/><text x="368" y="508" font-size="16" fill="#9B3A2C" font-weight="400" text-anchor="start" >Ditt svar: Den regnskapsmessige verdien av varemerket</text><text x="368" y="538" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Ekvitet handler om kundens oppfatning, ikke regnskap.</text><text x="1120" y="538" font-size="16" fill="#56615B" font-weight="400" text-anchor="end" >Kilde: merkevare-notater.pdf, side 4</text><line x1="320" y1="564" x2="1120" y2="564" stroke="#DDD6C6"/><text x="320" y="600" font-size="19" fill="#232B27" font-weight="500" text-anchor="start" >3.  Hva kjennetegner en paraplystrategi?</text><path d="M346 626 l5 6 l10 -12" fill="none" stroke="#2E4A3B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="368" y="632" font-size="16" fill="#2E4A3B" font-weight="500" text-anchor="start" >Riktig svar: Flere produkter selges under samme merkenavn</text><path d="M347 651 l11 11 M358 651 l-11 11" stroke="#9B3A2C" stroke-width="2.2" stroke-linecap="round"/><text x="368" y="662" font-size="16" fill="#9B3A2C" font-weight="400" text-anchor="start" >Ditt svar: Hvert produkt får sitt eget merkenavn</text><text x="368" y="692" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Det siste kalles individuell merkestrategi.</text><text x="1120" y="692" font-size="16" fill="#56615B" font-weight="400" text-anchor="end" >Kilde: merkevare-forelesning2.pdf, side 2</text><line x1="320" y1="718" x2="1120" y2="718" stroke="#DDD6C6"/><text x="320" y="754" font-size="19" fill="#232B27" font-weight="500" text-anchor="start" >4.  Hvilket ledd i AIDA handler om å vekke ønske om produktet?</text><path d="M346 780 l5 6 l10 -12" fill="none" stroke="#2E4A3B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="368" y="786" font-size="16" fill="#2E4A3B" font-weight="500" text-anchor="start" >Riktig svar: Desire (ønske)</text><path d="M347 805 l11 11 M358 805 l-11 11" stroke="#9B3A2C" stroke-width="2.2" stroke-linecap="round"/><text x="368" y="816" font-size="16" fill="#9B3A2C" font-weight="400" text-anchor="start" >Ditt svar: Interest (interesse)</text><text x="368" y="846" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Interesse kommer før ønske i modellen.</text><text x="1120" y="846" font-size="16" fill="#56615B" font-weight="400" text-anchor="end" >Kilde: merkevare-notater.pdf, side 9</text>
</svg>
