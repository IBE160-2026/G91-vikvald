<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Gill Sans', 'Gill Sans MT', Seravek, 'Segoe UI', Calibri, 'Helvetica Neue', Arial, sans-serif">
<title>Studiekamerat – Fritekstspørsmål 2 av 10</title>
<rect width="1440" height="900" fill="#F3F0E8"/>
<path d="M64 33 l10 10 M74 33 l-10 10" stroke="#56615B" stroke-width="1.6" stroke-linecap="round"/><text x="84" y="44" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Avslutt økt</text><text x="720" y="44" font-size="16" fill="#56615B" font-weight="400" text-anchor="middle" >Markedsføring (hele emnet)  ·  Fritekst</text><text x="1376" y="44" font-size="16" fill="#232B27" font-weight="500" text-anchor="end" >Spørsmål 2 av 10</text><rect x="0" y="72" width="1440" height="3" fill="#E7E0D0"/><rect x="0" y="72" width="288" height="3" fill="#2E4A3B"/><text x="360" y="144" font-size="26" fill="#232B27" font-weight="400" text-anchor="start" >Forklar forskjellen på segmentering og posisjonering, og</text>
<text x="360" y="180" font-size="26" fill="#232B27" font-weight="400" text-anchor="start" >gi et eksempel.</text><text x="360" y="222" font-size="16" fill="#232B27" font-weight="500" text-anchor="start" >Ditt svar</text><rect x="360" y="234" width="720" height="148" rx="6" fill="#FBFAF7" stroke="#7C8680" stroke-width="1.5"/><text x="380" y="266" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Segmentering er å dele markedet i grupper med like behov. Posisjonering er hvordan</text>
<text x="380" y="293" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >vi vil at merket skal oppfattes av kundene. Et eksempel er et treningssenter som</text>
<text x="380" y="320" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >deler kundene i studenter og pensjonister, og så vil fremstå som billig for</text>
<text x="380" y="347" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >studentene.</text><text x="1080" y="404" font-size="14" fill="#56615B" font-weight="400" text-anchor="end" >Sendt inn – kan ikke endres</text><rect x="360" y="432" width="720" height="228" rx="6" fill="#EFEADF"/><rect x="360" y="432" width="4" height="228" fill="#2E4A3B"/><text x="392" y="472" font-size="18" fill="#2E4A3B" font-weight="600" text-anchor="start" >Modellsvar</text><text x="392" y="506" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Segmentering er å dele markedet inn i grupper av kunder med like behov eller</text>
<text x="392" y="533" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >kjennetegn. Posisjonering er å bestemme hvilket bilde merket skal ha hos det</text>
<text x="392" y="560" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >valgte segmentet, sammenlignet med konkurrentene. Eksempel: Et treningssenter</text>
<text x="392" y="587" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >deler markedet i studenter, pensjonister og idrettsutøvere, og posisjonerer seg</text>
<text x="392" y="614" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >som det rimelige og uformelle valget for studenter.</text><text x="392" y="642" font-size="16" fill="#56615B" font-weight="400" text-anchor="start" >Kilde: merkevare-notater.pdf, side 7</text><text x="360" y="712" font-size="18" fill="#232B27" font-weight="500" text-anchor="start" >Hvordan gikk det?</text><rect x="360" y="732" width="118" height="48" rx="6" fill="#FBFAF7" stroke="#7C8680" stroke-width="1.4"/><circle cx="384" cy="756" r="10" fill="#FBFAF7" stroke="#7C8680" stroke-width="1.5"/><text x="404" y="762" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Riktig</text><rect x="490" y="732" width="181" height="48" rx="6" fill="#E3EBE3" stroke="#2E4A3B" stroke-width="2"/><circle cx="514" cy="756" r="10" fill="#FBFAF7" stroke="#2E4A3B" stroke-width="1.5"/><circle cx="514" cy="756" r="5" fill="#2E4A3B"/><text x="534" y="762" font-size="17" fill="#232B27" font-weight="500" text-anchor="start" >Delvis riktig</text><rect x="683" y="732" width="100" height="48" rx="6" fill="#FBFAF7" stroke="#7C8680" stroke-width="1.4"/><circle cx="707" cy="756" r="10" fill="#FBFAF7" stroke="#7C8680" stroke-width="1.5"/><text x="727" y="762" font-size="17" fill="#232B27" font-weight="400" text-anchor="start" >Feil</text><rect x="878" y="732" width="202" height="48" rx="6" fill="#2E4A3B" stroke="#2E4A3B" stroke-width="1.5"/><text x="979.0" y="762.0" font-size="16" fill="#FFFFFF" font-weight="500" text-anchor="middle" >Neste spørsmål  →</text>
</svg>
