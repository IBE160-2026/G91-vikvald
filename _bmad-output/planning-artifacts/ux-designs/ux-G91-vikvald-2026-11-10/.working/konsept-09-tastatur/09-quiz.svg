<text x="388" y="492" font-size="18" fill="#FF8F87" font-weight="700" text-anchor="start" >✗ Feil. Du svarte C, riktig svar er B.</text>
<text x="388" y="530" font-size="17" fill="#E8EBF0" font-weight="400" text-anchor="start" >Posisjonering handler om hvilket bilde merket skal ha i hodet til målgruppen, og hva som</text>
<text x="388" y="557" font-size="17" fill="#E8EBF0" font-weight="400" text-anchor="start" >skiller det fra konkurrentene. Å velge segmenter (C) kalles målgruppevalg og kommer før</text>
<text x="388" y="584" font-size="17" fill="#E8EBF0" font-weight="400" text-anchor="start" >posisjoneringen.</text>
