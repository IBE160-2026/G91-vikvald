<text x="360" y="96" font-size="14" fill="#AEB6C4" font-weight="700" text-anchor="start" letter-spacing="2">FRITEKST · SPØRSMÅL 2 AV 10</text>
<text x="360" y="136" font-size="24" fill="#E8EBF0" font-weight="700" text-anchor="start" >Forklar forskjellen på segmentering og posisjonering, og gi et</text>
<text x="360" y="170" font-size="24" fill="#E8EBF0" font-weight="700" text-anchor="start" >eksempel.</text>
<text x="360" y="222" font-size="16" fill="#E8EBF0" font-weight="700" text-anchor="start" >Ditt svar</text>
<rect x="360" y="236" width="490" height="354" fill="#15171C" stroke="#79C6EA" stroke-width="1.5" rx="3" />
<rect x="360" y="236" width="40" height="354" fill="#1C1F26" stroke="none" stroke-width="1" rx="0" />
<text x="390" y="266" font-size="14" fill="#AEB6C4" font-weight="400" text-anchor="end" >1</text>
<text x="414" y="266" font-size="16" fill="#E8EBF0" font-weight="400" text-anchor="start" >Segmentering er å dele markedet i grupper</text>
<text x="390" y="292" font-size="14" fill="#AEB6C4" font-weight="400" text-anchor="end" >2</text>
<text x="414" y="292" font-size="16" fill="#E8EBF0" font-weight="400" text-anchor="start" >med like behov, f.eks. etter alder eller</text>
<text x="390" y="318" font-size="14" fill="#AEB6C4" font-weight="400" text-anchor="end" >3</text>
<text x="414" y="318" font-size="16" fill="#E8EBF0" font-weight="400" text-anchor="start" >livsstil. Posisjonering er hvordan merket</text>
<text x="390" y="344" font-size="14" fill="#AEB6C4" font-weight="400" text-anchor="end" >4</text>
<text x="414" y="344" font-size="16" fill="#E8EBF0" font-weight="400" text-anchor="start" >skal oppfattes i hodet til gruppen man har</text>
<text x="390" y="370" font-size="14" fill="#AEB6C4" font-weight="400" text-anchor="end" >5</text>
<text x="414" y="370" font-size="16" fill="#E8EBF0" font-weight="400" text-anchor="start" >valgt. Eksempel: Tesla velger kjøpesterke</text>
<text x="390" y="396" font-size="14" fill="#AEB6C4" font-weight="400" text-anchor="end" >6</text>
<text x="414" y="396" font-size="16" fill="#E8EBF0" font-weight="400" text-anchor="start" >som bryr seg om miljø og posisjonerer seg</text>
<text x="390" y="422" font-size="14" fill="#AEB6C4" font-weight="400" text-anchor="end" >7</text>
<text x="414" y="422" font-size="16" fill="#E8EBF0" font-weight="400" text-anchor="start" >som teknologisk og grønn.</text>
<rect x="656.8" y="404" width="2" height="22" fill="#F5B942" stroke="none" stroke-width="1" rx="0" />
<text x="360" y="616" font-size="15" fill="#AEB6C4" font-weight="400" text-anchor="start" >44 ord · lagres automatisk</text>
<text x="890" y="222" font-size="16" fill="#E8EBF0" font-weight="700" text-anchor="start" >Modellsvar</text>
<rect x="890" y="236" width="490" height="354" fill="#252933" stroke="#3A4150" stroke-width="1" rx="3" />
<text x="910" y="268" font-size="16" fill="#E8EBF0" font-weight="400" text-anchor="start" >Segmentering deler markedet inn i grupper med</text>
<text x="910" y="293" font-size="16" fill="#E8EBF0" font-weight="400" text-anchor="start" >like behov og kjennetegn. Posisjonering er å</text>
<text x="910" y="318" font-size="16" fill="#E8EBF0" font-weight="400" text-anchor="start" >skape et tydelig og ønsket bilde av merket i</text>
<text x="910" y="343" font-size="16" fill="#E8EBF0" font-weight="400" text-anchor="start" >bevisstheten til det valgte segmentet.</text>
<text x="910" y="378" font-size="16" fill="#E8EBF0" font-weight="400" text-anchor="start" >Eksempel: Volvo retter seg mot barnefamilier</text>
<text x="910" y="403" font-size="16" fill="#E8EBF0" font-weight="400" text-anchor="start" >(segment) og posisjonerer seg på sikkerhet.</text>
<text x="910" y="568" font-size="15" fill="#79C6EA" font-weight="400" text-anchor="start" >kilde: merkevare-notater.pdf, side 6–7</text>
<text x="360" y="666" font-size="17" fill="#E8EBF0" font-weight="700" text-anchor="start" >Selvvurdering – hvor godt traff svaret ditt?</text>
