<text x="390" y="584" font-size="17" fill="#AEB6C4" font-weight="400" text-anchor="start" >–</text>
<text x="414" y="584" font-size="17" fill="#E8EBF0" font-weight="400" text-anchor="start" >Linjeutvidelse gir nye varianter i samme kategori; merkeutvidelse går inn i ny kategori.</text>
