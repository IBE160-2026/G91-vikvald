<text x="390" y="468" font-size="17" fill="#AEB6C4" font-weight="400" text-anchor="start" >–</text>
<text x="414" y="468" font-size="17" fill="#E8EBF0" font-weight="400" text-anchor="start" >Bygges av kjennskap, assosiasjoner, oppfattet kvalitet og lojalitet (Aaker).</text>
