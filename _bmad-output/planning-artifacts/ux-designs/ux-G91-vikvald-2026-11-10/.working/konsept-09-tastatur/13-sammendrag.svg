<text x="390" y="288" font-size="17" fill="#AEB6C4" font-weight="400" text-anchor="start" >–</text>
<text x="414" y="288" font-size="17" fill="#E8EBF0" font-weight="400" text-anchor="start" >Merkevaren er summen av det kundene vet, føler og forventer om merket.</text>
