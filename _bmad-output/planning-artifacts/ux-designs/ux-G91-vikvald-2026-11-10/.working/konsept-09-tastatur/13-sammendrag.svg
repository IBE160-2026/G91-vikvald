<text x="390" y="404" font-size="17" fill="#AEB6C4" font-weight="400" text-anchor="start" >–</text>
<text x="414" y="404" font-size="17" fill="#E8EBF0" font-weight="400" text-anchor="start" >Ekvitet er merverdien merket gir ut over produktets funksjonelle egenskaper.</text>
<text x="370" y="430" font-size="14" fill="#AEB6C4" font-weight="400" text-anchor="end" >8</text>
<text x="414" y="430" font-size="15" fill="#79C6EA" font-weight="400" text-anchor="start" >kilde: merkevare-notater.pdf, s. 4</text>
