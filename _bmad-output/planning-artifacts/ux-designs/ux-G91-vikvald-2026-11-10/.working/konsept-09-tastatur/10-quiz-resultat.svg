<text x="424" y="654" font-size="17" fill="#E8EBF0" font-weight="700" text-anchor="start" >✗ Hvilken er IKKE en kilde til merkevareekvitet hos Aaker?</text>
<text x="424" y="682" font-size="16" fill="#6FD39A" font-weight="400" text-anchor="start" >✓ Markedsandel.</text>
<text x="424" y="708" font-size="16" fill="#AEB6C4" font-weight="400" text-anchor="start" >Markedsandel er et resultat av sterk ekvitet, ikke en kilde til den.</text>
