<text x="380" y="386" font-size="17" fill="#AEB6C4" font-weight="700" text-anchor="start" > 8</text>
<text x="424" y="386" font-size="17" fill="#E8EBF0" font-weight="700" text-anchor="start" >✗ Hva er merkevareekvitet?</text>
<text x="424" y="414" font-size="16" fill="#6FD39A" font-weight="400" text-anchor="start" >✓ Merverdien merket gir ut over produktets funksjonelle egenskaper.</text>
<text x="424" y="440" font-size="16" fill="#AEB6C4" font-weight="400" text-anchor="start" >Bygges av kjennskap, assosiasjoner, oppfattet kvalitet og lojalitet.</text>
<text x="424" y="464" font-size="15" fill="#79C6EA" font-weight="400" text-anchor="start" >kilde: merkevare-notater.pdf, side 4</text>
<rect x="360" y="488" width="1020" height="122" fill="#1C1F26" stroke="#3A4150" stroke-width="1" rx="3" />
<text x="380" y="520" font-size="17" fill="#AEB6C4" font-weight="700" text-anchor="start" >11</text>
<text x="424" y="520" font-size="17" fill="#E8EBF0" font-weight="700" text-anchor="start" >✗ Hva kalles det å bruke et etablert merke på en ny produktkategori?</text>
<text x="424" y="548" font-size="16" fill="#6FD39A" font-weight="400" text-anchor="start" >✓ Merkeutvidelse.</text>
<text x="424" y="574" font-size="16" fill="#AEB6C4" font-weight="400" text-anchor="start" >Skiller seg fra linjeutvidelse, som er nye varianter i samme kategori.</text>
<text x="424" y="598" font-size="15" fill="#79C6EA" font-weight="400" text-anchor="start" >kilde: merkevare-forelesning2.pdf, side 2</text>
