<text x="424" y="252" font-size="17" fill="#E8EBF0" font-weight="700" text-anchor="start" >✗ Hvilken av disse beskriver best posisjonering?</text>
<text x="424" y="280" font-size="16" fill="#6FD39A" font-weight="400" text-anchor="start" >✓ Å skape et tydelig og ønsket bilde av merket i målgruppens bevissthet.</text>
<text x="424" y="306" font-size="16" fill="#AEB6C4" font-weight="400" text-anchor="start" >Segmentvalg kommer før; posisjonering er bildet i hodet til kunden.</text>
<text x="424" y="330" font-size="15" fill="#79C6EA" font-weight="400" text-anchor="start" >kilde: merkevare-notater.pdf, side 7</text>
