dle">Logg inn</text><text x="1210" y="297" font-size="18" font-weight="700" fill="#1D1A2F" text-anchor="middle">Opprett konto</text><text x="820" y="372" font-size="19" font-weight="800" fill="#1D1A2F" text-anchor="start">E-post</text><rect x="820" y="386" width="520" height="60" rx="16" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="3"/><text x="840" y="424" font-size="19" font-weight="400" fill="#1D1A2F" text-anchor="start">klara@student.no</text><text x="820" y="492" font-size="19" font-weight="800" fill="#1D1A2F" text-anchor="start">Passord</text><rect x="820" y="506" width="520" height="60" rx="16" fill="#FFFFFF" stroke="#A8291F" stroke-width="4"/><text x="840" y="545" font-size="22" font-weight="400" fill="#1D1A2F" text-anchor="start">••••••••</text><text x="1300" y="543" font-size="17" font-weight="700" fill="#1D1A2F" text-anchor="middle" text-decoration="underline">Vis</text><circle cx="832" cy="594" r="11.0" fill="#A8291F"/><path d="M827 589 l10 10 M837 589 l-10 10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><text x="852" y="600" font-size="18" font-weight="700" fill="#A8291F" text-anchor="start">Feil e-post eller passord. Prøv igjen.</text><rect x="824" y="640" width="520" height="64" rx="32.0" fill="#1D1A2F"/><rect x="820" y="636" width="520" height="64" rx="32.0" fill="#1D1A2F" stroke="#1D1A2F" stroke-width="3"/><text x="1080.0" y="675.56" font-size="21" font-weight="700" fill="#FBF4E6" text-anchor="middle">Logg inn</text><text x="820" y="760" font-size="19" font-weight="400" fill="#4A4560" text-anchor="start">Ny her?</text><text x="896" y="760" font-size="19" font-weight="700" fill="#1D1A2F" text-anchor="start" text-decoration="underline">Opprett en konto</text><text x="820" y="800" font-size="17" font-weight="400" fill="#4A4560" text-anchor="start">Det tar et halvt minutt.</text>
