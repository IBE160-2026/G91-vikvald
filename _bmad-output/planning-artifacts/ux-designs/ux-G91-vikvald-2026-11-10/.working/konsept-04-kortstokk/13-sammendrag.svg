<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Arial Rounded MT Bold', 'Nunito', 'Varela Round', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif">
<title>Studiekamerat – Sammendrag Uke 37</title>
