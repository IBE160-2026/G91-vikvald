<g transform="rotate(-14 66 44)"><rect x="48" y="22" width="30" height="40" rx="7" fill="#2B50D8" stroke="#1D1A2F" stroke-width="2.5"/></g><g transform="rotate(-2 70 44)"><rect x="54" y="20" width="30" height="40" rx="7" fill="#9CC5A1" stroke="#1D1A2F" stroke-width="2.5"/></g><g transform="rotate(10 74 44)"><rect x="60" y="18" width="30" height="40" rx="7" fill="#FF6F4F" stroke="#1D1A2F" stroke-width="2.5"/></g><text x="110" y="50" font-size="26" font-weight="800" fill="#1D1A2F" text-anchor="start">Studiekamerat</text><rect x="360" y="22" width="99" height="42" rx="21" fill="#1D1A2F"/><text x="409.5" y="49" font-size="18" font-weight="700" fill="#FBF4E6" text-anchor="middle">Emner</text><text x="520.5" y="49" font-size="18" font-weight="700" fill="#1D1A2F" text-anchor="middle">Konto</text><rect x="1276" y="26" width="120" height="42" rx="21.0" fill="#1D1A2F"/><rect x="1272" y="22" width="120" height="42" rx="21.0" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="3"/><text x="1332.0" y="49.12" font-size="17" font-weight="700" fill="#1D1A2F" text-anchor="middle">Logg ut</text><line x1="0" y1="86" x2="1440" y2="86" stroke="#1D1A2F" stroke-width="3"/><text x="48" y="122" font-size="17" font-weight="400" fill="#4A4560" text-anchor="start" text-decoration="underline">Emner</text><text x="109" y="122" font-size="17" font-weight="400" fill="#4A4560" text-anchor="start">/</text><text x="131" y="122" font-size="17" font-weight="400" fill="#4A4560" text-anchor="start" text-decoration="underline">Markedsføring</text><text x="273" y="122" font-size="17" font-weight="400" fill="#4A4560" text-anchor="start">/</text><text x="295" y="122" font-size="17" font-weight="400" fill="#4A4560" text-anchor="start" text-decoration="underline">Uke 37: Merkevare</text><text x="478" y="122" font-size="17" font-weight="400" fill="#4A4560" text-anchor="start">/</text><text x="500" y="122" font-size="17" font-weight="700" fill="#1D1A2F" text-anchor="start">Sammendrag</text><text x="48" y="192" font-size="46" font-weight="800" fill="#1D1A2F" text-anchor="start">Sammendrag</text><text x="48" y="228" font-size="19" font-weight="400" fill="#4A4560" text-anchor="start">Uke 37: Merkevare · laget 12.09.2026 fra 2 filer · 3 temaer</text><rect x="1128" y="162" width="268" height="54" rx="27.0" fill="#1D1A2F"/><rect x="1124" y="158" width="268" height="54" rx="27.0" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="3"/><text x="1258.0" y="191.48" font-size="18" font-weight="700" fill="#1D1A2F" text-anchor="middle">↻ Lag nytt sammendrag</text><text x="1392" y="236" font-size="16" font-weight="400" fill="#4A4560" text-anchor="end">Erstatter dette sammendraget.</text><rect x="54" y="292" width="432" height="566" rx="26" fill="#1D1A2F"/><rect x="48" y="286" width="432" height="566" rx="26" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="3"/><rect x="48" y="286" width="432" height="76" rx="26" fill="#FF6F4F" stroke="#1D1A2F" stroke-width="3"/><rect x="49.5" y="336" width="429" height="28" rx="0" fill="#FF6F4F"/><line x1="48" y1="362" x2="480" y2="362" stroke="#1D1A2F" stroke-width="3"/><circle cx="88" cy="324" r="18" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="2.5"/><text x="88" y="331" font-size="18" font-weight="800" fill="#1D1A2F" text-anchor="middle">1</text><text x="118" y="332" font-size="22" font-weight="800" fill="#1D1A2F" text-anchor="start">Hva er en merkevare</text><circle cx="78" cy="400" r="5" fill="#1D1A2F"/><text x="94" y="406" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">Navn, symbol og design som skiller</text><text x="94" y="433" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">et produkt fra konkurrentenes.</text><text x="94" y="472" font-size="16" font-weight="700" fill="#4A4560" text-anchor="start">Kilde: merkevare-notater.pdf, s. 2</text><line x1="76" y1="504" x2="452" y2="504" stroke="#1D1A2F" stroke-width="1.5" stroke-dasharray="4 6"/><circle cx="78" cy="552" r="5" fill="#1D1A2F"/><text x="94" y="558" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">Merket er et løfte til kunden om hva</text><text x="94" y="585" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">produktet leverer – hver gang.</text><text x="94" y="624" font-size="16" font-weight="700" fill="#4A4560" text-anchor="start">Kilde: merkevare-notater.pdf, s. 2</text><line x1="76" y1="656" x2="452" y2="656" stroke="#1D1A2F" stroke-width="1.5" stroke-dasharray="4 6"/><circle cx="78" cy="704" r="5" fill="#1D1A2F"/><text x="94" y="710" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">Sterke merker gjør valget enklere</text><text x="94" y="737" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">for kunden og senker opplevd risiko.</text><text x="94" y="776" font-size="16" font-weight="700" fill="#4A4560" text-anchor="start">Kilde: merkevare-notater.pdf, s. 3</text><rect x="510" y="292" width="432" height="566" rx="26" fill="#1D1A2F"/><rect x="504" y="286" width="432" height="566" rx="26" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="3"/><rect x="504" y="286" width="432" height="76" rx="26" fill="#FFC83D" stroke="#1D1A2F" stroke-width="3"/><rect x="505.5" y="336" width="429" height="28" rx="0" fill="#FFC83D"/><line x1="504" y1="362" x2="936" y2="362" stroke="#1D1A2F" stroke-width="3"/><circle cx="544" cy="324" r="18" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="2.5"/><text x="544" y="331" font-size="18" font-weight="800" fill="#1D1A2F" text-anchor="middle">2</text><text x="574" y="332" font-size="22" font-weight="800" fill="#1D1A2F" text-anchor="start">Merkevareekvitet</text><circle cx="534" cy="400" r="5" fill="#1D1A2F"/><text x="550" y="406" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">Merverdien et merke gir, ut over</text><text x="550" y="433" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">produktets funksjonelle egenskaper.</text><text x="550" y="472" font-size="16" font-weight="700" fill="#4A4560" text-anchor="start">Kilde: merkevare-notater.pdf, s. 4</text><line x1="532" y1="504" x2="908" y2="504" stroke="#1D1A2F" stroke-width="1.5" stroke-dasharray="4 6"/><circle cx="534" cy="552" r="5" fill="#1D1A2F"/><text x="550" y="558" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">Bygges av kjennskap, assosiasjoner,</text><text x="550" y="585" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">oppfattet kvalitet og lojalitet.</text><text x="550" y="624" font-size="16" font-weight="700" fill="#4A4560" text-anchor="start">Kilde: merkevare-notater.pdf, s. 4</text><line x1="532" y1="656" x2="908" y2="656" stroke="#1D1A2F" stroke-width="1.5" stroke-dasharray="4 6"/><circle cx="534" cy="704" r="5" fill="#1D1A2F"/><text x="550" y="710" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">Kjennskap er grunnmuren: uten den</text><text x="550" y="737" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">virker ikke resten.</text><text x="550" y="776" font-size="16" font-weight="700" fill="#4A4560" text-anchor="start">Kilde: merkevare-notater.pdf, s. 5</text><rect x="966" y="292" width="432" height="566" rx="26" fill="#1D1A2F"/><rect x="960" y="286" width="432" height="566" rx="26" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="3"/><rect x="960" y="286" width="432" height="76" rx="26" fill="#9CC5A1" stroke="#1D1A2F" stroke-width="3"/><rect x="961.5" y="336" width="429" height="28" rx="0" fill="#9CC5A1"/><line x1="960" y1="362" x2="1392" y2="362" stroke="#1D1A2F" stroke-width="3"/><circle cx="1000" cy="324" r="18" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="2.5"/><text x="1000" y="331" font-size="18" font-weight="800" fill="#1D1A2F" text-anchor="middle">3</text><text x="1030" y="332" font-size="22" font-weight="800" fill="#1D1A2F" text-anchor="start">Merkevarestrategier</text><circle cx="990" cy="400" r="5" fill="#1D1A2F"/><text x="1006" y="406" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">Merkevareutvidelse: et etablert navn</text><text x="1006" y="433" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">brukes i en ny produktkategori.</text><text x="1006" y="472" font-size="16" font-weight="700" fill="#4A4560" text-anchor="start">Kilde: merkevare-forelesning2.pdf, s. 3</text><line x1="988" y1="504" x2="1364" y2="504" stroke="#1D1A2F" stroke-width="1.5" stroke-dasharray="4 6"/><circle cx="990" cy="552" r="5" fill="#1D1A2F"/><text x="1006" y="558" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">Familiemerke gir ett navn til mange</text><text x="1006" y="585" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">produkter; individuelle merker ett hver.</text><text x="1006" y="624" font-size="16" font-weight="700" fill="#4A4560" text-anchor="start">Kilde: merkevare-forelesning2.pdf, s. 4</text><line x1="988" y1="656" x2="1364" y2="656" stroke="#1D1A2F" stroke-width="1.5" stroke-dasharray="4 6"/><circle cx="990" cy="704" r="5" fill="#1D1A2F"/><text x="1006" y="710" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">Utvidelser sparer kostnader, men kan</text><text x="1006" y="737" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">svekke merket hvis de ikke passer.</text><text x="1006" y="776" font-size="16" font-weight="700" fill="#4A4560" text-anchor="start">Kilde: merkevare-forelesning2.pdf, s. 5</text>
</svg>
