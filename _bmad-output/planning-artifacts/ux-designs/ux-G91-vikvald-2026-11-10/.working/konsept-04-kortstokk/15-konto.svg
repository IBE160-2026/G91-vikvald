hor="start">Slett kontoen</text><text x="84" y="692" font-size="19" font-weight="400" fill="#1D1A2F" text-anchor="start">Alle emnene, filene og alt generert innhold – flashcards, quiz, huskeregler, fritekstspørsmål</text><text x="84" y="721" font-size="19" font-weight="400" fill="#1D1A2F" text-anchor="start">og sammendrag – slettes for godt. Det kan ikke angres.</text><rect x="88" y="752" width="230" height="58" rx="29.0" fill="#1D1A2F"/><rect x="84" y="748" width="230" height="58" rx="29.0" fill="#B3261E" stroke="#1D1A2F" stroke-width="3"/><text x="199.0" y="783.84" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">Slett kontoen</text><text x="340" y="784" font-size="17" font-weight="400" fill="#4A4560" text-anchor="start">Du får spørsmål om å bekrefte før noe slettes.</text>
