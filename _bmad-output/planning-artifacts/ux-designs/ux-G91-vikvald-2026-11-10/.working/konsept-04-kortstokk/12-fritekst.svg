<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Arial Rounded MT Bold', 'Nunito', 'Varela Round', 'Avenir Next', 'Helvetica Neue', Arial, sans-serif">
<title>Studiekamerat – Fritekst 2 av 10</title>
<rect width="1440" height="900" fill="#FBF4E6"/>
<rect x="0" y="0" width="1440" height="88" rx="0" fill="#FF6F4F"/><line x1="0" y1="88" x2="1440" y2="88" stroke="#1D1A2F" stroke-width="3"/><rect x="44" y="26" width="190" height="46" rx="23.0" fill="#1D1A2F"/><rect x="40" y="22" width="190" height="46" rx="23.0" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="3"/><text x="135.0" y="51.12" font-size="17" font-weight="700" fill="#1D1A2F" text-anchor="middle">← Avslutt økt</text><text x="720" y="53" font-size="21" font-weight="800" fill="#1D1A2F" text-anchor="middle">Fritekst · Markedsføring (hele emnet)</text><rect x="1214" y="26" width="190" height="46" rx="23" fill="#1D1A2F"/><rect x="1210" y="22" width="190" height="46" rx="23" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="3"/><text x="1305" y="52" font-size="18" font-weight="800" fill="#1D1A2F" text-anchor="middle">Spørsmål 2 av 10</text><rect x="240.0" y="112" width="90.6" height="18" rx="5" fill="#1D1A2F" stroke="#1D1A2F" stroke-width="2"/><rect x="336.6" y="108" width="90.6" height="26" rx="6" fill="#FF6F4F" stroke="#1D1A2F" stroke-width="2.5"/><rect x="433.2" y="112" width="90.6" height="18" rx="5" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="2"/><rect x="529.8" y="112" width="90.6" height="18" rx="5" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="2"/><rect x="626.4" y="112" width="90.6" height="18" rx="5" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="2"/><rect x="723.0" y="112" width="90.6" height="18" rx="5" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="2"/><rect x="819.6" y="112" width="90.6" height="18" rx="5" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="2"/><rect x="916.2" y="112" width="90.6" height="18" rx="5" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="2"/><rect x="1012.8" y="112" width="90.6" height="18" rx="5" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="2"/><rect x="1109.4" y="112" width="90.6" height="18" rx="5" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="2"/><text x="48" y="190" font-size="15" font-weight="800" fill="#4A4560" text-anchor="start" letter-spacing="2">SPØRSMÅL 2 · LANGSVAR</text><text x="48" y="234" font-size="32" font-weight="800" fill="#1D1A2F" text-anchor="start">Forklar forskjellen på segmentering og posisjonering,</text><text x="48" y="276" font-size="32" font-weight="800" fill="#1D1A2F" text-anchor="start">og gi et eksempel.</text><text x="48" y="336" font-size="20" font-weight="800" fill="#1D1A2F" text-anchor="start">Ditt svar</text><rect x="48" y="352" width="640" height="300" rx="20" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="3"/><text x="72" y="392" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">Segmentering er å dele markedet inn i grupper</text><text x="72" y="422" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">med like behov, for eksempel studenter og</text><text x="72" y="452" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">barnefamilier. Posisjonering er hvordan vi vil</text><text x="72" y="482" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">at merket skal oppfattes av gruppen vi har valgt.</text><text x="72" y="512" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">Eksempel: Et treningssenter kan rette seg mot</text><text x="72" y="542" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">studenter og være det billige valget.</text><text x="664" y="638" font-size="16" font-weight="400" fill="#4A4560" text-anchor="end">52 ord</text><g transform="rotate(1.2 1060 510)"><rect x="728" y="300" width="664" height="420" rx="26" fill="#DCEEDD" stroke="#1D1A2F" stroke-width="3"/></g><rect x="735" y="307" width="664" height="420" rx="26" fill="#1D1A2F"/><rect x="728" y="300" width="664" height="420" rx="26" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="3"/><rect x="756" y="282" width="126" height="36" rx="18.0" fill="#FFC83D" stroke="#1D1A2F" stroke-width="2"/><text x="819.0" y="306.12" font-size="17" font-weight="700" fill="#1D1A2F" text-anchor="middle">Modellsvar</text><text x="760" y="358" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">Segmentering deler markedet i grupper med like</text><text x="760" y="387" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">behov. Posisjonering handler om hvilket bilde</text><text x="760" y="416" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">merket skal ha i målgruppens bevissthet,</text><text x="760" y="445" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">sammenlignet med konkurrentene.</text><text x="760" y="474" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">Eksempel: Et treningssenter deler markedet etter</text><text x="760" y="503" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">livsfase, velger studenter som målgruppe og</text><text x="760" y="532" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">posisjonerer seg som det rimelige og fleksible</text><text x="760" y="561" font-size="18" font-weight="400" fill="#1D1A2F" text-anchor="start">valget.</text><text x="760" y="618" font-size="16" font-weight="700" fill="#4A4560" text-anchor="start">Sjekk: Har du med begge begrepene, forskjellen og et eksempel?</text><rect x="760" y="652" width="401" height="34" rx="10" fill="#FBF4E6" stroke="#1D1A2F" stroke-width="2"/><path d="M774 660 h11 l5 5 v14 h-16 z" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="2" stroke-linejoin="round"/><text x="800" y="675" font-size="16" font-weight="700" fill="#1D1A2F" text-anchor="start">Kilde: segmentering-notater.pdf, side 3</text><line x1="48" y1="730" x2="1392" y2="730" stroke="#1D1A2F" stroke-width="2"/><text x="48" y="790" font-size="24" font-weight="800" fill="#1D1A2F" text-anchor="start">Hvordan gikk det?</text><text x="48" y="820" font-size="17" font-weight="400" fill="#4A4560" text-anchor="start">Vurder svaret ditt selv.</text><rect x="564" y="764" width="260" height="64" rx="32.0" fill="#1D1A2F"/><rect x="560" y="760" width="260" height="64" rx="32.0" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="3"/><text x="690.0" y="799.2" font-size="20" font-weight="700" fill="#1D1A2F" text-anchor="middle">✓  Riktig</text><rect x="837" y="753" width="274" height="78" rx="39.0" fill="none" stroke="#2B50D8" stroke-width="4"/><rect x="848" y="764" width="260" height="64" rx="32.0" fill="#1D1A2F"/><rect x="844" y="760" width="260" height="64" rx="32.0" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="3"/><text x="974.0" y="799.2" font-size="20" font-weight="700" fill="#1D1A2F" text-anchor="middle">◐  Delvis riktig</text><rect x="1132" y="764" width="260" height="64" rx="32.0" fill="#1D1A2F"/><rect x="1128" y="760" width="260" height="64" rx="32.0" fill="#FFFFFF" stroke="#1D1A2F" stroke-width="3"/><text x="1258.0" y="799.2" font-size="20" font-weight="700" fill="#1D1A2F" text-anchor="middle">✗  Feil</text>
</svg>
