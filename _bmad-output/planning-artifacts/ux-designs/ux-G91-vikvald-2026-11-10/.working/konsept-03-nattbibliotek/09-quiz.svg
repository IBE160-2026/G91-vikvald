</style><rect x="0" y="0" width="1440" height="900" fill="#080D18" /><ellipse cx="720" cy="420" rx="760" ry="520" fill="url(#pool)"/><g transform="translate(64,34) scale(0.8)" aria-hidden="true"><path d="M0 14 Q14 0 28 14 L26 18 L2 18 Z" fill="#1F5A43" stroke="#2E7A5C" stroke-width="1"/><rect x="12.5" y="18" width="3" height="10" fill="#9C7D43"/><rect x="5" y="27" width="18" height="3" rx="1.5" fill="#9C7D43"/></g><text x="98" y="54" class="u" font-size="16" fill="#B5AE9E">Uke 37: Merkevare · Quiz</text><text x="720" y="54" class="u" font-size="16" fill="#EEE7D7" font-weight="600" text-anchor="middle">Spørsmål 4 av 15</text><rect x="1236" y="28" width="140" height="40" fill="none" stroke="#D9B36A" stroke-width="1.5" rx="3" /><text x="1306.0" y="53.76" class="u" font-size="16" fill="#D9B36A" font-weight="600" text-anchor="middle">Avslutt økt</text><rect x="64" y="88" width="1312" height="2" fill="#2A3A57" /><rect x="64" y="87" width="349.8666666666667" height="4" fill="#D9B36A" rx="2" /><rect x="228" y="136" width="1000" height="640" fill="#03060C" rx="3" /><rect x="220" y="124" width="1000" height="640" fill="#EEE5D1" rx="3" /><text x="280" y="172" class="u" font-size="14" fill="#5A5244" font-weight="600" letter-spacing="2">SPØRSMÅL 4</text><text x="1160" y="172" class="u" font-size="16" fill="#A23A2C" font-weight="600" text-anchor="end">✗ Feil svar</text><text x="280" y="214" class="s" font-size="28" fill="#1A2233">Hvilken av disse beskriver best posisjonering?</text><rect x="280" y="244" width="880" height="64" fill="#F6F0E2" stroke="#C9BC9F" stroke-width="1" rx="3" /><circle cx="314" cy="276" r="16" fill="none" stroke="#1A2233" stroke-width="1.5"/><text x="314" y="282" class="s" font-size="17" fill="#1A2233" font-weight="bold" text-anchor="middle">A</text><text x="348" y="282" class="u" font-size="17" fill="#1A2233">Å dele markedet inn i grupper med like behov</text><rect x="280" y="318" width="880" height="64" fill="#E2EDDF" stroke="#1D6A45" stroke-width="3" rx="3" /><circle cx="314" cy="350" r="16" fill="none" stroke="#1A2233" stroke-width="1.5"/><text x="314" y="356" class="s" font-size="17" fill="#1A2233" font-weight="bold" text-anchor="middle">B</text><text x="348" y="356" class="u" font-size="17" fill="#1A2233">Å skape et tydelig og ønsket bilde av merket i målgruppens bevissthet</text><text x="1140" y="356" class="u" font-size="16" fill="#1D6A45" font-weight="700" text-anchor="end">✓ Riktig svar</text><rect x="280" y="392" width="880" height="64" fill="#F3E1DC" stroke="#A23A2C" stroke-width="3" rx="3" /><circle cx="314" cy="424" r="16" fill="none" stroke="#1A2233" stroke-width="1.5"/><text x="314" y="430" class="s" font-size="17" fill="#1A2233" font-weight="bold" text-anchor="middle">C</text><text x="348" y="430" class="u" font-size="17" fill="#1A2233">Å velge hvilke segmenter bedriften skal satse på</text><text x="1140" y="430" class="u" font-size="16" fill="#A23A2C" font-weight="700" text-anchor="end">✗ Ditt svar</text><rect x="280" y="466" width="880" height="64" fill="#F6F0E2" stroke="#C9BC9F" stroke-width="1" rx="3" /><circle cx="314" cy="498" r="16" fill="none" stroke="#1A2233" stroke-width="1.5"/><text x="314" y="504" class="s" font-size="17" fill="#1A2233" font-weight="bold" text-anchor="middle">D</text><text x="348" y="504" class="u" font-size="17" fill="#1A2233">Å fastsette prisen ut fra konkurrentenes priser</text><rect x="280" y="558" width="4" height="168" fill="#7A5418" /><text x="304" y="586" class="s" font-size="20" fill="#1A2233" font-weight="bold">Forklaring</text><text x="304" y="618" class="u" font-size="17" fill="#1A2233">Posisjonering handler om hvilket bilde merket skal ha i hodet til målgruppen,</text><text x="304" y="644" class="u" font-size="17" fill="#1A2233">sammenlignet med konkurrentene. Alternativ C beskriver valg av målgruppe,</text><text x="304" y="670" class="u" font-size="17" fill="#1A2233">som kommer før posisjoneringen.</text><path d="M304 690 h14 l6 6 v20 h-20 Z" fill="none" stroke="#5A5244" stroke-width="1.5"/><path d="M318 690 v6 h6" fill="none" stroke="#5A5244" stroke-width="1.5"/><text x="336" y="710" class="u" font-size="16" fill="#5A5244">Kilde: merkevare-notater.pdf, side 7</text><text x="220" y="830" class="u" font-size="16" fill="#B5AE9E">Enter = neste spørsmål</text><rect x="1000" y="800" width="220" height="52" fill="#D9B36A" rx="3" /><text x="1110.0" y="832.12" class="u" font-size="17" fill="#0B1220" font-weight="600" text-anchor="middle">Neste spørsmål  →</text><rect x="995" y="795" width="230" height="62" fill="none" stroke="#F5D98B" stroke-width="3" rx="6" /></svg>
