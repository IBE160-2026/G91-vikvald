</style><rect x="0" y="0" width="1440" height="900" fill="#080D18" /><ellipse cx="720" cy="420" rx="760" ry="520" fill="url(#pool)"/><g transform="translate(64,34) scale(0.8)" aria-hidden="true"><path d="M0 14 Q14 0 28 14 L26 18 L2 18 Z" fill="#1F5A43" stroke="#2E7A5C" stroke-width="1"/><rect x="12.5" y="18" width="3" height="10" fill="#9C7D43"/><rect x="5" y="27" width="18" height="3" rx="1.5" fill="#9C7D43"/></g><text x="98" y="54" class="u" font-size="16" fill="#B5AE9E">Uke 37: Merkevare · Quiz</text><text x="720" y="54" class="u" font-size="16" fill="#EEE7D7" font-weight="600" text-anchor="middle">Resultat</text><rect x="64" y="88" width="1312" height="2" fill="#2A3A57" /><rect x="64" y="87" width="1312.0" height="4" fill="#D9B36A" rx="2" /><text x="120" y="160" class="u" font-size="14" fill="#D9B36A" font-weight="600" letter-spacing="2">RESULTAT</text><text x="120" y="270" class="s" font-size="120" fill="#EEE7D7">11</text><text x="236" y="270" class="s" font-size="40" fill="#B5AE9E">av 15</text><text x="120" y="312" class="u" font-size="20" fill="#EEE7D7">riktige svar</text><rect x="120" y="340" width="18" height="18" fill="#D9B36A" rx="2" /><rect x="142" y="340" width="18" height="18" fill="#D9B36A" rx="2" /><rect x="164" y="340" width="18" height="18" fill="#D9B36A" rx="2" /><rect x="186" y="340" width="18" height="18" fill="#D9B36A" rx="2" /><rect x="208" y="340" width="18" height="18" fill="#D9B36A" rx="2" /><rect x="230" y="340" width="18" height="18" fill="#D9B36A" rx="2" /><rect x="252" y="340" width="18" height="18" fill="#D9B36A" rx="2" /><rect x="274" y="340" width="18" height="18" fill="#D9B36A" rx="2" /><rect x="296" y="340" width="18" height="18" fill="#D9B36A" rx="2" /><rect x="318" y="340" width="18" height="18" fill="#D9B36A" rx="2" /><rect x="340" y="340" width="18" height="18" fill="#D9B36A" rx="2" /><rect x="363" y="341" width="16" height="16" fill="none" stroke="#F0998C" stroke-width="1.5" rx="2" /><rect x="385" y="341" width="16" height="16" fill="none" stroke="#F0998C" stroke-width="1.5" rx="2" /><rect x="407" y="341" width="16" height="16" fill="none" stroke="#F0998C" stroke-width="1.5" rx="2" /><rect x="429" y="341" width="16" height="16" fill="none" stroke="#F0998C" stroke-width="1.5" rx="2" /><text x="120" y="386" class="u" font-size="16" fill="#B5AE9E">11 riktige · 4 feil</text><rect x="120" y="430" width="320" height="52" fill="#D9B36A" rx="3" /><text x="280.0" y="462.12" class="u" font-size="17" fill="#0B1220" font-weight="600" text-anchor="middle">Ta quizen igjen</text><rect x="120" y="496" width="320" height="52" fill="none" stroke="#D9B36A" stroke-width="1.5" rx="3" /><text x="280.0" y="528.12" class="u" font-size="17" fill="#D9B36A" font-weight="600" text-anchor="middle">Tilbake til forelesningen</text><text x="120" y="584" class="u" font-size="16" fill="#D9B36A" text-decoration="underline">Øv bare på de 4 feilene</text><text x="540" y="150" class="s" font-size="28" fill="#EEE7D7">Disse fire bør du se på igjen</text><rect x="540" y="176" width="800" height="156" fill="#111B2E" stroke="#2A3A57" stroke-width="1" rx="3" /><rect x="540" y="176" width="4" height="156" fill="#F0998C" /><text x="568" y="206" class="u" font-size="15" fill="#B5AE9E" font-weight="600">Spørsmål 4</text><text x="668" y="206" class="s" font-size="18" fill="#EEE7D7">Hvilken av disse beskriver best posisjonering?</text><text x="568" y="234" class="u" font-size="16" fill="#F0998C">✗ Ditt svar: Å velge hvilke segmenter bedriften skal satse på</text><text x="568" y="260" class="u" font-size="16" fill="#8ED1A9">✓ Riktig svar: Å skape et tydelig og ønsket bilde av merket i målgruppens bevissthet</text><text x="568" y="288" class="u" font-size="16" fill="#EEE7D7">Valg av segment kommer først; posisjonering er bildet i kundens bevissthet.</text><text x="568" y="314" class="u" font-size="16" fill="#B5AE9E">Kilde: merkevare-notater.pdf, side 7</text><rect x="540" y="344" width="800" height="156" fill="#111B2E" stroke="#2A3A57" stroke-width="1" rx="3" /><rect x="540" y="344" width="4" height="156" fill="#F0998C" /><text x="568" y="374" class="u" font-size="15" fill="#B5AE9E" font-weight="600">Spørsmål 7</text><text x="668" y="374" class="s" font-size="18" fill="#EEE7D7">Hva kalles det når et kjent merke brukes i en ny produktkategori?</text><text x="568" y="402" class="u" font-size="16" fill="#F0998C">✗ Ditt svar: Linjeutvidelse</text><text x="568" y="428" class="u" font-size="16" fill="#8ED1A9">✓ Riktig svar: Merkeutvidelse</text><text x="568" y="456" class="u" font-size="16" fill="#EEE7D7">Linjeutvidelse gir nye varianter i samme kategori, ikke en ny kategori.</text><text x="568" y="482" class="u" font-size="16" fill="#B5AE9E">Kilde: merkevare-notater.pdf, side 10</text><rect x="540" y="512" width="800" height="156" fill="#111B2E" stroke="#2A3A57" stroke-width="1" rx="3" /><rect x="540" y="512" width="4" height="156" fill="#F0998C" /><text x="568" y="542" class="u" font-size="15" fill="#B5AE9E" font-weight="600">Spørsmål 9</text><text x="668" y="542" class="s" font-size="18" fill="#EEE7D7">Hvilken del av merkevareekvitet handler om å kjenne igjen merket?</text><text x="568" y="570" class="u" font-size="16" fill="#F0998C">✗ Ditt svar: Lojalitet</text><text x="568" y="596" class="u" font-size="16" fill="#8ED1A9">✓ Riktig svar: Kjennskap</text><text x="568" y="624" class="u" font-size="16" fill="#EEE7D7">Kjennskap er at kunden kjenner igjen og husker merket. Lojalitet er gjenkjøp.</text><text x="568" y="650" class="u" font-size="16" fill="#B5AE9E">Kilde: merkevare-notater.pdf, side 4</text><rect x="540" y="680" width="800" height="156" fill="#111B2E" stroke="#2A3A57" stroke-width="1" rx="3" /><rect x="540" y="680" width="4" height="156" fill="#F0998C" /><text x="568" y="710" class="u" font-size="15" fill="#B5AE9E" font-weight="600">Spørsmål 12</text><text x="668" y="710" class="s" font-size="18" fill="#EEE7D7">Hva er en fordel med en paraplymerkestrategi?</text><text x="568" y="738" class="u" font-size="16" fill="#F0998C">✗ Ditt svar: Hvert produkt får sin egen identitet</text><text x="568" y="764" class="u" font-size="16" fill="#8ED1A9">✓ Riktig svar: Nye produkter drar nytte av et kjent navn</text><text x="568" y="792" class="u" font-size="16" fill="#EEE7D7">Med paraplymerke deler alle produktene ett navn, så nye produkter arver tilliten.</text><text x="568" y="818" class="u" font-size="16" fill="#B5AE9E">Kilde: merkevare-forelesning2.pdf, side 3</text></svg>
