"136" y="312" class="u" font-size="16" fill="#EEE7D7">3  Merkevarestrategier</text><rect x="120" y="224" width="3" height="24" fill="#D9B36A" /><text x="120" y="380" class="u" font-size="16" fill="#B5AE9E">Laget 12.09.2026</text><text x="120" y="404" class="u" font-size="16" fill="#B5AE9E">fra 2 filer (18 sider)</text><rect x="120" y="430" width="220" height="48" fill="none" stroke="#D9B36A" stroke-width="1.5" rx="3" /><text x="230.0" y="459.76" class="u" font-size="16" fill="#D9B36A" font-weight="600" text-anchor="middle">Lag nytt sammendrag</text><text x="120" y="508" class="u" font-size="16" fill="#B5AE9E">Det nye erstatter</text><text x="120" y="532" class="u" font-size="16" fill="#B5AE9E">dette sammendraget.</text><line x1="364.5" y1="170" x2="364.5" y2="860" stroke="#6B5631" stroke-width="1" /><text x="404" y="160" class="u" font-size="14" fill="#D9B36A" font-weight="600" letter-spacing="2">SAMMENDRAG</text><text x="404" y="206" class="s" font-size="40" fill="#EEE7D7">Uke 37: Merkevare</text><text x="1060" y="206" class="u" font-size="14" fill="#B5AE9E" font-weight="600" letter-spacing="2">KILDE</text><text x="404" y="262" class="s" font-size="24" fill="#D9B36A">1  Hva er en merkevare</text><path d="M410 290 l5 5 l-5 5 l-5 -5 Z" fill="#D9B36A"/><text x="428" y="302" class="s" font-size="18" fill="#EEE7D7">En merkevare er navnet, symbolet eller designet som skiller</text><text x="428" y="330" class="s" font-size="18" fill="#EEE7D7">et produkt fra konkurrentene og gir kunden et løfte.</text><line x1="1040" y1="297" x2="1050" y2="297" stroke="#6B5631" stroke-width="1" /><text x="1060" y="302" class="u" font-size="15" fill="#B5AE9E">merkevare-notater.pdf, side 2</text><path d="M410 364 l5 5 l-5 5 l-5 -5 Z" fill="#D9B36A"/><text x="428" y="376" class="s" font-size="18" fill="#EEE7D7">Merket lever i kundens hode: summen av erfaringer,</text><text x="428" y="404" class="s" font-size="18" fill="#EEE7D7">inntrykk og forventninger knyttet til navnet.</text><line x1="1040" y1="371" x2="1050" y2="371" stroke="#6B5631" stroke-width="1" /><text x="1060" y="376" class="u" font-size="15" fill="#B5AE9E">merkevare-notater.pdf, side 3</text><text x="404" y="466" class="s" font-size="24" fill="#D9B36A">2  Merkevareekvitet</text><path d="M410 494 l5 5 l-5 5 l-5 -5 Z" fill="#D9B36A"/><text x="428" y="506" class="s" font-size="18" fill="#EEE7D7">Merkevareekvitet er merverdien merket gir et produkt,</text><text x="428" y="534" class="s" font-size="18" fill="#EEE7D7">ut over de funksjonelle egenskapene.</text><line x1="1040" y1="501" x2="1050" y2="501" stroke="#6B5631" stroke-width="1" /><text x="1060" y="506" class="u" font-size="15" fill="#B5AE9E">merkevare-notater.pdf, side 4</text><path d="M410 568 l5 5 l-5 5 l-5 -5 Z" fill="#D9B36A"/><text x="428" y="580" class="s" font-size="18" fill="#EEE7D7">Den bygges av kjennskap, assosiasjoner, oppfattet kvalitet</text><text x="428" y="608" class="s" font-size="18" fill="#EEE7D7">og lojalitet. Sterk ekvitet gir høyere betalingsvilje.</text><line x1="1040" y1="575" x2="1050" y2="575" stroke="#6B5631" stroke-width="1" /><text x="1060" y="580" class="u" font-size="15" fill="#B5AE9E">merkevare-notater.pdf, side 5</text><text x="404" y="670" class="s" font-size="24" fill="#D9B36A">3  Merkevarestrategier</text><path d="M410 698 l5 5 l-5 5 l-5 -5 Z" fill="#D9B36A"/><text x="428" y="710" class="s" font-size="18" fill="#EEE7D7">Merkeutvidelse bruker et kjent merke i en ny kategori;</text><text x="428" y="738" class="s" font-size="18" fill="#EEE7D7">linjeutvidelse gir nye varianter i samme kategori.</text><line x1="1040" y1="705" x2="1050" y2="705" stroke="#6B5631" stroke-width="1" /><text x="1060" y="710" class="u" font-size="15" fill="#B5AE9E">merkevare-notater.pdf, side 10</text><path d="M410 772 l5 5 l-5 5 l-5 -5 Z" fill="#D9B36A"/><text x="428" y="784" class="s" font-size="18" fill="#EEE7D7">Paraplymerke samler alle produkter under ett navn, mens</text><text x="428" y="812" class="s" font-size="18" fill="#EEE7D7">individuelle merker gir hvert produkt egen identitet.</text><line x1="1040" y1="779" x2="1050" y2="779" stroke="#6B5631" stroke-width="1" /><text x="1060" y="784" class="u" font-size="15" fill="#B5AE9E">merkevare-forelesning2.pdf, side 3</text></svg>
