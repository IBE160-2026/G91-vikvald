s="u" font-size="16" fill="#0B1220" font-weight="600" text-anchor="middle">Øv</text><line x1="800" y1="602" x2="1340" y2="602" stroke="#2A3A57" stroke-width="1" /><text x="800" y="636" class="s" font-size="20" fill="#EEE7D7">Fritekstspørsmål</text><text x="800" y="662" class="u" font-size="16" fill="#D9B36A" font-style="italic">Ingen ennå – lag noen for å øve på langsvar</text><rect x="1150" y="624" width="190" height="40" fill="none" stroke="#D9B36A" stroke-width="1.5" rx="3" /><text x="1245.0" y="649.76" class="u" font-size="16" fill="#D9B36A" font-weight="600" text-anchor="middle">Lag fritekstspørsmål</text><line x1="800" y1="684" x2="1340" y2="684" stroke="#2A3A57" stroke-width="1" /><text x="800" y="718" class="s" font-size="20" fill="#EEE7D7">Sammendrag</text><text x="800" y="744" class="u" font-size="16" fill="#D9B36A" font-style="italic">Ikke laget</text><rect x="1180" y="706" width="160" height="40" fill="none" stroke="#D9B36A" stroke-width="1.5" rx="3" /><text x="1260.0" y="731.76" class="u" font-size="16" fill="#D9B36A" font-weight="600" text-anchor="middle">Lag sammendrag</text><line x1="800" y1="766" x2="1340" y2="766" stroke="#2A3A57" stroke-width="1" /><rect x="0" y="0" width="1440" height="900" fill="#080D18" opacity="0.84"/><rect x="360" y="100" width="720" height="700" fill="#111B2E" stroke="#D9B36A" stroke-width="1" rx="3" /><rect x="360" y="100" width="720" height="6" fill="#1F5A43" /><g transform="translate(408,140) scale(1.0)" aria-hidden="true"><path d="M0 14 Q14 0 28 14 L26 18 L2 18 Z" fill="#1F5A43" stroke="#2E7A5C" stroke-width="1"/><rect x="12.5" y="18" width="3" height="10" fill="#9C7D43"/><rect x="5" y="27" width="18" height="3" rx="1.5" fill="#9C7D43"/></g><text x="448" y="162" class="u" font-size="14" fill="#D9B36A" font-weight="600" letter-spacing="2">FØR FØRSTE OPPLASTING</text><text x="408" y="220" class="s" font-size="34" fill="#EEE7D7">Vilkår for opplasting</text><text x="420" y="278" class="s" font-size="22" fill="#D9B36A" text-anchor="end">1</text><text x="444" y="278" class="u" font-size="18" fill="#EEE7D7">Du er selv ansvarlig for materialet du laster opp.</text><text x="420" y="325" class="s" font-size="22" fill="#D9B36A" text-anchor="end">2</text><text x="444" y="325" class="u" font-size="18" fill="#EEE7D7">Last bare opp egne notater eller materiale du har</text><text x="444" y="352" class="u" font-size="18" fill="#EEE7D7">rett til å bruke.</text><text x="420" y="399" class="s" font-size="22" fill="#D9B36A" text-anchor="end">3</text><text x="444" y="399" class="u" font-size="18" fill="#EEE7D7">Notatene sendes til en språkmodell hos Google i EU,</text><text x="444" y="426" class="u" font-size="18" fill="#EEE7D7">som lager øvingsstoffet.</text><text x="420" y="473" class="s" font-size="22" fill="#D9B36A" text-anchor="end">4</text><text x="444" y="473" class="u" font-size="18" fill="#EEE7D7">Google kan logge forespørslene en periode for å</text><text x="444" y="500" class="u" font-size="18" fill="#EEE7D7">oppdage misbruk.</text><text x="420" y="547" class="s" font-size="22" fill="#D9B36A" text-anchor="end">5</text><text x="444" y="547" class="u" font-size="18" fill="#EEE7D7">Ikke last opp personopplysninger, for eksempel navn</text><text x="444" y="574" class="u" font-size="18" fill="#EEE7D7">på medstudenter.</text><line x1="408" y1="618" x2="1032" y2="618" stroke="#2A3A57" stroke-width="1" /><rect x="408" y="642" width="24" height="24" fill="#D9B36A" rx="3" /><path d="M413 654 l5 5 l9 -10" fill="none" stroke="#0B1220" stroke-width="2.5"/><rect x="403" y="637" width="34" height="34" fill="none" stroke="#F5D98B" stroke-width="3" rx="5" /><text x="448" y="660" class="u" font-size="18" fill="#EEE7D7">Jeg har lest vilkårene og godtar dem</text><rect x="676" y="718" width="120" height="48" fill="none" stroke="#D9B36A" stroke-width="1.5" rx="3" /><text x="736.0" y="747.76" class="u" font-size="16" fill="#D9B36A" font-weight="600" text-anchor="middle">Avbryt</text><rect x="812" y="718" width="220" height="48" fill="#D9B36A" rx="3" /><text x="922.0" y="747.76" class="u" font-size="16" fill="#0B1220" font-weight="600" text-anchor="middle">Godta og last opp</text></svg>
