</style><rect x="0" y="0" width="1440" height="900" fill="#080D18" /><ellipse cx="720" cy="420" rx="760" ry="520" fill="url(#pool)"/><g transform="translate(64,34) scale(0.8)" aria-hidden="true"><path d="M0 14 Q14 0 28 14 L26 18 L2 18 Z" fill="#1F5A43" stroke="#2E7A5C" stroke-width="1"/><rect x="12.5" y="18" width="3" height="10" fill="#9C7D43"/><rect x="5" y="27" width="18" height="3" rx="1.5" fill="#9C7D43"/></g><text x="98" y="54" class="u" font-size="16" fill="#B5AE9E">Uke 37: Merkevare · Fritekst</text><text x="720" y="54" class="u" font-size="16" fill="#EEE7D7" font-weight="600" text-anchor="middle">Spørsmål 2 av 10</text><rect x="1236" y="28" width="140" height="40" fill="none" stroke="#D9B36A" stroke-width="1.5" rx="3" /><text x="1306.0" y="53.76" class="u" font-size="16" fill="#D9B36A" font-weight="600" text-anchor="middle">Avslutt økt</text><rect x="64" y="88" width="1312" height="2" fill="#2A3A57" /><rect x="64" y="87" width="262.4" height="4" fill="#D9B36A" rx="2" /><text x="120" y="150" class="u" font-size="14" fill="#D9B36A" font-weight="600" letter-spacing="2">SPØRSMÅL 2</text><text x="120" y="192" class="s" font-size="32" fill="#EEE7D7">Forklar forskjellen på segmentering og posisjonering,</text><text x="120" y="232" class="s" font-size="32" fill="#EEE7D7">og gi et eksempel.</text><text x="120" y="282" class="u" font-size="16" fill="#EEE7D7" font-weight="600">Ditt svar</text><rect x="120" y="296" width="580" height="344" fill="#111B2E" stroke="#6E7F9E" stroke-width="1.5" rx="3" /><text x="144" y="334" class="u" font-size="17" fill="#EEE7D7">Segmentering er å dele markedet inn i grupper av</text><text x="144" y="362" class="u" font-size="17" fill="#EEE7D7">kunder med like behov. Posisjonering er hvordan</text><text x="144" y="390" class="u" font-size="17" fill="#EEE7D7">vi vil at merket skal oppfattes av målgruppen.</text><text x="144" y="418" class="u" font-size="17" fill="#EEE7D7"></text><text x="144" y="446" class="u" font-size="17" fill="#EEE7D7">Eksempel: Et treningssenter kan dele markedet etter</text><text x="144" y="474" class="u" font-size="17" fill="#EEE7D7">alder og velge studenter. Så posisjonerer det seg</text><text x="144" y="502" class="u" font-size="17" fill="#EEE7D7">som det billige og fleksible valget.</text><rect x="768" y="308" width="560" height="344" fill="#03060C" rx="3" /><rect x="760" y="296" width="560" height="344" fill="#EEE5D1" rx="3" /><text x="792" y="330" class="u" font-size="14" fill="#7A5418" font-weight="600" letter-spacing="2">MODELLSVAR</text><text x="792" y="366" class="s" font-size="17" fill="#1A2233">Segmentering deler markedet inn i grupper med</text><text x="792" y="394" class="s" font-size="17" fill="#1A2233">like behov eller kjennetegn, og er grunnlaget for</text><text x="792" y="422" class="s" font-size="17" fill="#1A2233">å velge målgruppe. Posisjonering kommer etterpå:</text><text x="792" y="450" class="s" font-size="17" fill="#1A2233">bedriften bestemmer hvilket bilde merket skal ha</text><text x="792" y="478" class="s" font-size="17" fill="#1A2233">i målgruppens bevissthet, sammenlignet med</text><text x="792" y="506" class="s" font-size="17" fill="#1A2233">konkurrentene. Eksempel: En sportskjede velger</text><text x="792" y="534" class="s" font-size="17" fill="#1A2233">unge løpere og posisjonerer seg som eksperten.</text><line x1="792" y1="578" x2="1288" y2="578" stroke="#C9BC9F" stroke-width="1" /><path d="M792 594 h14 l6 6 v20 h-20 Z" fill="none" stroke="#5A5244" stroke-width="1.5"/><path d="M806 594 v6 h6" fill="none" stroke="#5A5244" stroke-width="1.5"/><text x="824" y="614" class="u" font-size="16" fill="#5A5244">Kilde: merkevare-notater.pdf, side 7–8</text><text x="120" y="700" class="s" font-size="22" fill="#EEE7D7">Hvordan gikk det? Sammenlign svaret ditt med modellsvaret.</text><rect x="120" y="728" width="180" height="56" fill="none" stroke="#D9B36A" stroke-width="1.5" rx="3" /><text x="210.0" y="762.48" class="u" font-size="18" fill="#D9B36A" font-weight="600" text-anchor="middle">✓  Riktig</text><rect x="316" y="728" width="230" height="56" fill="none" stroke="#D9B36A" stroke-width="1.5" rx="3" /><text x="431.0" y="762.48" class="u" font-size="18" fill="#D9B36A" font-weight="600" text-anchor="middle">◐  Delvis riktig</text><rect x="311" y="723" width="240" height="66" fill="none" stroke="#F5D98B" stroke-width="3" rx="6" /><rect x="562" y="728" width="160" height="56" fill="none" stroke="#D9B36A" stroke-width="1.5" rx="3" /><text x="642.0" y="762.48" class="u" font-size="18" fill="#D9B36A" font-weight="600" text-anchor="middle">✗  Feil</text><text x="1320" y="762" class="u" font-size="16" fill="#B5AE9E" text-anchor="end">Tastatur: 1 · 2 · 3</text></svg>
