<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Fritekstspørsmål 2 av 10 – Studiekamerat"><title>Fritekstspørsmål 2 av 10 – Studiekamerat</title><defs>
<radialGradient id="pool" cx="50%" cy="45%" r="55%">
<stop offset="0" stop-color="#D9B36A" stop-opacity="0.16"/>
<stop offset="0.6" stop-color="#D9B36A" stop-opacity="0.04"/>
<stop offset="1" stop-color="#D9B36A" stop-opacity="0"/></radialGradient>
<linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#D9B36A" stop-opacity="0.30"/>
<stop offset="1" stop-color="#D9B36A" stop-opacity="0"/></linearGradient>
<linearGradient id="job" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#D9B36A" stop-opacity="0"/>
<stop offset="0.5" stop-color="#D9B36A" stop-opacity="1"/>
<stop offset="1" stop-color="#D9B36A" stop-opacity="0"/></linearGradient>
</defs>
<style>
.s{font-family:Georgia,'Times New Roman',serif}
.u{font-family:'Helvetica Neue',Arial,sans-serif}
