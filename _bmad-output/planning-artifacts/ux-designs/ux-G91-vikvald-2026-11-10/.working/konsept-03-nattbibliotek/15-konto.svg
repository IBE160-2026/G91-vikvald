x="760" y="360" width="140" height="48" fill="none" stroke="#D9B36A" stroke-width="1.5" rx="3" /><text x="830.0" y="389.76" class="u" font-size="16" fill="#D9B36A" font-weight="600" text-anchor="middle">Logg ut</text><line x1="120" y1="440" x2="900" y2="440" stroke="#2A3A57" stroke-width="1" /><text x="120" y="488" class="s" font-size="24" fill="#EEE7D7">Dine data</text><text x="120" y="526" class="u" font-size="16" fill="#EEE7D7">3 emner · 15 forelesninger · 21 PDF-filer</text><text x="120" y="556" class="u" font-size="16" fill="#D9B36A" text-decoration="underline">Les vilkårene for opplasting</text><line x1="120" y1="590" x2="900" y2="590" stroke="#2A3A57" stroke-width="1" /><rect x="120" y="616" width="780" height="220" fill="#1A1420" stroke="#F0998C" stroke-width="1.5" rx="3" /><text x="152" y="660" class="s" font-size="24" fill="#F0998C">Slett kontoen</text><text x="152" y="696" class="u" font-size="17" fill="#EEE7D7">Alle emner, filer og alt generert innhold – flashcards, quiz,</text><text x="152" y="722" class="u" font-size="17" fill="#EEE7D7">huskeregler, fritekstspørsmål og sammendrag – slettes for godt.</text><text x="152" y="748" class="u" font-size="17" fill="#EEE7D7">Det kan ikke angres.</text><rect x="152" y="768" width="200" height="44" fill="none" stroke="#F0998C" stroke-width="1.5" rx="3" /><text x="252.0" y="795.76" class="u" font-size="16" fill="#F0998C" font-weight="600" text-anchor="middle">Slett kontoen …</text><rect x="1000" y="300" width="340" height="260" fill="#111B2E" stroke="#2A3A57" stroke-width="1" rx="3" /><rect x="1000" y="300" width="340" height="6" fill="#1F5A43" /><text x="1032" y="348" class="s" font-size="22" fill="#EEE7D7">Om demomodus</text><text x="1032" y="386" class="u" font-size="16" fill="#B5AE9E">Appen kjører i demomodus.</text><text x="1032" y="412" class="u" font-size="16" fill="#B5AE9E">Innholdet lages av en testmodell,</text><text x="1032" y="438" class="u" font-size="16" fill="#B5AE9E">ikke av språkmodellen hos</text><text x="1032" y="464" class="u" font-size="16" fill="#B5AE9E">Google. Det kan derfor være</text><text x="1032" y="490" class="u" font-size="16" fill="#B5AE9E">enklere og mindre presist</text><text x="1032" y="516" class="u" font-size="16" fill="#B5AE9E">enn vanlig.</text></svg>
