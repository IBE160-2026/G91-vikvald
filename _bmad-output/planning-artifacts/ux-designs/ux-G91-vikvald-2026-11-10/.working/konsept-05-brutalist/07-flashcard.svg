<text x="252" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" fill="#000000"><tspan x="252" dy="0">Den merverdien et merke gir et produkt, ut over produktets</tspan><tspan x="252" dy="42">funksjonelle egenskaper. Bygges av kjennskap, assosiasjoner,</tspan><tspan x="252" dy="42">oppfattet kvalitet og lojalitet.</tspan></text>
