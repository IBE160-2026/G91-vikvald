<text x="40" y="150" font-family="ui-monospace, Menlo, 'Courier New', monospace" font-size="16" font-weight="700" fill="#000000">SPØRSMÅL 02 · LANGSVAR</text>
<text x="40" y="200" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="900" fill="#000000">Forklar forskjellen på segmentering og posisjonering, og gi et eksempel.</text>
<text x="40" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#000000">Ditt svar</text>
<rect x="40" y="284" width="660" height="360" fill="#FFFFFF" stroke="#000000" stroke-width="4"/>
<text x="64" y="324" font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#000000"><tspan x="64" dy="0">Segmentering er når man deler markedet inn i grupper av</tspan><tspan x="64" dy="30">kunder som ligner på hverandre. Posisjonering er hvordan</tspan><tspan x="64" dy="30">bedriften vil at kundene skal se på merket. F.eks. kan et</tspan><tspan x="64" dy="30">treningssenter segmentere på alder og posisjonere seg som det</tspan><tspan x="64" dy="30">billigste i byen.</tspan></text>
<text x="680" y="628" font-family="ui-monospace, Menlo, 'Courier New', monospace" font-size="15" font-weight="400" fill="#000000" text-anchor="end">248 / 2000 tegn</text>
<rect x="748" y="292" width="660" height="360" fill="#000000"/>
<rect x="740" y="284" width="660" height="360" fill="#F3EFE4" stroke="#000000" stroke-width="4"/>
<rect x="740" y="284" width="660" height="48" fill="#000000" stroke="#000000" stroke-width="4"/>
<text x="764" y="315" font-family="ui-monospace, Menlo, 'Courier New', monospace" font-size="16" font-weight="700" fill="#FFD60A">MODELLSVAR</text>
<text x="764" y="370" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#000000"><tspan x="764" dy="0">Segmentering er å dele markedet inn i grupper med like behov og</tspan><tspan x="764" dy="28">kjennetegn. Posisjonering er å skape et tydelig og ønsket bilde</tspan><tspan x="764" dy="28">av merket i bevisstheten til målgruppen man har valgt. Eksempel:</tspan><tspan x="764" dy="28">En bilprodusent velger miljøbevisste kjøpere som segment og</tspan><tspan x="764" dy="28">posisjonerer seg som teknologisk ledende.</tspan></text>
