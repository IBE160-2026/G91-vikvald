="140.0" y="862.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="middle" >Avslutt økt</text><text x="320" y="132" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#4B5262" text-anchor="start" letter-spacing="2">SPØRSMÅL 4 AV 15</text><text x="320" y="174" font-family="'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#161B26" text-anchor="start" >Hvilken av disse beskriver best posisjonering?</text><text x="320" y="206" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#4B5262" text-anchor="start" >Du svarte C. Svaret er bekreftet.</text><rect x="320" y="240" width="700" height="78" rx="5" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="1" /><rect x="338" y="259" width="40" height="40" rx="3" fill="#F6F5F1" stroke="#161B26" stroke-width="2" /><text x="358" y="286" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="800" fill="#161B26" text-anchor="middle" >A</text><text x="398" y="285" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#161B26" text-anchor="start" >Å dele markedet inn i grupper med like behov</text><rect x="320" y="332" width="700" height="78" rx="5" fill="#E6F2E9" stroke="#1D7037" stroke-width="3" /><rect x="338" y="351" width="40" height="40" rx="3" fill="#FFFFFF" stroke="#1D7037" stroke-width="2" /><text x="358" y="378" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="800" fill="#161B26" text-anchor="middle" >B</text><text x="398" y="365" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#161B26" text-anchor="start" >Å skape et tydelig og ønsket bilde av merket i</text><text x="398" y="389" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#161B26" text-anchor="start" >målgruppens bevissthet</text><path d="M 868 371 l 5 5 l 9 -11" fill="none" stroke="#1D7037" stroke-width="3" stroke-linecap="round"/><text x="890" y="377" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#1D7037" text-anchor="start" >Riktig svar</text><rect x="320" y="424" width="700" height="78" rx="5" fill="#FBE8E6" stroke="#B42318" stroke-width="3" /><rect x="338" y="443" width="40" height="40" rx="3" fill="#FFFFFF" stroke="#B42318" stroke-width="2" /><text x="358" y="470" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="800" fill="#161B26" text-anchor="middle" >C</text><text x="398" y="469" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#161B26" text-anchor="start" >Å velge hvilke segmenter bedriften skal satse på</text><path d="M 890 457 l 11 11 M 901 457 l -11 11" stroke="#B42318" stroke-width="3" stroke-linecap="round"/><text x="910" y="469" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#B42318" text-anchor="start" >Ditt svar</text><rect x="320" y="516" width="700" height="78" rx="5" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="1" /><rect x="338" y="535" width="40" height="40" rx="3" fill="#F6F5F1" stroke="#161B26" stroke-width="2" /><text x="358" y="562" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="800" fill="#161B26" text-anchor="middle" >D</text><text x="398" y="561" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#161B26" text-anchor="start" >Å fastsette prisen ut fra konkurrentenes priser</text><rect x="1048" y="240" width="352" height="354" rx="6" fill="#FFFFFF" stroke="#161B26" stroke-width="2" /><text x="1076" y="284" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" fill="#161B26" text-anchor="start" >Forklaring</text><text x="1076" y="322" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >Posisjonering handler om hvilket</text>
<text x="1076" y="347" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >bilde merket skal ha i</text>
<text x="1076" y="372" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >målgruppens bevissthet,</text>
<text x="1076" y="397" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >sammenlignet med konkurrentene.</text><text x="1076" y="435" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >C beskriver målgruppevalg: å</text>
<text x="1076" y="460" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >velge segmenter. Det skjer før</text>
