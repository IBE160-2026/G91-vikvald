/text><rect x="364" y="364" width="1012" height="66" rx="5" fill="#FBE8E6" stroke="#B42318" stroke-width="2.5" /><rect x="380" y="379" width="36" height="36" rx="3" fill="#FFFFFF" stroke="#B42318" stroke-width="1.5" /><text x="398" y="403" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#161B26" text-anchor="middle" >C</text><text x="436" y="403" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#161B26" text-anchor="start" >Å velge hvilke segmenter bedriften skal satse på</text><path d="M 1250 391 l 11 11 M 1261 391 l -11 11" stroke="#B42318" stroke-width="3" stroke-linecap="round"/><text x="1270" y="403" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#B42318" text-anchor="start" >Ditt svar</text><rect x="364" y="444" width="1012" height="66" rx="5" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="1" /><rect x="380" y="459" width="36" height="36" rx="3" fill="#FFFFFF" stroke="#161B26" stroke-width="1.5" /><text x="398" y="483" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="800" fill="#161B26" text-anchor="middle" >D</text><text x="436" y="483" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#161B26" text-anchor="start" >Å fastsette prisen ut fra konkurrentenes priser</text><rect x="364" y="554" width="4" height="146" rx="0" fill="#161B26" /><text x="392" y="578" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="800" fill="#161B26" text-anchor="start" >Forklaring</text><text x="392" y="614" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >Posisjonering handler om hvilket bilde merket skal ha i målgruppens bevissthet, sammenlignet med</text>
<text x="392" y="640" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#161B26" text-anchor="start" >konkurrentene. C beskriver målgruppevalg: å velge segmenter. Det skjer før posisjoneringen.</text><text x="392" y="694" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5262" text-anchor="start" >Kilde:</text><text x="444" y="694" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#161B26" text-anchor="start" text-decoration="underline">merkevare-notater.pdf, side 7</text><text x="724" y="694" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#4B5262" text-anchor="start" >Hører hjemme i</text><line x1="842" y1="688" x2="876" y2="688" stroke="#B83E0C" stroke-width="5" stroke-linecap="round"/><circle cx="859" cy="688" r="7" fill="#B83E0C" stroke="#FFFFFF" stroke-width="2.5"/><text x="888" y="694" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#B83E0C" text-anchor="start" >Uke 37: Merkevare</text><rect x="1157" y="765" width="224" height="66" rx="7" fill="none" stroke="#1F56D6" stroke-width="3" /><rect x="1162" y="770" width="214" height="56" rx="4" fill="#161B26" /><text x="1269.0" y="804.0" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" >Neste spørsmål</text><rect x="364" y="791" width="34.160000000000004" height="22" rx="4" fill="#D6D3CB" /><rect x="364" y="789" width="34.160000000000004" height="22" rx="4" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="1" /><text x="381.08" y="804.5" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#161B26" text-anchor="middle" >A–D</text><text x="406.16" y="805" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5262" text-anchor="start" >velg svar</text><rect x="504.36" y="791" width