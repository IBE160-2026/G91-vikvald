<line x1="0" y1="64.5" x2="1440" y2="64.5" stroke="#E9E9E4" stroke-width="1"/><line x1="24" y1="32" x2="46" y2="32" stroke="#15181F" stroke-width="2.5" stroke-linecap="round"/><circle cx="35" cy="32" r="5" fill="#3A3FB0"/><text x="56" y="38" font-size="16" font-weight="600" fill="#15181F" letter-spacing="-0.1">Studiekamerat</text><g transform="translate(1344.3 24) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 2.5H3v11h3.5"/><path d="M10 5l3 3-3 3"/><path d="M13 8H6.5"/></g><text x="1366.3" y="37" font-size="14" font-weight="500" fill="#5A6070">Logg ut</text><line x1="1320.3" y1="22" x2="1320.3" y2="42" stroke="#E9E9E4" stroke-width="1"/><text x="1258" y="37" font-size="14" font-weight="500" fill="#15181F">Konto</text><circle cx="1240" cy="32" r="12" fill="#EBEBF8"/><text x="1240" y="36.5" font-size="12" font-weight="600" fill="#3A3FB0" text-anchor="middle">K</text><line x1="288.5" y1="65" x2="288.5" y2="900" stroke="#E9E9E4" stroke-width="1"/><text x="24" y="104" font-size="12" font-weight="600" fill="#5A6070" letter-spacing="0.8">EMNER</text><g transform="translate(18 130) scale(0.75)" fill="none" stroke="#5A6070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6 8 10.5 12.5 6"/></g><circle cx="42" cy="136" r="4" fill="#B83E0C"/><text x="56" y="141" font-size="15" font-weight="600" fill="#15181F">Markedsføring</text><text x="264" y="141" font-size="13" font-weight="500" fill="#5A6070" text-anchor="end">8</text><text x="56" y="173" font-size="13" font-weight="500" fill="#5A6070">34</text><text x="80" y="173" font-size="15" font-weight="400" fill="#15181F">Hva er markedsføring?</text><circle cx="260" cy="168" r="3.5" fill="#5A6070"/><text x="56" y="205" font-size="13" font-weight="500" fill="#5A6070">35</text><text x="80" y="205" font-size="15" font-weight="400" fill="#15181F">Kjøpsatferd</text><circle cx="260" cy="200" r="3.5" fill="#5A6070"/><text x="56" y="237" font-size="13" font-weight="500" fill="#5A6070">36</text><text x="80" y="237" font-size="15" font-weight="400" fill="#15181F">Segmentering og posi…</text><circle cx="260" cy="232" r="3.5" fill="#5A6070"/><rect x="8" y="248" width="272" height="32" rx="6" fill="#EBEBF8"/><rect x="8" y="254" width="3" height="20" rx="1.5" fill="#3A3FB0"/><text x="56" y="269" font-size="13" font-weight="500" fill="#5A6070">37</text><text x="80" y="269" font-size="15" font-weight="600" fill="#15181F">Merkevare</text><circle cx="260" cy="264" r="3.5" fill="#5A6070"/><text x="56" y="301" font-size="13" font-weight="500" fill="#5A6070">38</text><text x="80" y="301" font-size="15" font-weight="400" fill="#15181F">Markedsmiksen</text><circle cx="260" cy="296" r="3.0" fill="none" stroke="#5A6070" stroke-width="1.25"/><text x="56" y="333" font-size="13" font-weight="500" fill="#5A6070">40</text><text x="80" y="333" font-size="15" font-weight="400" fill="#15181F">Kommunikasjon</text><circle cx="260" cy="328" r="3.0" fill="none" stroke="#5A6070" stroke-width="1.25"/><text x="56" y="365" font-size="13" font-weight="500" fill="#5A6070">42</text><text x="80" y="365" font-size="15" font-weight="400" fill="#15181F">Digital markedsføring</text><circle cx="260" cy="360" r="3.0" fill="none" stroke="#5A6070" stroke-width="1.25"/><text x="56" y="397" font-size="13" font-weight="500" fill="#5A6070">44</text><text x="80" y="397" font-size="15" font-weight="400" fill="#15181F">Tjenestemarkedsføring</text><circle cx="260" cy="392" r="3.0" fill="none" stroke="#5A6070" stroke-width="1.25"/><g transform="translate(18 426) scale(0.75)" fill="none" stroke="#5A6070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></g><circle cx="42" cy="432" r="4" fill="#0B6585"/><text x="56" y="437" font-size="15" font-weight="600" fill="#15181F">Samfunnsøkonomi</text><text x="264" y="437" font-size="13" font-weight="500" fill="#5A6070" text-anchor="end">5</text><g transform="translate(18 458) scale(0.75)" fill="none" stroke="#5A6070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></g><circle cx="42" cy="464" r="4" fill="#2D6A3B"/><text x="56" y="469" font-size="15" font-weight="600" fill="#15181F">Organisasjon og ledelse</text><text x="264" y="469" font-size="13" font-weight="500" fill="#5A6070" text-anchor="end">2</text><rect x="24.5" y="852.5" width="21" height="21" rx="5" fill="#FFFFFF" stroke="#DCDCD6" stroke-width="1"/><text x="35" y="867.5" font-size="12" font-weight="500" fill="#5A6070" text-anchor="middle">?</text><text x="56" y="868" font-size="14" font-weight="400" fill="#5A6070">Hurtigtaster</text><text x="352" y="104" font-size="14" font-weight="500" fill="#5A6070">Markedsføring</text><g transform="translate(451.5 92) scale(0.875)" fill="none" stroke="#5A6070" stroke-width="1.71429" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></g><text x="471.5" y="104" font-size="14" font-weight="500" fill="#5A6070">Uke 37: Merkevare</text><text x="352" y="144" font-size="32" font-weight="600" fill="#15181F" letter-spacing="-0.5">Sammendrag</text><text x="352" y="172" font-size="15" font-weight="400" fill="#5A6070">7 punkter i 3 temaer · laget 10.11.2026 fra 2 filer</text><text x="352" y="224" font-size="18" font-weight="600" fill="#15181F" letter-spacing="-0.2">Hva er en merkevare</text><circle cx="356" cy="249" r="2.5" fill="#15181F"/><text x="372" y="254" font-size="16" font-weight="400" fill="#15181F">En merkevare er et navn, symbol eller design som skiller et produkt fra</text><text x="372" y="278" font-size="16" font-weight="400" fill="#15181F">konkurrentenes. Den lever i kundens hode som et sett av forventninger.</text><g transform="translate(372 289) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="396" y="302" font-size="13" font-weight="500" fill="#15181F">merkevare-notater.pdf, side 2</text><line x1="396" y1="306.5" x2="580.3" y2="306.5" stroke="#DDDCD5" stroke-width="1"/><circle cx="356" cy="327" r="2.5" fill="#15181F"/><text x="372" y="332" font-size="16" font-weight="400" fill="#15181F">Kjente merker gir kunden en snarvei i valget, fordi de oppleves som trygge.</text><g transform="translate(372 343) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="396" y="356" font-size="13" font-weight="500" fill="#15181F">merkevare-notater.pdf, side 3</text><line x1="396" y1="360.5" x2="580.3" y2="360.5" stroke="#DDDCD5" stroke-width="1"/><text x="352" y="398" font-size="18" font-weight="600" fill="#15181F" letter-spacing="-0.2">Merkevareekvitet</text><circle cx="356" cy="423" r="2.5" fill="#15181F"/><text x="372" y="428" font-size="16" font-weight="400" fill="#15181F">Merkevareekvitet er merverdien et merke gir et produkt, ut over de</text><text x="372" y="452" font-size="16" font-weight="400" fill="#15181F">funksjonelle egenskapene.</text><g transform="translate(372 463) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="396" y="476" font-size="13" font-weight="500" fill="#15181F">merkevare-notater.pdf, side 4</text><line x1="396" y1="480.5" x2="580.3" y2="480.5" stroke="#DDDCD5" stroke-width="1"/><circle cx="356" cy="501" r="2.5" fill="#15181F"/><text x="372" y="506" font-size="16" font-weight="400" fill="#15181F">Den bygges av kjennskap, assosiasjoner, oppfattet kvalitet og lojalitet.</text><g transform="translate(372 517) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="396" y="530" font-size="13" font-weight="500" fill="#15181F">merkevare-notater.pdf, side 4</text><line x1="396" y1="534.5" x2="580.3" y2="534.5" stroke="#DDDCD5" stroke-width="1"/><circle cx="356" cy="555" r="2.5" fill="#15181F"/><text x="372" y="560" font-size="16" font-weight="400" fill="#15181F">Sterke, positive og unike assosiasjoner gjør merket vanskelig å kopiere.</text><g transform="translate(372 571) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="396" y="584" font-size="13" font-weight="500" fill="#15181F">merkevare-notater.pdf, side 5</text><line x1="396" y1="588.5" x2="580.3" y2="588.5" stroke="#DDDCD5" stroke-width="1"/><text x="352" y="626" font-size="18" font-weight="600" fill="#15181F" letter-spacing="-0.2">Merkevarestrategier</text><circle cx="356" cy="651" r="2.5" fill="#15181F"/><text x="372" y="656" font-size="16" font-weight="400" fill="#15181F">Ved merkevareutvidelse bruker bedriften et kjent merke i en ny</text><text x="372" y="680" font-size="16" font-weight="400" fill="#15181F">produktkategori. Det sparer markedsføring, men kan svekke merket hvis</text><text x="372" y="704" font-size="16" font-weight="400" fill="#15181F">produktet ikke passer.</text><g transform="translate(372 715) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="396" y="728" font-size="13" font-weight="500" fill="#15181F">merkevare-forelesning2.pdf, side 2</text><line x1="396" y1="732.5" x2="612.8" y2="732.5" stroke="#DDDCD5" stroke-width="1"/><circle cx="356" cy="753" r="2.5" fill="#15181F"/><text x="372" y="758" font-size="16" font-weight="400" fill="#15181F">Produsentmerket eies av produsenten, handelsmerket av butikkjeden.</text><g transform="translate(372 769) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="396" y="782" font-size="13" font-weight="500" fill="#15181F">merkevare-forelesning2.pdf, side 3</text><line x1="396" y1="786.5" x2="612.8" y2="786.5" stroke="#DDDCD5" stroke-width="1"/><rect x="1032" y="120" width="360" height="456" rx="12" fill="#FFFFFF" stroke="#DDDCD5" stroke-width="1" filter="url(#lift)"/><text x="1056" y="160" font-size="12" font-weight="600" fill="#5A6070" letter-spacing="0.8">INNHOLD</text><text x="1056" y="202" font-size="15" font-weight="500" fill="#15181F">Hva er en merkevare</text><text x="1368" y="202" font-size="13" font-weight="400" fill="#5A6070" text-anchor="end">2 punkter</text><text x="1056" y="238" font-size="15" font-weight="500" fill="#15181F">Merkevareekvitet</text><text x="1368" y="238" font-size="13" font-weight="400" fill="#5A6070" text-anchor="end">3 punkter</text><text x="1056" y="274" font-size="15" font-weight="500" fill="#15181F">Merkevarestrategier</text><text x="1368" y="274" font-size="13" font-weight="400" fill="#5A6070" text-anchor="end">2 punkter</text><line x1="1033" y1="300.5" x2="1391" y2="300.5" stroke="#EAE9E3" stroke-width="1"/><text x="1056" y="340" font-size="12" font-weight="600" fill="#5A6070" letter-spacing="0.8">KILDER</text><g transform="translate(1056 361) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="1080" y="374" font-size="14" font-weight="500" fill="#15181F">merkevare-notater.pdf</text><text x="1368" y="374" font-size="13" font-weight="400" fill="#5A6070" text-anchor="end">12 sider</text><g transform="translate(1056 393) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.75h5.25L12.5 5v9.25H4z"/><path d="M9.25 1.75V5h3.25"/></g><text x="1080" y="406" font-size="14" font-weight="500" fill="#15181F">merkevare-forelesning2.pdf</text><text x="1368" y="406" font-size="13" font-weight="400" fill="#5A6070" text-anchor="end">6 sider</text><line x1="1033" y1="436.5" x2="1391" y2="436.5" stroke="#EAE9E3" stroke-width="1"/><rect x="1056.5" y="460.5" width="311" height="39" rx="8" fill="#FFFFFF" stroke="#858B96" stroke-width="1" filter="url(#lift)"/><g transform="translate(1121.9 472) scale(1)" fill="none" stroke="#15181F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.46-3.54"/><path d="M12 1.75v3h-3"/></g><text x="1145.9" y="485.2" font-size="15" font-weight="600" fill="#15181F">Lag nytt sammendrag</text><text x="1056" y="528" font-size="14" font-weight="400" fill="#5A6070">Det nye sammendraget erstatter dette. Det</text><text x="1056" y="548" font-size="14" font-weight="400" fill="#5A6070">gamle blir ikke lagret.</text><rect x="1032" y="592" width="360" height="68" rx="10" fill="#F0EFE9"/><g transform="translate(1048 605) scale(1)" fill="none" stroke="#5A6070" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.25"/><path d="M8 7.25v4"/><path d="M8 4.75v.25"/></g><text x="1076" y="618" font-size="14" font-weight="400" fill="#15181F">Sammendraget er laget av en språkmodell.</text><text x="1076" y="638" font-size="14" font-weight="400" fill="#15181F">Sjekk viktige punkter mot kilden.</text>
</svg>
