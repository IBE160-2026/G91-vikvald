="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#5E5A52" text-anchor="end">Erstatter dette sammendraget</text><path d="M180,274.8 L419.9,275.7 L416.9,305.8 L178,306.7 Z" fill="#FFE36B" opacity="0.9"/><text x="184" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#2B2A28" font-weight="bold">Hva er en merkevare</text><text x="78" y="300" font-family="'Bradley Hand', 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="22" fill="#1D3B8A" font-weight="700">1</text><circle cx="194" cy="334" r="4" fill="#1D3B8A"/><text x="212" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">Et merke er navn, symbol eller design som skiller et produkt fra konkurrentenes.</text><g transform="rotate(-1 1151.8000000000002 342)"><path d="M1026.6,321.7 L1076.0,321.7 L1126.7,321.5 L1176.8,322.2 L1226.8,321.8 L1277.4,321.7 L1276.8,351.8 L1226.7,352.5 L1177.6,351.5 L1127.2,351.6 L1076.7,352.2 L1026.1,351.9 Z" fill="none" stroke="#1D3B8A" stroke-width="1.6"/><text x="1038.4" y="342" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1D3B8A" font-weight="600">merkevare-notater.pdf, s. 2</text></g><circle cx="194" cy="374" r="4" fill="#1D3B8A"/><text x="212" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">Merkevaren er summen av inntrykkene kundene har av merket over tid.</text><g transform="rotate(-1 1151.8000000000002 382)"><path d="M1026.1,362.2 L1076.6,361.9 L1126.1,362.1 L1176.1,362.1 L1226.6,361.5 L1277.4,361.9 L1277.5,391.9 L1227.3,391.8 L1177.1,391.7 L1127.6,391.5 L1077.1,392.2 L1026.2,392.0 Z" fill="none" stroke="#1D3B8A" stroke-width="1.6"/><text x="1038.4" y="382" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1D3B8A" font-weight="600">merkevare-notater.pdf, s. 3</text></g><path d="M180,418.7 L383.6,419.4 L380.6,449.7 L178,450.4 Z" fill="#FFE36B" opacity="0.9"/><text x="