y="58" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#2B2A28" font-weight="600" text-anchor="middle">Quiz · Uke 37: Merkevare</text><path d="M1206.2,28.5 L1263.5,28.7 L1320.5,28.1 L1375.6,28.3 L1375.8,72.2 L1320.0,71.1 L1262.0,73.0 L1205.8,72.4 Z" fill="#FFFEF9" stroke="#1D3B8A" stroke-width="2" stroke-linejoin="round" /><text x="1291.0" y="56.0" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#1D3B8A" font-weight="600" text-anchor="middle">Lukk</text><path d="M102.2,107.9 L198.1,108.8 L294.6,107.3 L389.9,107.5 L485.3,107.3 L582.5,108.1 L678.2,107.7 L773.2,107.9 L870.4,107.6 L965.2,107.5 L1061.7,107.6 L1158.0,107.5 L1253.4,107.4 L1350.2,108.1 L1350.6,204.7 L1350.5,303.3 L1349.5,399.9 L1350.2,498.3 L1349.7,596.0 L1350.6,692.4 L1349.4,790.6 L1350.2,887.9 L1254.5,888.7 L1158.7,888.7 L1061.7,888.0 L966.7,887.7 L870.4,888.7 L773.4,888.4 L678.4,887.9 L581.9,887.4 L486.0,888.2 L390.5,887.4 L294.2,888.7 L198.2,887.3 L101.8,888.2 L101.6,790.5 L102.7,692.7 L102.6,596.0 L102.0,497.9 L102.2,400.6 L102.7,302.3 L102.7,205.4 Z" fill="#D6C6A8"/><path d="M95.7,99.7 L191.6,100.3 L288.1,99.4 L383.4,100.5 L479.2,99.7 L576.2,99.3 L672.0,99.7 L768.5,100.1 L864.7,99.6 L959.5,99.3 L1055.6,100.1 L1151.6,99.3 L1248.8,100.7 L1344.2,99.8 L1344.6,197.7 L1344.4,294.5 L1344.1,392.9 L1343.5,489.4 L1344.1,587.6 L1344.1,684.4 L1344.6,782.4 L1344.1,880.2 L1247.4,879.5 L1152.2,879.7 L1056.3,879.9 L959.2,879.7 L863.4,880.1 L768.8,879.2 L672.0,880.4 L576.5,879.9 L479.3,879.4 L384.8,879.4 L288.1,879.9 L192.0,880.4 L95.8,880.0 L96.4,783.1 L96.0,685.8 L95.6,587.3 L96.6,489.4 L96.7,392.6 L96.6,295.0 L95.5,197.0 Z" fill="#FDFAF2" stroke="#CDBFA4" stroke-width="1.2"/><line x1="168" y1="101" x2="168" y2="879" stroke="#E9B8B0" stroke-width="1.6"/><ellipse cx="332" cy="182" rx="132" ry="58" fill="none" stroke="#1D3B8A" stroke-width="3" transform="rotate(-4 332 182)"/><text x="332" y="202" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#1D3B8A" font-weight="bold" text-anchor="middle">11 / 15</text><text x="496" y="174" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2B2A28" font-weight="bold">Du hadde 11 av 15 riktige.</text><text x="496" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#5E5A52" font-style="italic">Her er de 4 du bommet på – med riktig svar og hvor det står i notatene.</text><text x="126" y="294" font-family="'Bradley Hand', 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="22" fill="#1D3B8A" font-weight="700">1.</text><text x="200" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2B2A28" font-weight="bold">Hvilken av disse beskriver best posisjonering?</text><text x="200" y="330" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#B3261E" font-weight="700">✗ Ditt svar:</text><text x="304" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28">Å velge hvilke segmenter bedriften skal satse på</text><text x="200" y="359" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#1E6B3A" font-weight="700">✓ Riktig:</text><text x="304" y="359" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28" font-weight="bold">Å skape et tydelig og ønsket bilde av merket i</text><text x="304" y="382" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28" font-weight="bold">målgruppens bevissthet</text><text x="200" y="413" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#5E5A52" font-style="italic">Segmentvalg kommer før; posisjonering er bildet i hodet.</text><g transform="rotate(1.2 354.8 458)"><path d="M200.2,438.1 L252.1,437.8 L303.8,438.8 L355.2,437.2 L406.4,438.7 L458.4,438.1 L509.7,437.7 L509.6,468.3 L458.4,467.5 L405.9,468.4 L355.1,468.2 L302.5,468.1 L251.6,468.0 L200.2,467.8 Z" fill="none" stroke="#1D3B8A" stroke-width="1.6"/><text x="212" y="458" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1D3B8A" font-weight="600">Kilde: merkevare-notater.pdf, s. 7</text></g><text x="738" y="294" font-family="'Bradley Hand', 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="22" fill="#1D3B8A" font-weight="700">2.</text><text x="772" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2B2A28" font-weight="bold">Hva kjennetegner en merkevareutvidelse?</text><text x="772" y="330" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#B3261E" font-weight="700">✗ Ditt svar:</text><text x="876" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28">Å endre logo og farger på et eksisterende merke</text><text x="772" y="359" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#1E6B3A" font-weight="700">✓ Riktig:</text><text x="876" y="359" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28" font-weight="bold">Å bruke et etablert merkenavn på en ny</text><text x="876" y="382" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28" font-weight="bold">produktkategori</text><text x="772" y="413" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#5E5A52" font-style="italic">Utvidelsen låner tillit fra merket som alt er kjent.</text><g transform="rotate(-1.5 931.0 458)"><path d="M772.3,438.1 L825.0,438.1 L878.8,438.5 L930.5,437.5 L984.5,438.7 L1037.5,438.5 L1089.7,437.7 L1090.4,468.1 L1037.6,467.4 L983.5,468.3 L931.6,467.9 L877.2,468.7 L824.6,467.5 L771.7,468.0 Z" fill="none" stroke="#1D3B8A" stroke-width="1.6"/><text x="784" y="458" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1D3B8A" font-weight="600">Kilde: merkevare-notater.pdf, s. 10</text></g><text x="126" y="584" font-family="'Bradley Hand', 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="22" fill="#1D3B8A" font-weight="700">3.</text><text x="200" y="584" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2B2A28" font-weight="bold">Hva menes med oppfattet kvalitet?</text><text x="200" y="620" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#B3261E" font-weight="700">✗ Ditt svar:</text><text x="304" y="620" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28">Hvor lenge produktet faktisk varer</text><text x="200" y="649" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#1E6B3A" font-weight="700">✓ Riktig:</text><text x="304" y="649" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28" font-weight="bold">Kundens vurdering av kvaliteten sammenlignet med</text><text x="304" y="672" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28" font-weight="bold">alternativer</text><text x="200" y="703" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#5E5A52" font-style="italic">Det er kundens inntrykk, ikke målt holdbarhet.</text><g transform="rotate(1.2 354.8 748)"><path d="M200.3,728.3 L251.2,728.6 L302.8,727.8 L355.6,728.8 L407.2,727.3 L458.1,727.1 L509.5,727.7 L509.4,758.0 L458.5,758.3 L405.6,758.8 L355.0,757.8 L302.8,757.5 L252.1,757.9 L200.0,757.8 Z" fill="none" stroke="#1D3B8A" stroke-width="1.6"/><text x="212" y="748" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1D3B8A" font-weight="600">Kilde: merkevare-notater.pdf, s. 5</text></g><text x="738" y="584" font-family="'Bradley Hand', 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="22" fill="#1D3B8A" font-weight="700">4.</text><text x="772" y="584" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#2B2A28" font-weight="bold">Hva menes med merkelojalitet?</text><text x="772" y="620" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#B3261E" font-weight="700">✗ Ditt svar:</text><text x="876" y="620" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28">At kunden kjenner igjen logoen</text><text x="772" y="649" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#1E6B3A" font-weight="700">✓ Riktig:</text><text x="876" y="649" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28" font-weight="bold">At kunden velger merket igjen, også når alternativer</text><text x="876" y="672" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28" font-weight="bold">finnes</text><text x="772" y="703" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#5E5A52" font-style="italic">Gjenkjenning er kjennskap; lojalitet er gjenkjøp.</text><g transform="rotate(-1.5 947.8 748)"><path d="M772.2,727.7 L823.0,727.5 L872.8,727.3 L923.4,727.2 L973.8,727.5 L1022.4,727.5 L1072.9,728.8 L1123.4,727.8 L1123.3,757.6 L1072.6,758.6 L1023.7,757.7 L973.5,758.3 L923.2,757.2 L871.9,757.1 L822.2,758.7 L771.7,757.7 Z" fill="none" stroke="#1D3B8A" stroke-width="1.6"/><text x="784" y="748" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1D3B8A" font-weight="600">Kilde: merkevare-forelesning2.pdf, s. 2</text></g><path d="M1036.1,807.4 L1088.4,806.6 L1138.9,806.4 L1193.1,806.5 L1244.2,806.1 L1296.4,807.1 L1296.3,858.7 L1244.8,858.1 L1191.4,858.2 L1139.5,859.2 L1088.6,858.9 L1036.0,858.8 Z" fill="#152C6B" stroke="#152C6B" stroke-width="1" stroke-linejoin="round" /><path d="M1035.7,803.6 L1087.0,804.8 L1140.9,804.7 L1191.0,802.9 L1244.3,802.9 L1296.4,804.3 L1296.2,856.1 L1243.9,856.1 L1191.6,855.9 L1139.7,856.7 L1087.4,856.3 L1035.6,856.3 Z" fill="#1D3B8A" stroke="#152C6B" stroke-width="2" stroke-linejoin="round" /><text x="1166.0" y="836.0" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="middle">Øv på de 4 igjen</text><path d="M722.4,804.3 L770.5,805.2 L817.9,805.2 L866.6,804.9 L914.5,803.0 L962.8,803.2 L1012.2,804.2 L1011.9,856.1 L964.7,854.9 L915.4,856.0 L866.7,856.4 L818.6,856.3 L771.5,856.1 L722.2,855.7 Z" fill="#FFFEF9" stroke="#1D3B8A" stroke-width="2" stroke-linejoin="round" /><text x="867.0" y="836.0" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#1D3B8A" font-weight="600" text-anchor="middle">Tilbake til forelesningen</text></svg>
