1349.2,475.1 L1349.9,576.9 L1350.3,678.8 L1350.7,781.1 L1350.2,884.1 L1253.5,884.7 L1157.9,884.5 L1062.7,884.2 L965.7,883.8 L869.2,884.7 L774.0,883.7 L678.4,883.4 L582.3,884.5 L485.3,884.7 L389.9,884.6 L293.9,883.7 L197.5,884.1 L102.3,884.3 L102.2,782.1 L102.6,678.8 L102.0,577.0 L101.5,474.1 L102.6,373.1 L102.0,270.8 Z" fill="#D6C6A8"/><path d="M96.2,160.0 L191.7,160.7 L288.7,159.4 L383.7,159.9 L479.9,159.5 L576.7,160.0 L671.8,160.2 L768.3,160.0 L864.0,160.0 L960.2,160.2 L1055.6,159.9 L1152.3,160.3 L1248.8,159.8 L1344.1,159.9 L1343.5,262.6 L1343.3,363.9 L1343.7,466.2 L1344.6,569.5 L1343.9,671.2 L1344.2,774.1 L1344.2,875.8 L1247.5,876.2 L1151.6,875.5 L1056.1,875.8 L960.4,875.3 L864.2,876.4 L767.5,875.6 L671.7,875.8 L576.8,875.3 L479.6,876.6 L384.8,876.3 L288.7,876.5 L191.8,876.7 L96.1,875.8 L95.4,773.1 L96.0,671.9 L95.5,569.2 L95.9,467.1 L95.7,364.9 L95.4,262.6 Z" fill="#FDFAF2" stroke="#CDBFA4" stroke-width="1.2"/><line x1="168" y1="161" x2="168" y2="875" stroke="#E9B8B0" stroke-width="1.6"/><text x="120" y="222" font-family="'Bradley Hand', 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="26" fill="#1D3B8A" font-weight="700">2.</text><text x="200" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2B2A28" font-weight="bold">Forklar forskjellen på segmentering og posisjonering, og gi et eksempel.</text><text x="200" y="278" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#2B2A28" font-weight="700">Ditt svar</text><path d="M199.8,292.0 L248.1,291.9 L294.0,292.7 L341.7,291.8 L388.1,291.5 L435.8,291.2 L483.6,292.9 L532.1,291.0 L578.7,292.9 L625.5,290.9 L673.2,292.8 L720.1,292.4 L720.9,340.9 L721.0,391.5 L720.5,441.0 L718.9,492.3 L721.1,541.0 L720.4,592.5 L673.8,590.8 L625.6,592.2 L577.2,592.4 L530.9,590.8 L483.9,590.8 L437.5,591.5 L389.2,592.4 L343.0,591.4 L294.5,591.3 L246.3,591.1 L200.5,591.6 L199.3,543.0 L199.5,491.6 L199.4,441.0 L200.9,391.2 L200.5,342.8 Z" fill="#FFFFFF" stroke="#6B6456" stroke-width="1.6" stroke-linejoin="round" /><text x="220" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">Segmentering er å dele markedet inn i grupper med</text><text x="220" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">like behov, for eksempel studenter og pensjonister.</text><text x="220" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">Posisjonering er hvordan vi vil at merket skal</text><text x="220" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">oppfattes av gruppen vi har valgt. Eksempel: et</text><text x="220" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">treningssenter som retter seg mot studenter og vil</text><text x="220" y="480" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">fremstå som billig og uformelt.</text><text x="200" y="618" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#5E5A52">Svaret er lagret. 52 ord.</text><text x="764" y="278" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#2B2A28" font-weight="700">Modellsvar</text><g transform="rotate(0.8 1024.0 442.0)"><path d="M769.6,299.9 L817.8,300.9 L865.1,299.3 L912.5,300.7 L958.6,300.6 L1005.9,300.5 L1053.7,299.9 L1100.7,300.3 L1147.2,299.3 L1196.2,299.5 L1242.4,300.4 L1290.3,300.2 L1290.8,350.2 L1289.3,399.9 L1290.6,450.8 L1289.2,500.8 L1290.9,549.8 L1290.1,600.0 L1242.3,600.8 L1194.5,599.5 L1147.7,599.4 L1101.8,599.4 L1053.2,599.2 L1006.1,600.6 L959.0,599.1 L911.6,599.0 L863.9,600.6 L818.2,599.4 L770.2,600.0 L770.8,550.8 L769.1,500.6 L769.6,450.8 L769.4,400.0 L769.7,349.8 Z" fill="#D6C6A8"/><path d="M763.6,291.7 L811.0,291.4 L858.4,291.9 L906.2,291.2 L953.7,291.9 L1000.5,292.0 L1046.7,292.7 L1095.8,292.9 L1142.2,292.8 L1189.9,291.1 L1236.8,292.2 L1283.7,291.9 L1284.4,341.4 L1283.9,391.9 L1284.6,441.3 L1284.0,491.9 L1283.0,542.6 L1284.1,592.3 L1236.7,591.3 L1190.0,593.0 L1141.2,592.8 L1094.0,592.9 L1048.0,592.3 L1000.8,591.3 L952.5,592.2 L906.7,591.8 L858.7,592.7 L810.8,592.5 L763.8,592.3 L763.6,541.5 L764.2,491.5 L763.4,443.0 L763.1,391.0 L764.6,342.0 Z" fill="#FFFEF9" stroke="#CDBFA4" stroke-width="1.2"/></g><g transform="rotate(0.8 1024 442)"><text x="788" y="332" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">Segmentering deler markedet i grupper med like behov</text><text x="788" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">eller kjennetegn. Posisjonering er å skape et tydelig</text><text x="788" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">og ønsket bilde av merket hos den valgte målgruppen,</text><text x="788" y="422" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">i forhold til konkurrentene. Eksempel: Tesla</text><text x="788" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">segmenterer på miljøbevisste kjøpere med god økonomi</text><text x="788" y="482" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2B2A28">og posisjonerer seg som innovativ og eksklusiv.</text></g><g transform="rotate(-3 1184.0 616.0)"><path d="M1067.2,574.9 L1115.6,574.2 L1163.5,574.9 L1211.3,575.4 L1259.4,574.3 L1306.8,575.1 L1306.9,621.3 L1307.1,666.8 L1258.3,667.4 L1211.0,666.9 L1163.4,666.9 L1115.6,667.7 L1066.7,667.2 L1067.3,620.6 Z" fill="#D6C6A8" opacity="0.7"/><path d="M1064.1,570.2 L1111.2,570.3 L1159.7,569.6 L1207.7,570.1 L1256.2,570.6 L1303.9,569.8 L1304.5,615.8 L1304.1,662.0 L1255.6,662.7 L1207.5,661.3 L1160.0,662.8 L1112.3,662.8 L1064.1,662.1 L1063.5,616.5 Z" fill="#FFF0A0" stroke="#D9C56A" stroke-width="1"/><rect x="1156.0" y="561" width="56" height="18" fill="#EFE8D8" opacity="0.85" transform="rotate(-3 1184.0 570)"/><text x="1078" y="598" font-family="'Bradley Hand', 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="17" fill="#5E5A52" font-weight="600">Kilde</text><text x="1078" y="622" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28">merkevare-notater.pdf,</text><text x="1078" y="646" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A28">side 7–8</text></g><text x="200" y="690" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#2B2A28" font-weight="bold">Hvordan gikk det? Sammenlign med modellsvaret.</text><path d="M200.1,720.0 L245.7,719.6 L293.4,720.4 L339.5,719.6 L385.8,719.5 L432.5,720.4 L432.5,775.9 L385.6,776.5 L339.0,776.6 L293.4,775.6 L247.4,775.8 L199.6,776.2 Z" fill="#FFFEF9" stroke="#1E6B3A" stroke-width="2.2" stroke-linejoin="round" /><text x="316" y="755" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#1E6B3A" font-weight="700" text-anchor="middle">✓  Riktig</text><path d="M443.6,714.3 L492.1,714.6 L541.3,713.7 L589.9,713.7 L639.9,714.8 L688.4,713.8 L687.7,781.9 L638.3,781.8 L591.0,782.6 L541.7,781.6 L493.3,781.1 L443.9,782.4 Z" fill="none" stroke="#1D3B8A" stroke-width="3" stroke-linejoin="round" /><path d="M450.3,720.2 L496.8,720.8 L543.7,720.9 L588.4,721.2 L636.7,720.9 L682.2,719.8 L681.7,776.2 L636.6,776.7 L588.7,775.0 L543.3,775.8 L497.4,775.6 L450.1,776.5 Z" fill="#FFFEF9" stroke="#1D3B8A" stroke-width="2.2" stroke-linejoin="round" /><text x="566" y="755" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#1D3B8A" font-weight="700" text-anchor="middle">◐  Delvis riktig</text><path d="M700.0,720.0 L746.7,719.0 L793.6,721.0 L840.0,719.1 L886.3,719.9 L931.6,720.3 L932.3,775.9 L886.3,777.1 L838.4,776.3 L792.3,775.2 L746.5,774.9 L700.1,776.0 Z" fill="#FFFEF9" stroke="#B3261E" stroke-width="2.2" stroke-linejoin="round" /><text x="816" y="755" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#B3261E" font-weight="700" text-anchor="middle">✗  Feil</text><text x="200" y="814" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#5E5A52" font-style="italic">Vurderingen din styrer hvilke spørsmål som kommer igjen.</text><path d="M1066.3,802.7 L1112.2,803.8 L1158.2,803.4 L1203.9,803.6 L1250.5,802.4 L1296.4,802.6 L1296.1,854.6 L1250.5,855.1 L1204.1,854.4 L1157.2,855.3 L1111.7,854.4 L1066.4,854.7 Z" fill="#152C6B" stroke="#152C6B" stroke-width="1" stroke-linejoin="round" /><path d="M1065.8,800.1 L1111.7,799.5 L1158.4,800.2 L1203.8,800.2 L1249.5,799.6 L1295.9,799.9 L1295.5,852.0 L1250.9,851.9 L1203.8,852.9 L1157.7,852.2 L1113.1,852.0 L1066.1,852.3 Z" fill="#1D3B8A" stroke="#152C6B" stroke-width="2" stroke-linejoin="round" /><text x="1181.0" y="832.0" font-family="'Avenir Next', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#FFFFFF" font-weight="600" text-anchor="middle">Neste spørsmål →</text></svg>
