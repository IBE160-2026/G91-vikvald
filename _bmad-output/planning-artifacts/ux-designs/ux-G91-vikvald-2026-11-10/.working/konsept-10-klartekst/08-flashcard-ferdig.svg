<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Studiekamerat – Klartekst – Økt ferdig</title><rect width="1440" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="1440" height="80" fill="#0B0C0C"/><rect x="0" y="80" width="1440" height="10" fill="#0B3D91"/><rect x="320" y="22" width="36" height="36" fill="#FFFFFF"/><polyline points="327.36,41.400000000000006 335.2,48.959999999999994 349.2,31.6" fill="none" stroke="#0B0C0C" stroke-width="5" stroke-linecap="square"/><text x="372" y="52" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Studiekamerat</text><text x="1047.616" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Logg ut</text><rect x="1047.616" y="58" width="72.38400000000001" height="2" fill="#FFFFFF"/><text x="952.912" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Konto</text><rect x="952.912" y="58" width="54.70400000000001" height="2" fill="#FFFFFF"/><text x="851.9680000000001" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Emner</text><rect x="851.9680000000001" y="58" width="60.944" height="6" fill="#FFFFFF"/><text x="320" y="130" font-size="22" font-weight="400" fill="#3B3F42" text-anchor="start">Flashcards  ·  Uke 37: Merkevare</text><rect x="320" y="156" width="800" height="170" fill="#00623A"/><text x="720.0" y="226" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle">Økten er ferdig</text><text x="720.0" y="276" font-size="24" font-weight="400" fill="#FFFFFF" text-anchor="middle">Du gikk gjennom alle 24 kortene.</text><text x="320" y="392" font-size="32" font-weight="700" fill="#0B0C0C" text-anchor="start">Slik gikk det</text><rect x="320" y="412" width="800" height="3" fill="#0B0C0C"/><rect x="320" y="432" width="40" height="40" fill="#00623A"/><polyline points="329.36,453.4 337.2,460.96 351.2,443.6" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="square"/><text x="380" y="462" font-size="24" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Kunne: </tspan><tspan font-weight="400">19 kort</tspan></text><rect x="320" y="492" width="800" height="2" fill="#B1B4B6"/><rect x="320" y="512" width="40" height="40" fill="#A3221B"/><path d="M331.04,523.04 L348.96,540.96 M348.96,523.04 L331.04,540.96" stroke="#FFFFFF" stroke-width="5" stroke-linecap="square"/><text x="380" y="542" font-size="24" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Kunne ikke: </tspan><tspan font-weight="400">5 kort</tspan></text><text x="380" y="576" font-size="20" font-weight="400" fill="#3B3F42" text-anchor="start">Disse 5 ble repetert på slutten av økten, til du kunne dem.</text><rect x="320" y="604" width="800" height="2" fill="#B1B4B6"/><text x="320" y="652" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="start">19 av 24 kort kunne du første gang</text><rect x="320" y="668" width="633" height="28" fill="#00623A"/><rect x="953" y="668" width="167" height="28" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="2"/><text x="332" y="689" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">Kunne 19</text><text x="1108" y="689" font-size="18" font-weight="700" fill="#0B0C0C" text-anchor="end">Kunne ikke 5</text><rect x="320" y="744" width="127" height="56" fill="#FFDD00"/><rect x="320" y="800" width="127" height="4" fill="#0B0C0C"/><text x="344" y="779.0" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="start">Øv igjen</text><rect x="463" y="744" width="280" height="56" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><rect x="463" y="800" width="280" height="4" fill="#0B0C0C"/><text x="487" y="779.0" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="start">Tilbake til forelesningen</text></svg>