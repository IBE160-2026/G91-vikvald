<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Studiekamerat – Klartekst – Sammendrag</title><rect width="1440" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="1440" height="80" fill="#0B0C0C"/><rect x="0" y="80" width="1440" height="10" fill="#0B3D91"/><rect x="320" y="22" width="36" height="36" fill="#FFFFFF"/><polyline points="327.36,41.400000000000006 335.2,48.959999999999994 349.2,31.6" fill="none" stroke="#0B0C0C" stroke-width="5" stroke-linecap="square"/><text x="372" y="52" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Studiekamerat</text><text x="1047.616" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Logg ut</text><rect x="1047.616" y="58" width="72.38400000000001" height="2" fill="#FFFFFF"/><text x="952.912" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Konto</text><rect x="952.912" y="58" width="54.70400000000001" height="2" fill="#FFFFFF"/><text x="851.9680000000001" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Emner</text><rect x="851.9680000000001" y="58" width="60.944" height="6" fill="#FFFFFF"/><polyline points="330,111 322,119 330,127" fill="none" stroke="#0B3D91" stroke-width="3"/><text x="340" y="126" font-size="20" font-weight="400" fill="#0B3D91" text-anchor="start">Tilbake til Uke 37: Merkevare</text><rect x="340" y="130" width="259.776" height="2" fill="#0B3D91"/><text x="320" y="176" font-size="22" font-weight="400" fill="#3B3F42" text-anchor="start">Sammendrag</text><text x="320" y="226" font-size="48" font-weight="700" fill="#0B0C0C" text-anchor="start">Uke 37: Merkevare</text><text x="320" y="264" font-size="20" font-weight="400" fill="#3B3F42" text-anchor="start">Laget 11.09.2026 fra 2 filer. Hvert punkt viser hvor det står i notatene.</text><rect x="320" y="286" width="255" height="56" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><rect x="320" y="342" width="255" height="4" fill="#0B0C0C"/><text x="344" y="321.0" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="start">Lag nytt sammendrag</text><text x="599" y="322" font-size="20" font-weight="400" fill="#3B3F42" text-anchor="start">Erstatter dette sammendraget.</text><text x="320" y="392" font-size="28" font-weight="700" fill="#0B0C0C" text-anchor="start">1. Hva er en merkevare</text><rect x="324" y="424" width="10" height="10" fill="#0B0C0C"/><text x="352" y="436" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">Et merke er navn, symbol eller design som skiller et produkt fra konkurrentenes.</text><text x="352" y="466" font-size="18" font-weight="400" fill="#3B3F42" text-anchor="start">Kilde: merkevare-notater.pdf, side 2</text><rect x="324" y="506" width="10" height="10" fill="#0B0C0C"/><text x="352" y="518" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">En merkevare er mer enn logoen: det er summen av det kundene tenker og føler om</text><text x="352" y="548" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">merket.</text><text x="352" y="578" font-size="18" font-weight="400" fill="#3B3F42" text-anchor="start">Kilde: merkevare-notater.pdf, side 3</text><text x="320" y="634" font-size="28" font-weight="700" fill="#0B0C0C" text-anchor="start">2. Merkevareekvitet</text><rect x="324" y="666" width="10" height="10" fill="#0B0C0C"/><text x="352" y="678" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">Merverdien et merke gir et produkt, ut over de funksjonelle egenskapene.</text><text x="352" y="708" font-size="18" font-weight="400" fill="#3B3F42" text-anchor="start">Kilde: merkevare-notater.pdf, side 4</text><rect x="324" y="748" width="10" height="10" fill="#0B0C0C"/><text x="352" y="760" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">Bygges av kjennskap, assosiasjoner, oppfattet kvalitet og lojalitet.</text><text x="352" y="790" font-size="18" font-weight="400" fill="#3B3F42" text-anchor="start">Kilde: merkevare-forelesning2.pdf, side 2</text><text x="320" y="846" font-size="28" font-weight="700" fill="#0B0C0C" text-anchor="start">3. Merkevarestrategier</text><rect x="324" y="878" width="10" height="10" fill="#0B0C0C"/><text x="352" y="890" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">Paraplymerke: mange produkter under samme navn, som gir felles kjennskap.</text><text x="352" y="920" font-size="18" font-weight="400" fill="#3B3F42" text-anchor="start">Kilde: merkevare-notater.pdf, side 10</text></svg>