<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Studiekamerat – Klartekst – Fritekst</title><rect width="1440" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="1440" height="80" fill="#0B0C0C"/><rect x="0" y="80" width="1440" height="10" fill="#0B3D91"/><rect x="320" y="22" width="36" height="36" fill="#FFFFFF"/><polyline points="327.36,41.400000000000006 335.2,48.959999999999994 349.2,31.6" fill="none" stroke="#0B0C0C" stroke-width="5" stroke-linecap="square"/><text x="372" y="52" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Studiekamerat</text><text x="1047.616" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Logg ut</text><rect x="1047.616" y="58" width="72.38400000000001" height="2" fill="#FFFFFF"/><text x="952.912" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Konto</text><rect x="952.912" y="58" width="54.70400000000001" height="2" fill="#FFFFFF"/><text x="851.9680000000001" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Emner</text><rect x="851.9680000000001" y="58" width="60.944" height="6" fill="#FFFFFF"/><text x="320" y="130" font-size="22" font-weight="400" fill="#3B3F42" text-anchor="start">Fritekstspørsmål  ·  Uke 37: Merkevare</text><text x="1017.456" y="130" font-size="20" font-weight="700" fill="#0B3D91" text-anchor="start">Avslutt økt</text><rect x="1017.456" y="134" width="102.54400000000001" height="2" fill="#0B3D91"/><path d="M991.416,115.96 L1005.496,130.04 M1005.496,115.96 L991.416,130.04" stroke="#0B3D91" stroke-width="3" stroke-linecap="square"/><text x="320" y="178" font-size="22" font-weight="700" fill="#0B0C0C" text-anchor="start">Spørsmål 2 av 10</text><rect x="320" y="192" width="800" height="20" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="2"/><rect x="322" y="194" width="119" height="16" fill="#0B3D91"/><text x="320" y="250" font-size="28" font-weight="700" fill="#0B0C0C" text-anchor="start">Forklar forskjellen på segmentering og posisjonering, og gi</text><text x="320" y="286" font-size="28" font-weight="700" fill="#0B0C0C" text-anchor="start">et eksempel.</text><text x="320" y="332" font-size="22" font-weight="700" fill="#0B0C0C" text-anchor="start">Ditt svar</text><rect x="320" y="346" width="800" height="136" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><text x="340" y="380" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">Segmentering er å dele markedet inn i grupper av kunder med like behov.</text><text x="340" y="408" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">Posisjonering er hvordan vi vil at målgruppen skal oppfatte merket. Eksempel: Tine</text><text x="340" y="436" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">deler markedet i barnefamilier og treningsinteresserte, og posisjonerer Yt som</text><text x="340" y="464" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">proteindrikken for aktive.</text><rect x="320" y="502" width="800" height="200" fill="#E8EEF7"/><rect x="320" y="502" width="8" height="200" fill="#0B3D91"/><text x="352" y="540" font-size="22" font-weight="700" fill="#0B0C0C" text-anchor="start">Modellsvar</text><text x="352" y="572" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">Segmentering er å dele markedet i grupper med like behov. Posisjonering er å</text><text x="352" y="600" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">skape et tydelig og ønsket bilde av merket i målgruppens bevissthet. Eksempel:</text><text x="352" y="628" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">Volvo retter seg mot barnefamilier og posisjonerer seg på sikkerhet.</text><path d="M352,646 H368 L376,654 V676 H352 Z" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><text x="364" y="671" font-size="8" font-weight="700" fill="#0B0C0C" text-anchor="middle">PDF</text><text x="388" y="670" font-size="20" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Kilde: </tspan><tspan font-weight="400">merkevare-notater.pdf, side 7</tspan></text><text x="320" y="744" font-size="24" font-weight="700" fill="#0B0C0C" text-anchor="start">Hvor godt stemte svaret ditt med modellsvaret?</text><circle cx="340" cy="780" r="20" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><text x="380" y="788" font-size="22" font-weight="400" fill="#0B0C0C" text-anchor="start">Riktig</text><circle cx="517.3184" cy="780" r="27" fill="none" stroke="#FFDD00" stroke-width="8"/><circle cx="517.3184" cy="780" r="20" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/><circle cx="517.3184" cy="780" r="10" fill="#0B0C0C"/><text x="557.3184" y="788" font-size="22" font-weight="700" fill="#0B0C0C" text-anchor="start">Delvis riktig</text><circle cx="759.8448000000001" cy="780" r="20" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><text x="799.8448000000001" y="788" font-size="22" font-weight="400" fill="#0B0C0C" text-anchor="start">Feil</text><rect x="924" y="752" width="196" height="56" fill="#0B3D91"/><rect x="924" y="808" width="196" height="4" fill="#06245A"/><text x="948" y="787.0" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Neste spørsmål</text></svg>