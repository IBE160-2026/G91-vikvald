<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Studiekamerat – Klartekst – Emner</title><rect width="1440" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="1440" height="80" fill="#0B0C0C"/><rect x="0" y="80" width="1440" height="10" fill="#0B3D91"/><rect x="320" y="22" width="36" height="36" fill="#FFFFFF"/><polyline points="327.36,41.400000000000006 335.2,48.959999999999994 349.2,31.6" fill="none" stroke="#0B0C0C" stroke-width="5" stroke-linecap="square"/><text x="372" y="52" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Studiekamerat</text><text x="1047.616" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Logg ut</text><rect x="1047.616" y="58" width="72.38400000000001" height="2" fill="#FFFFFF"/><text x="952.912" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Konto</text><rect x="952.912" y="58" width="54.70400000000001" height="2" fill="#FFFFFF"/><text x="851.9680000000001" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Emner</text><rect x="851.9680000000001" y="58" width="60.944" height="6" fill="#FFFFFF"/><text x="320" y="172" font-size="48" font-weight="700" fill="#0B0C0C" text-anchor="start">Emnene dine</text><text x="320" y="220" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">Velg et emne for å se forelesningene og øve på dem.</text><rect x="320" y="252" width="176" height="56" fill="#0B3D91"/><rect x="320" y="308" width="176" height="4" fill="#06245A"/><path d="M352.0,269.0 V289.0 M342,279.0 H362" stroke="#FFFFFF" stroke-width="4"/><text x="376" y="287.0" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Nytt emne</text><rect x="320" y="360" width="800" height="3" fill="#0B0C0C"/><rect x="316" y="382" width="209.24" height="40" fill="#FFDD00"/><rect x="3