<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Studiekamerat – Klartekst – Quiz</title><rect width="1440" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="1440" height="80" fill="#0B0C0C"/><rect x="0" y="80" width="1440" height="10" fill="#0B3D91"/><rect x="320" y="22" width="36" height="36" fill="#FFFFFF"/><polyline points="327.36,41.400000000000006 335.2,48.959999999999994 349.2,31.6" fill="none" stroke="#0B0C0C" stroke-width="5" stroke-linecap="square"/><text x="372" y="52" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Studiekamerat</text><text x="1047.616" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Logg ut</text><rect x="1047.616" y="58" width="72.38400000000001" height="2" fill="#FFFFFF"/><text x="952.912" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Konto</text><rect x="952.912" y="58" width="54.70400000000001" height="2" fill="#FFFFFF"/><text x="851.9680000000001" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Emner</text><rect x="851.9680000000001" y="58" width="60.944" height="6" fill="#FFFFFF"/><text x="320" y="130" font-size="22" font-weight="400" fill="#3B3F42" text-anchor="start">Quiz  ·  Uke 37: Merkevare</text><text x="1017.456" y="130" font-size="20" font-weight="700" fill="#0B3D91" text-anchor="start">Avslutt økt</text><rect x="1017.456" y="134" width="102.54400000000001" height="2" fill="#0B3D91"/><path d="M991.416,115.96 L1005.496,130.04 M1005.496,115.96 L991.416,130.04" stroke="#0B3D91" stroke-width="3" stroke-linecap="square"/><text x="320" y="178" font-size="22" font-weight="700" fill="#0B0C0C" text-anchor="start">Spørsmål 4 av 15</text><rect x="320" y="192" width="800" height="20" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="2"/><rect x="322" y="194" width="212" height="16" fill="#0B3D91"/><text x="1120" y="178" font-size="20" font-weight="400" fill="#3B3F42" text-anchor="end">3 riktige så langt</text><text x="320" y="262" font-size="32" font-weight="700" fill="#0B0C0C" text-anchor="start">Hvilken av disse beskriver best posisjonering?</text><rect x="320" y="284" width="800" height="56" fill="#FFFFFF" stroke="#505A5F" stroke-width="2"/><rect x="336" y="294" width="36" height="36" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="2"/><text x="354" y="319" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="middle">A</text><text x="388" y="320" font-size="21" font-weight="400" fill="#0B0C0C" text-anchor="start">Å dele markedet inn i grupper med like behov</text><rect x="320" y="350" width="800" height="84" fill="#E6F2EC" stroke="#00623A" stroke-width="5"/><rect x="336" y="360" width="36" height="36" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="2"/><text x="354" y="385" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="middle">B</text><text x="388" y="386" font-size="21" font-weight="700" fill="#0B0C0C" text-anchor="start">Å skape et tydelig og ønsket bilde av merket i målgruppens bevissthet</text><polyline points="390.88,413.2 397.6,419.68 409.6,404.8" fill="none" stroke="#00623A" stroke-width="5" stroke-linecap="square"/><text x="420" y="420" font-size="20" font-weight="700" fill="#00623A" text-anchor="start">Riktig svar</text><rect x="320" y="444" width="800" height="84" fill="#FBEAE9" stroke="#A3221B" stroke-width="5"/><rect x="336" y="454" width="36" height="36" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="2"/><text x="354" y="479" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="middle">C</text><text x="388" y="480" font-size="21" font-weight="700" fill="#0B0C0C" text-anchor="start">Å velge hvilke segmenter bedriften skal satse på</text><path d="M392.32,498.32 L407.68,513.68 M407.68,498.32 L392.32,513.68" stroke="#A3221B" stroke-width="5" stroke-linecap="square"/><text x="420" y="514" font-size="20" font-weight="700" fill="#A3221B" text-anchor="start">Ditt svar – feil</text><rect x="320" y="538" width="800" height="56" fill="#FFFFFF" stroke="#505A5F" stroke-width="2"/><rect x="336" y="548" width="36" height="36" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="2"/><text x="354" y="573" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="middle">D</text><text x="388" y="574" font-size="21" font-weight="400" fill="#0B0C0C" text-anchor="start">Å fastsette prisen ut fra konkurrentenes priser</text><rect x="320" y="612" width="800" height="180" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><rect x="320" y="612" width="10" height="180" fill="#A3221B"/><path d="M357.04,637.04 L374.96,654.96 M374.96,637.04 L357.04,654.96" stroke="#A3221B" stroke-width="5" stroke-linecap="square"/><text x="392" y="656" font-size="26" font-weight="700" fill="#0B0C0C" text-anchor="start">Ikke riktig. Riktig svar er B.</text><text x="352" y="694" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">Posisjonering handler om hvordan merket skal oppfattes i målgruppens bevissthet.</text><text x="352" y="724" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">C beskriver valg av målgruppe, som kommer før posisjoneringen.</text><path d="M352,746 H368 L376,754 V776 H352 Z" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><text x="364" y="771" font-size="8" font-weight="700" fill="#0B0C0C" text-anchor="middle">PDF</text><text x="388" y="770" font-size="20" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Kilde: </tspan><tspan font-weight="400">merkevare-notater.pdf, side 7</tspan></text><rect x="320" y="812" width="196" height="56" fill="#FFDD00"/><rect x="320" y="868" width="196" height="4" fill="#0B0C0C"/><text x="344" y="847.0" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="start">Neste spørsmål</text><text x="540" y="848" font-size="20" font-weight="400" fill="#3B3F42" text-anchor="start">Fokus flyttes hit når svaret er bekreftet.</text></svg>