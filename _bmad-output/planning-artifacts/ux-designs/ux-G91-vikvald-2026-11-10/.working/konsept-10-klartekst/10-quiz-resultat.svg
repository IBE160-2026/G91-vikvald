eight="34" fill="#00623A" stroke="#00623A" stroke-width="3"/><polyline points="816.2800000000002,222.2 823.0000000000002,228.68 835.0000000000002,213.8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="square"/><rect x="856.0000000000002" y="204" width="46" height="34" fill="#FFFFFF" stroke="#A3221B" stroke-width="3"/><path d="M871.3200000000003,213.32 L886.6800000000002,228.68 M886.6800000000002,213.32 L871.3200000000003,228.68" stroke="#A3221B" stroke-width="4" stroke-linecap="square"/><rect x="909.6000000000003" y="204" width="46" height="34" fill="#00623A" stroke="#00623A" stroke-width="3"/><polyline points="923.4800000000002,222.2 930.2000000000003,228.68 942.2000000000003,213.8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="square"/><rect x="963.2000000000003" y="204" width="46" height="34" fill="#00623A" stroke="#00623A" stroke-width="3"/><polyline points="977.0800000000003,222.2 983.8000000000003,228.68 995.8000000000003,213.8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="square"/><rect x="1016.8000000000003" y="204" width="46" height="34" fill="#FFFFFF" stroke="#A3221B" stroke-width="3"/><path d="M1032.1200000000001,213.32 L1047.4800000000002,228.68 M1047.4800000000002,213.32 L1032.1200000000001,228.68" stroke="#A3221B" stroke-width="4" stroke-linecap="square"/><rect x="1070.4000000000003" y="204" width="46" height="34" fill="#00623A" stroke="#00623A" stroke-width="3"/><polyline points="1084.2800000000004,222.2 1091.0000000000002,228.68 1103.0000000000002,213.8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="square"/><rect x="320" y="262" width="196" height="56" fill="#0B3D91"/><rect x="320" y="318" width="196" height="4" fill="#06245A"/><text x="344" y="297.0" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Ta quizen igjen</text><rect x="532" y="262" width="280" height="56" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><rect x="532" y="318" width="280" height="4" fill="#0B0C0C"/><text x="556" y="297.0" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="start">Tilbake til forelesningen</text><text x="1120" y="298" font-size="20" font-weight="400" fill="#3B3F42" text-anchor="end">Hake = riktig, kryss = feil</text><text x="320" y="384" font-size="30" font-weight="700" fill="#0B0C0C" text-anchor="start">Disse 4 svarte du feil på</text><rect x="320" y="400" width="800" height="3" fill="#0B0C0C"/><text x="320" y="430" font-size="21" font-weight="700" fill="#0B0C0C" text-anchor="start">4. Hvilken av disse beskriver best posisjonering?</text><polyline points="322.64,452.1 328.8,458.04 339.8,444.4" fill="none" stroke="#00623A" stroke-width="4" stroke-linecap="square"/><text x="350" y="458" font-size="20" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700" fill="#00623A">Riktig svar: </tspan><tspan font-weight="400">Å skape et tydelig og ønsket bilde av merket hos målgruppen.</tspan></text><text x="350" y="486" font-size="20" fill="#3B3F42" text-anchor="start"><tspan font-weight="700">Forklaring: </tspan><tspan font-weight="400">Du valgte målgruppevalg (C), som kommer før posisjoneringen.</tspan></text><path d="M350,490 H366 L374,498 V520 H350 Z" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><text x="362" y="515" font-size="8" font-weight="700" fill="#0B0C0C" text-anchor="middle">PDF</text><text x="386" y="514" font-size="18" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Kilde: </tspan><tspan font-weight="400">merkevare-notater.pdf, side 7</tspan></text><rect x="320" y="524" width="800" height="2" fill="#B1B4B6"/><text x="320" y="554" font-size="21" font-weight="700" fill="#0B0C0C" text-anchor="start">8. Hva er merkevareekvitet?</text><polyline points="322.64,576.1 328.8,582.04 339.8,568.4" fill="none" stroke="#00623A" stroke-width="4" stroke-linecap="square"/><text x="350" y="582" font-size="20" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700" fill="#00623A">Riktig svar: </tspan><tspan font-weight="400">Merverdien et merke gir, ut over de funksjonelle egenskapene.</tspan></text><text x="350" y="610" font-size="20" fill="#3B3F42" text-anchor="start"><tspan font-weight="700">Forklaring: </tspan><tspan font-weight="400">Ekvitet handler om merket, ikke om produktets pris.</tspan></text><path d="M350,614 H366 L374,622 V644 H350 Z" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><text x="362" y="639" font-size="8" font-weight="700" fill="#0B0C0C" text-anchor="middle">PDF</text><text x="386" y="638" font-size="18" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Kilde: </tspan><tspan font-weight="400">merkevare-notater.pdf, side 4</tspan></text><rect x="320" y="648" width="800" height="2" fill="#B1B4B6"/><text x="320" y="678" font-size="21" font-weight="700" fill="#0B0C0C" text-anchor="start">11. Hva kjennetegner en paraplymerkevare?</text><polyline points="322.64,700.1 328.8,706.04 339.8,692.4" fill="none" stroke="#00623A" stroke-width="4" stroke-linecap="square"/><text x="350" y="706" font-size="20" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700" fill="#00623A">Riktig svar: </tspan><tspan font-weight="400">Flere ulike produkter selges under samme merkenavn.</tspan></text><text x="350" y="734" font-size="20" fill="#3B3F42" text-anchor="start"><tspan font-weight="700">Forklaring: </tspan><tspan font-weight="400">Ett navn deler kjennskapen sin med alle produktene.</tspan></text><path d="M350,738 H366 L374,746 V768 H350 Z" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><text x="362" y="763" font-size="8" font-weight="700" fill="#0B0C0C" text-anchor="middle">PDF</text><text x="386" y="762" font-size="18" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Kilde: </tspan><tspan font-weight="400">merkevare-notater.pdf, side 10</tspan></text><rect x="320" y="772" width="800" height="2" fill="#B1B4B6"/><text x="320" y="802" font-size="21" font-weight="700" fill="#0B0C0C" text-anchor="start">14. Hvilken del av ekvitet handler om at kunden kjøper igjen?</text><polyline points="322.64,824.1 328.8,830.04 339.8,816.4" fill="none" stroke="#00623A" stroke-width="4" stroke-linecap="square"/><text x="350" y="830" font-size="20" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700" fill="#00623A">Riktig svar: </tspan><tspan font-weight="400">Lojalitet.</tspan></text><text x="350" y="858" font-size="20" fill="#3B3F42" text-anchor="start"><tspan font-weight="700">Forklaring: </tspan><tspan font-weight="400">Kjennskap handler om å kjenne merket, ikke om gjenkjøp.</tspan></text><path d="M350,862 H366 L374,870 V892 H350 Z" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><text x="362" y="887" font-size="8" font-weight="700" fill="#0B0C0C" text-anchor="middle">PDF</text><text x="386" y="886" font-size="18" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Kilde: </tspan><tspan font-weight="400">merkevare-forelesning2.pdf, side 3</tspan></text><rect x="320" y="896" width="800" height="2" fill="#B1B4B6"/></svg>