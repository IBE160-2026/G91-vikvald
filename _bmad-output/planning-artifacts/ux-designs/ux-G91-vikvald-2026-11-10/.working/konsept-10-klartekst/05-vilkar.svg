<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Studiekamerat – Klartekst – Vilkår</title><rect width="1440" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="1440" height="80" fill="#0B0C0C"/><rect x="0" y="80" width="1440" height="10" fill="#0B3D91"/><rect x="320" y="22" width="36" height="36" fill="#FFFFFF"/><polyline points="327.36,41.400000000000006 335.2,48.959999999999994 349.2,31.6" fill="none" stroke="#0B0C0C" stroke-width="5" stroke-linecap="square"/><text x="372" y="52" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Studiekamerat</text><text x="1047.616" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Logg ut</text><rect x="1047.616" y="58" width="72.38400000000001" height="2" fill="#FFFFFF"/><text x="952.912" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Konto</text><rect x="952.912" y="58" width="54.70400000000001" height="2" fill="#FFFFFF"/><text x="851.9680000000001" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Emner</text><rect x="851.9680000000001" y="58" width="60.944" height="6" fill="#FFFFFF"/><polyline points="330,111 322,119 330,127" fill="none" stroke="#0B3D91" stroke-width="3"/><text x="340" y="126" font-size="20" font-weight="400" fill="#0B3D91" text-anchor="start">Avbryt og gå tilbake til Uke 37: Merkevare</text><rect x="340" y="130" width="368.25600000000003" height="2" fill="#0B3D91"/><text x="320" y="176" font-size="22" font-weight="400" fill="#3B3F42" text-anchor="start">Før første opplasting</text><text x="320" y="226" font-size="48" font-weight="700" fill="#0B0C0C" text-anchor="start">Les dette før du laster opp</text><text x="320" y="272" font-size="20" font-weight="400" fill="#3B3F42" text-anchor="start">Du må godta dette én gang. Etterpå kan du laste opp så mange filer du vil.</text><rect x="320" y="318" width="800" height="318" fill="#F3F2F1"/><rect x="320" y="318" width="8" height="318" fill="#0B0C0C"/><circle cx="368" cy="361" r="6" fill="#0B0C0C"/><text x="392" y="368" font-size="21" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Du er ansvarlig</tspan><tspan font-weight="400"> for materialet du laster opp.</tspan></text><circle cx="368" cy="419" r="6" fill="#0B0C0C"/><text x="392" y="426" font-size="21" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Last bare opp egne notater</tspan><tspan font-weight="400"> eller materiale du har rett til å bruke.</tspan></text><circle cx="368" cy="477" r="6" fill="#0B0C0C"/><text x="392" y="484" font-size="21" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Notatene sendes til en språkmodell hos Google</tspan><tspan font-weight="400">, og behandles i EU.</tspan></text><circle cx="368" cy="535" r="6" fill="#0B0C0C"/><text x="392" y="542" font-size="21" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Google kan lagre forespørslene en periode</tspan><tspan font-weight="400"> for å oppdage misbruk.</tspan></text><circle cx="368" cy="593" r="6" fill="#0B0C0C"/><text x="392" y="600" font-size="21" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Ikke last opp personopplysninger</tspan><tspan font-weight="400">, for eksempel navn på medstudenter.</tspan></text><rect x="313" y="691" width="54" height="54" fill="none" stroke="#FFDD00" stroke-width="8"/><rect x="320" y="698" width="40" height="40" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="4"/><polyline points="327.84,719.6 336.8,728.24 352.8,708.4" fill="none" stroke="#0B0C0C" stroke-width="5" stroke-linecap="square"/><text x="380" y="726" font-size="22" font-weight="700" fill="#0B0C0C" text-anchor="start">Jeg har lest dette og godtar vilkårene</text><text x="380" y="758" font-size="20" font-weight="400" fill="#3B3F42" text-anchor="start">Du må krysse av før du kan laste opp.</text><rect x="320" y="796" width="246" height="56" fill="#0B3D91"/><rect x="320" y="852" width="246" height="4" fill="#06245A"/><path d="M352,831.0 V815.0 M345,822.0 L352,815.0 L359,822.0 M342,835.0 H362" fill="none" stroke="#FFFFFF" stroke-width="3"/><text x="376" y="831.0" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Godta og last opp</text><rect x="582" y="796" width="109" height="56" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><rect x="582" y="852" width="109" height="4" fill="#0B0C0C"/><text x="606" y="831.0" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="start">Avbryt</text></svg>