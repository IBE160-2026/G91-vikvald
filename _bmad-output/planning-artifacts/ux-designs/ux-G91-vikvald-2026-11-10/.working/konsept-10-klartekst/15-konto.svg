<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t"><title id="t">Studiekamerat – Klartekst – Konto</title><rect width="1440" height="900" fill="#FFFFFF"/><rect x="0" y="0" width="1440" height="80" fill="#0B0C0C"/><rect x="0" y="80" width="1440" height="10" fill="#0B3D91"/><rect x="320" y="22" width="36" height="36" fill="#FFFFFF"/><polyline points="327.36,41.400000000000006 335.2,48.959999999999994 349.2,31.6" fill="none" stroke="#0B0C0C" stroke-width="5" stroke-linecap="square"/><text x="372" y="52" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="start">Studiekamerat</text><text x="1047.616" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Logg ut</text><rect x="1047.616" y="58" width="72.38400000000001" height="2" fill="#FFFFFF"/><text x="952.912" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Konto</text><rect x="952.912" y="58" width="54.70400000000001" height="6" fill="#FFFFFF"/><text x="851.9680000000001" y="50" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Emner</text><rect x="851.9680000000001" y="58" width="60.944" height="2" fill="#FFFFFF"/><rect x="0" y="90" width="1440" height="56" fill="#F3F2F1"/><rect x="0" y="146" width="1440" height="2" fill="#B1B4B6"/><rect x="320" y="102" width="74.1008" height="32" fill="#0B3D91" stroke="#0B3D91" stroke-width="2"/><text x="330" y="123" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="start">DEMO</text><text x="410.1008" y="125" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">Demomodus: innholdet lages av en testmodell, ikke av en ekte språkmodell.</text><text x="320" y="222" font-size="48" font-weight="700" fill="#0B0C0C" text-anchor="start">Kontoen din</text><rect x="320" y="252" width="800" height="3" fill="#0B0C0C"/><text x="320" y="292" font-size="22" font-weight="700" fill="#0B0C0C" text-anchor="start">E-postadresse</text><text x="580" y="292" font-size="22" font-weight="400" fill="#0B0C0C" text-anchor="start">klara@student.no</text><rect x="320" y="316" width="800" height="2" fill="#B1B4B6"/><text x="320" y="356" font-size="22" font-weight="700" fill="#0B0C0C" text-anchor="start">Innhold</text><text x="580" y="356" font-size="22" font-weight="400" fill="#0B0C0C" text-anchor="start">3 emner, 15 forelesninger, 21 filer</text><rect x="320" y="380" width="800" height="2" fill="#B1B4B6"/><rect x="320" y="412" width="120" height="56" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><rect x="320" y="468" width="120" height="4" fill="#0B0C0C"/><text x="344" y="447.0" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="start">Logg ut</text><text x="320" y="530" font-size="32" font-weight="700" fill="#0B0C0C" text-anchor="start">Slett kontoen</text><circle cx="340" cy="576" r="20" fill="#0B0C0C"/><text x="340" y="586" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">!</text><text x="380" y="584" font-size="22" font-weight="700" fill="#0B0C0C" text-anchor="start">Alle emner, filer og alt generert innhold slettes for godt.</text><text x="380" y="616" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">Det gjelder flashcards, quizer, huskeregler, fritekstspørsmål og sammendrag. Det</text><text x="380" y="646" font-size="20" font-weight="400" fill="#0B0C0C" text-anchor="start">kan ikke angres, og vi kan ikke hente noe tilbake.</text><rect x="320" y="682" width="205" height="56" fill="#A3221B"/><rect x="320" y="738" width="205" height="4" fill="#5E120E"/><path d="M344,704.0 H362 M350,704.0 V700.0 H356 V704.0 M346,704.0 L347,721.0 H359 L360,704.0" fill="none" stroke="#FFFFFF" stroke-width="2.5"/><text x="376" y="717.0" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start">Slett kontoen</text><text x="549" y="718" font-size="20" font-weight="400" fill="#3B3F42" text-anchor="start">Du får et steg til for å bekrefte.</text></svg>