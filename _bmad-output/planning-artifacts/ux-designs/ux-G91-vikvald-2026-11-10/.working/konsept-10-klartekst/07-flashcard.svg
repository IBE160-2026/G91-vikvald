ght="16" fill="#0B3D91"/><text x="1120" y="178" font-size="20" font-weight="400" fill="#3B3F42" text-anchor="end">6 ferdige, 18 igjen</text><rect x="320" y="240" width="800" height="400" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><text x="360" y="290" font-size="18" font-weight="700" fill="#3B3F42" text-anchor="start" letter-spacing="2">SPØRSMÅL</text><text x="360" y="334" font-size="32" font-weight="700" fill="#0B0C0C" text-anchor="start">Hva er merkevareekvitet (brand equity)?</text><rect x="360" y="368" width="720" height="2" fill="#0B0C0C"/><text x="360" y="412" font-size="18" font-weight="700" fill="#3B3F42" text-anchor="start" letter-spacing="2">SVAR</text><text x="360" y="452" font-size="24" font-weight="400" fill="#0B0C0C" text-anchor="start">Den merverdien et merke gir et produkt, ut over produktets</text><text x="360" y="488" font-size="24" font-weight="400" fill="#0B0C0C" text-anchor="start">funksjonelle egenskaper. Bygges av kjennskap, assosiasjoner,</text><text x="360" y="524" font-size="24" font-weight="400" fill="#0B0C0C" text-anchor="start">oppfattet kvalitet og lojalitet.</text><rect x="320" y="570" width="800" height="70" fill="#F3F2F1" stroke="#0B0C0C" stroke-width="3"/><path d="M360,590 H376 L384,598 V620 H360 Z" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><text x="372" y="615" font-size="8" font-weight="700" fill="#0B0C0C" text-anchor="middle">PDF</text><text x="396" y="614" font-size="20" fill="#0B0C0C" text-anchor="start"><tspan font-weight="700">Kilde: </tspan><tspan font-weight="400">merkevare-notater.pdf, side 4</tspan></text><text x="320" y="696" font-size="26" font-weight="700" fill="#0B0C0C" text-anchor="start">Kunne du svaret?</text><rect x="320" y="720" width="140" height="56" fill="#FFDD00"/><rect x="320" y="776" width="140" height="4" fill="#0B0C0C"/><polyline points="344.64,749.1 350.8,755.04 361.8,741.4" fill="none" stroke="#0B0C0C" stroke-width="4" stroke-linecap="square"/><text x="376" y="755.0" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="start">Kunne</text><rect x="476" y="720" width="187" height="56" fill="#FFFFFF" stroke="#0B0C0C" stroke-width="3"/><rect x="476" y="776" width="187" height="4" fill="#0B0C0C"/><path d="M501.96,740.96 L516.04,755.04 M516.04,740.96 L501.96,755.04" stroke="#0B0C0C" stroke-width="4" stroke-linecap="square"/><text x="532" y="755.0" font-size="20" font-weight="700" fill="#0B0C0C" text-anchor="start">Kunne ikke</text><text x="695" y="756" font-size="20" font-weight="400" fill="#3B3F42" text-anchor="start">Kortene du ikke kunne, kommer igjen til slutt.</text></svg>