<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Studiekamerat – Sammendrag Uke 37: Merkevare</title>
<rect width="1440" height="900" fill="#FFFFFF"/>
<text x="72" y="50" font-size="22" font-weight="700" fill="#000000">Studiekamerat</text><rect x="72" y="18" width="0" height="0" fill="none"/><text x="952" y="50" font-size="18" font-weight="700" fill="#000000">Emner</text><rect x="952" y="74" width="86" height="6" fill="#E2001A"/><text x="1062" y="50" font-size="18" font-weight="400" fill="#000000">Konto</text><text x="1368" y="50" font-size="18" font-weight="400" fill="#000000" text-anchor="end">Logg ut</text><rect x="0" y="80" width="1440" height="1" fill="#000000"/>
<text x="72" y="124" font-size="16" font-weight="400" fill="#000000">Emner</text><rect x="72" y="128" width="40" height="1" fill="#000000"/><text x="124.0" y="124" font-size="16" font-weight="400" fill="#555555">/</text><text x="146.0" y="124" font-size="16" font-weight="400" fill="#000000">Markedsføring</text><rect x="146.0" y="128" width="104" height="1" fill="#000000"/><text x="262.0" y="124" font-size="16" font-weight="400" fill="#555555">/</text><text x="284.0" y="124" font-size="16" font-weight="400" fill="#000000">Uke 37: Merkevare</text><rect x="284.0" y="128" width="136" height="1" fill="#000000"/><text x="432.0" y="124" font-size="16" font-weight="400" fill="#555555">/</text><text x="454.0" y="124" font-size="16" font-weight="700" fill="#000000">Sammendrag</text>
<text x="66" y="220" font-size="88" font-weight="700" fill="#000000" letter-spacing="-3">Sammendrag</text>
<text x="72" y="260" font-size="18" font-weight="400" fill="#555555">Uke 37: Merkevare · laget 12.09.2026 fra 2 filer</text>
<rect x="1062" y="150" width="306" height="56" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="1082" y="184.3" font-size="18" font-weight="700" fill="#000000">Lag nytt sammendrag</text><text x="1348" y="184.3" font-size="22" font-weight="700" fill="#000000" text-anchor="end">→</text>
<text x="1368" y="232" font-size="16" font-weight="400" fill="#555555" text-anchor="end">Erstatter dette sammendraget.</text>
<text x="1062" y="286" font-size="16" font-weight="700" fill="#000000" letter-spacing="1.2">KILDE</text>
<text x="512" y="286" font-size="16" font-weight="700" fill="#000000" letter-spacing="1.2">PUNKT</text>
<rect x="72" y="300" width="1296" height="2" fill="#000000"/>
<text x="66" y="376" font-size="72" font-weight="700" fill="#E2001A" letter-spacing="-2">1</text>
<text x="182" y="340" font-size="24" font-weight="700" fill="#000000">Hva er en merkevare</text>
<text x="512" y="340" font-size="18" font-weight="400" fill="#000000"><tspan x="512" dy="0">En merkevare er et navn, symbol eller design som skiller</tspan><tspan x="512" dy="26">et produkt fra konkurrentenes.</tspan></text>
<text x="1062" y="340" font-size="16" font-weight="400" fill="#000000">merkevare-notater.pdf</text>
<text x="1062" y="364" font-size="16" font-weight="700" fill="#000000">side 2</text>
<rect x="512" y="386" width="856" height="1" fill="#000000"/>
<text x="512" y="414" font-size="18" font-weight="400" fill="#000000"><tspan x="512" dy="0">Merket er et løfte til kunden om hva produktet skal</tspan><tspan x="512" dy="26">levere, hver gang det kjøpes.</tspan></text>
<text x="1062" y="414" font-size="16" font-weight="400" fill="#000000">merkevare-notater.pdf</text>
<text x="1062" y="438" font-size="16" font-weight="700" fill="#000000">side 3</text>
<rect x="72" y="482" width="1296" height="2" fill="#000000"/>
<text x="66" y="558" font-size="72" font-weight="700" fill="#000000" letter-spacing="-2">2</text>
<text x="182" y="522" font-size="24" font-weight="700" fill="#000000">Merkevareekvitet</text>
<text x="512" y="522" font-size="18" font-weight="400" fill="#000000"><tspan x="512" dy="0">Merkevareekvitet er merverdien et merke gir produktet, ut</tspan><tspan x="512" dy="26">over de funksjonelle egenskapene.</tspan></text>
<text x="1062" y="522" font-size="16" font-weight="400" fill="#000000">merkevare-notater.pdf</text>
<text x="1062" y="546" font-size="16" font-weight="700" fill="#000000">side 4</text>
<rect x="512" y="568" width="856" height="1" fill="#000000"/>
<text x="512" y="596" font-size="18" font-weight="400" fill="#000000"><tspan x="512" dy="0">Den bygges av kjennskap, assosiasjoner, oppfattet kvalitet</tspan><tspan x="512" dy="26">og lojalitet.</tspan></text>
<text x="1062" y="596" font-size="16" font-weight="400" fill="#000000">merkevare-forelesning2.pdf</text>
<text x="1062" y="620" font-size="16" font-weight="700" fill="#000000">side 2</text>
<rect x="72" y="664" width="1296" height="2" fill="#000000"/>
<text x="66" y="740" font-size="72" font-weight="700" fill="#000000" letter-spacing="-2">3</text>
<text x="182" y="704" font-size="24" font-weight="700" fill="#000000">Merkevarestrategier</text>
<text x="512" y="704" font-size="18" font-weight="400" fill="#000000"><tspan x="512" dy="0">Linjeutvidelse gir nye varianter i samme kategori.</tspan><tspan x="512" dy="26">Merkeutvidelse tar merket inn i en ny kategori.</tspan></text>
<text x="1062" y="704" font-size="16" font-weight="400" fill="#000000">merkevare-forelesning2.pdf</text>
<text x="1062" y="728" font-size="16" font-weight="700" fill="#000000">side 5</text>
<rect x="512" y="750" width="856" height="1" fill="#000000"/>
<text x="512" y="778" font-size="18" font-weight="400" fill="#000000"><tspan x="512" dy="0">Et paraplymerke samler flere produkter under ett navn.</tspan><tspan x="512" dy="26">Enkeltmerker gir hvert produkt sitt eget navn.</tspan></text>
<text x="1062" y="778" font-size="16" font-weight="400" fill="#000000">merkevare-notater.pdf</text>
<text x="1062" y="802" font-size="16" font-weight="700" fill="#000000">side 10</text>
<rect x="72" y="850" width="1296" height="2" fill="#000000"/>
</svg>
