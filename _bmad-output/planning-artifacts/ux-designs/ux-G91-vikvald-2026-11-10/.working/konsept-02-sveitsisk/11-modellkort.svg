<rect x="72.0" y="104" width="429.33" height="8" fill="#000000"/><rect x="505.33" y="104" width="429.33" height="8" fill="#E2001A"/><rect x="938.67" y="104" width="429.33" height="8" fill="#D9D9D9"/><text x="72" y="142" font-size="16" font-weight="700" fill="#000000">Modellkort 2 av 3</text><text x="1368" y="142" font-size="16" font-weight="400" fill="#555555" text-anchor="end">1 igjen</text>
<text x="72" y="196" font-size="16" font-weight="700" fill="#555555" letter-spacing="1.2">FORSIDE</text>
<text x="70" y="248" font-size="44" font-weight="700" fill="#000000" letter-spacing="-1.2">Forklar AIDA-modellen</text>
<rect x="72" y="284" width="1296" height="1" fill="#000000"/>
<text x="72" y="330" font-size="16" font-weight="700" fill="#E2001A" letter-spacing="1.2">BAKSIDE – KORTET ER SNUDD</text>
<text x="1368" y="330" font-size="16" font-weight="400" fill="#000000" text-anchor="end">Snu tilbake (mellomrom)</text>
