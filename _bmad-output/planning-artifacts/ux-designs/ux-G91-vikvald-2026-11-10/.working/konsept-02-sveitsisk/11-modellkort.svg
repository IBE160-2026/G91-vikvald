<rect x="72" y="356" width="306" height="2" fill="#000000"/>
<text x="64" y="530" font-size="200" font-weight="700" fill="#E2001A" letter-spacing="-6">A</text>
<text x="72" y="580" font-size="24" font-weight="700" fill="#000000">Attention</text>
<text x="72" y="610" font-size="20" font-weight="400" fill="#555555">(oppmerksomhet)</text>
<text x="72" y="644" font-size="16" font-weight="400" fill="#000000">Fang blikket til mottakeren.</text>
<rect x="402" y="356" width="306" height="2" fill="#000000"/>
<text x="394" y="530" font-size="200" font-weight="700" fill="#000000" letter-spacing="-6">I</text>
<text x="402" y="580" font-size="24" font-weight="700" fill="#000000">Interest</text>
<text x="402" y="610" font-size="20" font-weight="400" fill="#555555">(interesse)</text>
<text x="402" y="644" font-size="16" font-weight="400" fill="#000000">Vekk nysgjerrighet for tilbudet.</text>
<rect x="732" y="356" width="306" height="2" fill="#000000"/>
<text x="724" y="530" font-size="200" font-weight="700" fill="#000000" letter-spacing="-6">D</text>
<text x="732" y="580" font-size="24" font-weight="700" fill="#000000">Desire</text>
<text x="732" y="610" font-size="20" font-weight="400" fill="#555555">(ønske)</text>
<text x="732" y="644" font-size="16" font-weight="400" fill="#000000">Skap lyst på produktet.</text>
<rect x="1062" y="356" width="306" height="2" fill="#000000"/>
<text x="1054" y="530" font-size="200" font-weight="700" fill="#000000" letter-spacing="-6">A</text>
<text x="1062" y="580" font-size="24" font-weight="700" fill="#000000">Action</text>
<text x="1062" y="610" font-size="20" font-weight="400" fill="#555555">(handling)</text>
<text x="1062" y="644" font-size="16" font-weight="400" fill="#000000">Få kunden til å handle.</text>
<rect x="72" y="676" width="1296" height="1" fill="#000000"/>
<text x="72" y="716" font-size="16" font-weight="700" fill="#000000" letter-spacing="1.2">HUSKEREGEL</text>
<text x="292" y="716" font-size="20" font-weight="700" fill="#000000">«AIDA» – fra å legge merke til tilbudet, til å handle.</text>
<rect x="292" y="738" width="10" height="10" fill="#E2001A"/>
<text x="314" y="748" font-size="16" font-weight="700" fill="#000000">Kilde: merkevare-notater.pdf, side 9</text>
