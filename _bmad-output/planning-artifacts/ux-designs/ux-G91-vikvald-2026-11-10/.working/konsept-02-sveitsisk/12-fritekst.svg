<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Studiekamerat – Fritekstspørsmål 2 av 10</title>
<rect width="1440" height="900" fill="#FFFFFF"/>
<text x="72" y="50" font-size="22" font-weight="700" fill="#000000">Studiekamerat</text><text x="512" y="50" font-size="18" font-weight="400" fill="#000000">Uke 37: Merkevare — Fritekstspørsmål</text><rect x="1168" y="16" width="200" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="1188" y="45.6" font-size="16" font-weight="700" fill="#000000">Avslutt økt</text><rect x="0" y="80" width="1440" height="1" fill="#000000"/>
<rect x="72.0" y="104" width="126.0" height="8" fill="#000000"/><rect x="202.0" y="104" width="126.0" height="8" fill="#E2001A"/><rect x="332.0" y="104" width="126.0" height="8" fill="#D9D9D9"/><rect x="462.0" y="104" width="126.0" height="8" fill="#D9D9D9"/><rect x="592.0" y="104" width="126.0" height="8" fill="#D9D9D9"/><rect x="722.0" y="104" width="126.0" height="8" fill="#D9D9D9"/><rect x="852.0" y="104" width="126.0" height="8" fill="#D9D9D9"/><rect x="982.0" y="104" width="126.0" height="8" fill="#D9D9D9"/><rect x="1112.0" y="104" width="126.0" height="8" fill="#D9D9D9"/><rect x="1242.0" y="104" width="126.0" height="8" fill="#D9D9D9"/><text x="72" y="142" font-size="16" font-weight="700" fill="#000000">Spørsmål 2 av 10</text><text x="1368" y="142" font-size="16" font-weight="400" fill="#555555" text-anchor="end">Langsvar · vurder selv</text>
<text x="66" y="470" font-size="300" font-weight="700" fill="#000000" letter-spacing="-12">2</text><text x="232" y="470" font-size="96" font-weight="700" fill="#767676" letter-spacing="-3">/10</text>
<text x="72" y="560" font-size="16" font-weight="400" fill="#555555"><tspan x="72" dy="0">Sammenlign svaret ditt med</tspan><tspan x="72" dy="24">modellsvaret, og vurder ærlig.</tspan><tspan x="72" dy="24">Vurderingen brukes bare til å vise hva</tspan><tspan x="72" dy="24">du bør øve mer på.</tspan></text>
<text x="512" y="200" font-size="30" font-weight="700" fill="#000000"><tspan x="512" dy="0">Forklar forskjellen på segmentering og</tspan><tspan x="512" dy="40">posisjonering, og gi et eksempel.</tspan></text>
<text x="512" y="298" font-size="16" font-weight="700" fill="#000000">Ditt svar</text>
<rect x="512" y="312" width="416" height="320" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="530" y="348" font-size="18" font-weight="400" fill="#000000"><tspan x="530" dy="0">Segmentering er når man deler markedet inn</tspan><tspan x="530" dy="28">i grupper av kunder som ligner hverandre.</tspan><tspan x="530" dy="28">Posisjonering handler om hvordan merket</tspan><tspan x="530" dy="28">skal oppfattes av kundene. Et eksempel er</tspan><tspan x="530" dy="28">en treningskjede som deler markedet i</tspan><tspan x="530" dy="28">studenter og pensjonister, og posisjonerer</tspan><tspan x="530" dy="28">seg som det rimelige valget for studenter.</tspan></text>
<text x="952" y="298" font-size="16" font-weight="700" fill="#000000" letter-spacing="1.2">MODELLSVAR</text>
<rect x="952" y="312" width="416" height="2" fill="#000000"/>
<text x="952" y="348" font-size="18" font-weight="400" fill="#000000"><tspan x="952" dy="0">Segmentering er å dele markedet inn i grupper</tspan><tspan x="952" dy="28">med like behov eller kjennetegn. Posisjonering</tspan><tspan x="952" dy="28">er å bestemme hvilket bilde merket skal ha i</tspan><tspan x="952" dy="28">målgruppens bevissthet, sammenlignet med</tspan><tspan x="952" dy="28">konkurrentene. Eksempel: En bilprodusent</tspan><tspan x="952" dy="28">segmenterer etter livsfase og posisjonerer én</tspan><tspan x="952" dy="28">modell som den tryggeste familiebilen.</tspan></text>
<rect x="952" y="546" width="10" height="10" fill="#E2001A"/>
<text x="974" y="556" font-size="16" font-weight="700" fill="#000000">Kilde: merkevare-notater.pdf, side 6–7</text>
<rect x="512" y="676" width="856" height="1" fill="#000000"/>
<text x="512" y="716" font-size="20" font-weight="700" fill="#000000">Hvordan gikk det? Vurder svaret ditt selv.</text>
<rect x="512.0" y="740" width="269.3" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="532.0" y="779.0" font-size="20" font-weight="700" fill="#000000">✓ Riktig</text><text x="761.3" y="779.0" font-size="16" font-weight="400" fill="#555555" text-anchor="end">Tast 1</text>
<rect x="805.3" y="740" width="269.3" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="825.3" y="779.0" font-size="20" font-weight="700" fill="#000000">½ Delvis riktig</text><text x="1054.6" y="779.0" font-size="16" font-weight="400" fill="#555555" text-anchor="end">Tast 2</text>
<rect x="798.3" y="733" width="283.3" height="78" fill="none" stroke="#000000" stroke-width="3"/>
<rect x="1098.7" y="740" width="269.3" height="64" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="1118.7" y="779.0" font-size="20" font-weight="700" fill="#000000">✗ Feil</text><text x="1348.0" y="779.0" font-size="16" font-weight="400" fill="#555555" text-anchor="end">Tast 3</text>
</svg>
