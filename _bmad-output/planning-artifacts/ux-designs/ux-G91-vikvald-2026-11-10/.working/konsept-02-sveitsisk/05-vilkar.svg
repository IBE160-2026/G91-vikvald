<rect x="1062" y="672" width="306" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="1082" y="701.6" font-size="16" font-weight="700" fill="#000000">Lag fritekstspørsmål</text><text x="1348" y="701.6" font-size="20" font-weight="700" fill="#000000" text-anchor="end">→</text>
<rect x="622" y="745" width="746" height="1" fill="#000000"/>
