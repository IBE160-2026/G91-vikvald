<text x="742" y="518" font-size="16" font-weight="400" fill="#555555">15 spørsmål</text>
<rect x="1062" y="472" width="306" height="48" fill="#000000"/><text x="1082" y="501.6" font-size="16" font-weight="700" fill="#FFFFFF">Ta quiz</text><text x="1348" y="501.6" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="end">→</text>
<rect x="622" y="545" width="746" height="1" fill="#000000"/>
