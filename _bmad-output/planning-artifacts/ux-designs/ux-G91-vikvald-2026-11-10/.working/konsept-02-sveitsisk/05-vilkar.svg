<rect x="622" y="845" width="746" height="1" fill="#000000"/>
<rect x="0" y="0" width="1440" height="900" fill="#000000" fill-opacity="0.62"/>
<rect x="292" y="92" width="856" height="728" fill="#FFFFFF"/>
<rect x="292" y="92" width="856" height="8" fill="#000000"/>
<text x="340" y="156" font-size="16" font-weight="700" fill="#E2001A" letter-spacing="1.2">FØR FØRSTE OPPLASTING</text>
<text x="340" y="206" font-size="44" font-weight="700" fill="#000000" letter-spacing="-1.2">Vilkår for opplasting</text>
<rect x="340" y="242" width="760" height="2" fill="#000000"/>
<text x="340" y="286" font-size="32" font-weight="700" fill="#000000">1</text>
<text x="404" y="282" font-size="19" font-weight="400" fill="#000000">Du er ansvarlig for materialet du laster opp.</text>
<rect x="340" y="306" width="760" height="1" fill="#000000"/>
<text x="340" y="350" font-size="32" font-weight="700" fill="#000000">2</text>
<text x="404" y="346" font-size="19" font-weight="400" fill="#000000">Last bare opp egne notater eller materiale du har rett til å bruke.</text>
<rect x="340" y="370" width="760" height="1" fill="#000000"/>
<text x="340" y="414" font-size="32" font-weight="700" fill="#000000">3</text>
<text x="404" y="410" font-size="19" font-weight="400" fill="#000000">Notatene sendes til språkmodellen hos Google i EU, som lager øvingsmaterialet.</text>
<rect x="340" y="434" width="760" height="1" fill="#000000"/>
<text x="340" y="478" font-size="32" font-weight="700" fill="#000000">4</text>
<text x="404" y="474" font-size="19" font-weight="400" fill="#000000">Google kan logge forespørslene en periode for å oppdage misbruk.</text>
<rect x="340" y="498" width="760" height="1" fill="#000000"/>
<text x="340" y="542" font-size="32" font-weight="700" fill="#E2001A">5</text>
<text x="404" y="538" font-size="19" font-weight="700" fill="#000000">Ikke last opp personopplysninger, for eksempel navn på medstudenter.</text>
<rect x="340" y="562" width="760" height="1" fill="#000000"/>
<rect x="340" y="602" width="28" height="28" fill="#000000"/>
<text x="354" y="623" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
<rect x="333" y="595" width="42" height="42" fill="none" stroke="#000000" stroke-width="3"/>
<text x="388" y="623" font-size="19" font-weight="700" fill="#000000">Jeg har lest og forstått vilkårene.</text>
<rect x="340" y="716" width="160" height="56" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="360" y="750.3" font-size="18" font-weight="700" fill="#000000">Avbryt</text>
<rect x="820" y="716" width="280" height="56" fill="#000000"/><text x="840" y="750.3" font-size="18" font-weight="700" fill="#FFFFFF">Godta og last opp</text><text x="1080" y="750.3" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="end">→</text>
</svg>
