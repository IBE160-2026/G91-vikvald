<text x="512" y="386" font-size="30" font-weight="400" fill="#000000"><tspan x="512" dy="0">Den merverdien et merke gir et produkt, ut over</tspan><tspan x="512" dy="42">produktets funksjonelle egenskaper. Bygges av kjennskap,</tspan><tspan x="512" dy="42">assosiasjoner, oppfattet kvalitet og lojalitet.</tspan></text>
