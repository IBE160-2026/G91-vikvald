<rect width="1440" height="900" fill="#FFFFFF"/>
<text x="72" y="50" font-size="22" font-weight="700" fill="#000000">Studiekamerat</text><text x="512" y="50" font-size="18" font-weight="400" fill="#000000">Uke 37: Merkevare — Quiz</text><rect x="1168" y="16" width="200" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="1188" y="45.6" font-size="16" font-weight="700" fill="#000000">Til forelesningen</text><rect x="0" y="80" width="1440" height="1" fill="#000000"/>
<rect x="72.0" y="104" width="82.67" height="8" fill="#000000"/><rect x="158.67" y="104" width="82.67" height="8" fill="#000000"/><rect x="245.33" y="104" width="82.67" height="8" fill="#000000"/><rect x="332.0" y="104" width="82.67" height="8" fill="#E2001A"/><rect x="418.67" y="104" width="82.67" height="8" fill="#000000"/><rect x="505.33" y="104" width="82.67" height="8" fill="#000000"/><rect x="592.0" y="104" width="82.67" height="8" fill="#E2001A"/><rect x="678.67" y="104" width="82.67" height="8" fill="#000000"/><rect x="765.33" y="104" width="82.67" height="8" fill="#E2001A"/><rect x="852.0" y="104" width="82.67" height="8" fill="#000000"/><rect x="938.67" y="104" width="82.67" height="8" fill="#000000"/><rect x="1025.33" y="104" width="82.67" height="8" fill="#000000"/><rect x="1112.0" y="104" width="82.67" height="8" fill="#E2001A"/><rect x="1198.67" y="104" width="82.67" height="8" fill="#000000"/><rect x="1285.33" y="104" width="82.67" height="8" fill="#000000"/><text x="72" y="142" font-size="16" font-weight="700" fill="#000000">15 av 15 besvart</text><text x="1368" y="142" font-size="16" font-weight="400" fill="#555555" text-anchor="end">Quizen er fullført</text>
<text x="60" y="420" font-size="220" font-weight="700" fill="#000000" letter-spacing="-10">11</text>
<text x="306" y="420" font-size="80" font-weight="700" fill="#767676" letter-spacing="-2">/15</text>
<text x="72" y="470" font-size="28" font-weight="700" fill="#000000">riktige</text>
<text x="72" y="502" font-size="16" font-weight="400" fill="#555555">Uke 37: Merkevare · Quiz, vanlig, middels</text>
<rect x="72" y="600" width="306" height="56" fill="#000000"/><text x="92" y="634.3" font-size="18" font-weight="700" fill="#FFFFFF">Ta quizen på nytt</text><text x="358" y="634.3" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="end">→</text>
<rect x="72" y="672" width="306" height="56" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="92" y="706.3" font-size="18" font-weight="700" fill="#000000">Tilbake til forelesningen</text>
<text x="512" y="190" font-size="32" font-weight="700" fill="#000000" letter-spacing="-0.8">4 feil å se på</text>
<text x="1368" y="190" font-size="16" font-weight="400" fill="#555555" text-anchor="end">Røde felt i linja over = feil svar</text>
<rect x="512" y="210" width="856" height="2" fill="#000000"/>
<text x="512" y="252" font-size="32" font-weight="700" fill="#E2001A" letter-spacing="-1">4</text>
<text x="622" y="246" font-size="20" font-weight="700" fill="#000000">Hvilken av disse beskriver best posisjonering?</text>
<text x="622" y="274" font-size="16" font-weight="400" fill="#E2001A">✗ Ditt svar: Å velge hvilke segmenter bedriften skal satse på</text>
<text x="622" y="300" font-size="16" font-weight="700" fill="#000000">✓ Riktig svar: Å skape et tydelig og ønsket bilde av merket i målgruppens bevissthet</text>
<text x="622" y="326" font-size="16" font-weight="400" fill="#555555">Segmentvalg er målgruppevalg. Posisjonering er bildet av merket.</text>
<text x="622" y="350" font-size="16" font-weight="400" fill="#000000">Kilde: merkevare-notater.pdf, side 7</text>
<rect x="512" y="365" width="856" height="1" fill="#000000"/>
<text x="512" y="406" font-size="32" font-weight="700" fill="#E2001A" letter-spacing="-1">7</text>
<text x="622" y="400" font-size="20" font-weight="700" fill="#000000">Hva kjennetegner en paraplymerkevare?</text>
<text x="622" y="428" font-size="16" font-weight="400" fill="#E2001A">✗ Ditt svar: Hvert produkt har sitt eget merkenavn</text>
<text x="622" y="454" font-size="16" font-weight="700" fill="#000000">✓ Riktig svar: Flere produkter selges under samme merkenavn</text>
<text x="622" y="480" font-size="16" font-weight="400" fill="#555555">Nye produkter låner tillit fra et navn kundene kjenner.</text>
<text x="622" y="504" font-size="16" font-weight="400" fill="#000000">Kilde: merkevare-notater.pdf, side 10</text>
<rect x="512" y="519" width="856" height="1" fill="#000000"/>
<text x="512" y="560" font-size="32" font-weight="700" fill="#E2001A" letter-spacing="-1">9</text>
<text x="622" y="554" font-size="20" font-weight="700" fill="#000000">Hva er merkekjennskap?</text>
<text x="622" y="582" font-size="16" font-weight="400" fill="#E2001A">✗ Ditt svar: Hvor godt kundene liker merket</text>
<text x="622" y="608" font-size="16" font-weight="700" fill="#000000">✓ Riktig svar: I hvilken grad kundene kjenner igjen og husker merket</text>
<text x="622" y="634" font-size="16" font-weight="400" fill="#555555">Kjennskap handler om å huske merket, ikke om å like det.</text>
<text x="622" y="658" font-size="16" font-weight="400" fill="#000000">Kilde: merkevare-forelesning2.pdf, side 2</text>
<rect x="512" y="673" width="856" height="1" fill="#000000"/>
<text x="512" y="714" font-size="32" font-weight="700" fill="#E2001A" letter-spacing="-1">13</text>
<text x="622" y="708" font-size="20" font-weight="700" fill="#000000">Hva er en linjeutvidelse?</text>
<text x="622" y="736" font-size="16" font-weight="400" fill="#E2001A">✗ Ditt svar: Å bruke merket i en helt ny produktkategori</text>
<text x="622" y="762" font-size="16" font-weight="700" fill="#000000">✓ Riktig svar: Å lansere nye varianter i samme produktkategori under samme merke</text>
<text x="622" y="788" font-size="16" font-weight="400" fill="#555555">En ny kategori kalles merkeutvidelse.</text>
<text x="622" y="812" font-size="16" font-weight="400" fill="#000000">Kilde: merkevare-forelesning2.pdf, side 5</text>
<rect x="512" y="827" width="856" height="1" fill="#000000"/>
</svg>
