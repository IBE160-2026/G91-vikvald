<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<title>Studiekamerat – Quiz, spørsmål 4 av 15</title>
<rect width="1440" height="900" fill="#FFFFFF"/>
<text x="72" y="50" font-size="22" font-weight="700" fill="#000000">Studiekamerat</text><text x="512" y="50" font-size="18" font-weight="400" fill="#000000">Uke 37: Merkevare — Quiz</text><rect x="1168" y="16" width="200" height="48" fill="#FFFFFF" stroke="#000000" stroke-width="2"/><text x="1188" y="45.6" font-size="16" font-weight="700" fill="#000000">Avslutt økt</text><rect x="0" y="80" width="1440" height="1" fill="#000000"/>
<rect x="72.0" y="104" width="82.67" height="8" fill="#000000"/><rect x="158.67" y="104" width="82.67" height="8" fill="#000000"/><rect x="245.33" y="104" width="82.67" height="8" fill="#000000"/><rect x="332.0" y="104" width="82.67" height="8" fill="#E2001A"/><rect x="418.67" y="104" width="82.67" height="8" fill="#D9D9D9"/><rect x="505.33" y="104" width="82.67" height="8" fill="#D9D9D9"/><rect x="592.0" y="104" width="82.67" height="8" fill="#D9D9D9"/><rect x="678.67" y="104" width="82.67" height="8" fill="#D9D9D9"/><rect x="765.33" y="104" width="82.67" height="8" fill="#D9D9D9"/><rect x="852.0" y="104" width="82.67" height="8" fill="#D9D9D9"/><rect x="938.67" y="104" width="82.67" height="8" fill="#D9D9D9"/><rect x="1025.33" y="104" width="82.67" height="8" fill="#D9D9D9"/><rect x="1112.0" y="104" width="82.67" height="8" fill="#D9D9D9"/><rect x="1198.67" y="104" width="82.67" height="8" fill="#D9D9D9"/><rect x="1285.33" y="104" width="82.67" height="8" fill="#D9D9D9"/><text x="72" y="142" font-size="16" font-weight="700" fill="#000000">Spørsmål 4 av 15</text><text x="1368" y="142" font-size="16" font-weight="400" fill="#555555" text-anchor="end">3 riktige så langt</text>
<text x="66" y="470" font-size="300" font-weight="700" fill="#000000" letter-spacing="-12">4</text><text x="232" y="470" font-size="96" font-weight="700" fill="#767676" letter-spacing="-3">/15</text>
<text x="512" y="204" font-size="32" font-weight="700" fill="#000000" letter-spacing="-0.8">Hvilken av disse beskriver best posisjonering?</text>
<rect x="512" y="234" width="856" height="2" fill="#000000"/>
<rect x="534" y="248" width="36" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="552" y="274" font-size="22" font-weight="700" fill="#000000" text-anchor="middle">A</text>
<text x="596" y="273" font-size="20" font-weight="400" fill="#000000"><tspan x="596" dy="0">Å dele markedet inn i grupper med like behov</tspan></text>
<rect x="512" y="296" width="856" height="1" fill="#000000"/>
<rect x="512" y="297" width="856" height="89" fill="#F2F2F2"/>
<rect x="512" y="297" width="6" height="89" fill="#000000"/>
<rect x="534" y="310" width="36" height="36" fill="#000000"/>
<text x="552" y="336" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">B</text>
<text x="1352" y="336" font-size="18" font-weight="700" fill="#000000" text-anchor="end">✓ Riktig svar</text>
<text x="596" y="335" font-size="20" font-weight="700" fill="#000000"><tspan x="596" dy="0">Å skape et tydelig og ønsket bilde av merket i</tspan><tspan x="596" dy="28">målgruppens bevissthet</tspan></text>
<rect x="512" y="386" width="856" height="1" fill="#000000"/>
<rect x="512" y="387" width="6" height="61" fill="#E2001A"/>
<rect x="534" y="400" width="36" height="36" fill="#E2001A"/>
<text x="552" y="426" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">C</text>
<text x="1352" y="426" font-size="18" font-weight="700" fill="#E2001A" text-anchor="end">✗ Ditt svar</text>
<text x="596" y="425" font-size="20" font-weight="400" fill="#000000"><tspan x="596" dy="0">Å velge hvilke segmenter bedriften skal satse på</tspan></text>
<rect x="512" y="448" width="856" height="1" fill="#000000"/>
<rect x="534" y="462" width="36" height="36" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
<text x="552" y="488" font-size="22" font-weight="700" fill="#000000" text-anchor="middle">D</text>
<text x="596" y="487" font-size="20" font-weight="400" fill="#000000"><tspan x="596" dy="0">Å fastsette prisen ut fra konkurrentenes priser</tspan></text>
<rect x="512" y="510" width="856" height="1" fill="#000000"/>
<text x="512" y="558" font-size="16" font-weight="700" fill="#000000" letter-spacing="1.2">FORKLARING</text>
<text x="512" y="592" font-size="18" font-weight="400" fill="#000000"><tspan x="512" dy="0">Posisjonering handler om hvilken plass merket skal ha i hodet til målgruppen, sammenlignet med</tspan><tspan x="512" dy="27">konkurrentene. C beskriver målgruppevalg, som kommer før posisjoneringen.</tspan></text>
<rect x="512" y="649" width="10" height="10" fill="#E2001A"/>
<text x="534" y="659" font-size="16" font-weight="700" fill="#000000">Kilde: merkevare-notater.pdf, side 7</text>
<rect x="952" y="740" width="416" height="64" fill="#000000"/><text x="972" y="779.0" font-size="20" font-weight="700" fill="#FFFFFF">Neste spørsmål</text><text x="1348" y="779.0" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="end">→</text>
<rect x="945" y="733" width="430" height="78" fill="none" stroke="#000000" stroke-width="3"/>
<text x="952" y="836" font-size="16" font-weight="400" fill="#555555">Enter går videre</text>
</svg>
