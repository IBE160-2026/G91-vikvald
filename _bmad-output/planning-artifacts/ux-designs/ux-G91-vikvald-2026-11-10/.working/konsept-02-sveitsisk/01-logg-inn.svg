<rect x="842" y="520" width="4" height="24" fill="#E2001A"/>
<text x="858" y="538" font-size="16" font-weight="700" fill="#E2001A">✗ Feil e-post eller passord. Prøv igjen.</text>
<rect x="842" y="588" width="526" height="64" fill="#000000"/><text x="862" y="627.0" font-size="20" font-weight="700" fill="#FFFFFF">Logg inn</text><text x="1348" y="627.0" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="end">→</text>
<rect x="842" y="700" width="526" height="1" fill="#000000"/>
<text x="842" y="736" font-size="16" font-weight="400" fill="#555555"><tspan x="842" dy="0">Notatene dine er bare synlige for deg. Du kan slette kontoen og</tspan><tspan x="842" dy="24">alt innhold når som helst.</tspan></text>
<text x="72" y="868" font-size="16" font-weight="400" fill="#555555">Studiekamerat · studentprosjekt IBE160 · 2026</text>
