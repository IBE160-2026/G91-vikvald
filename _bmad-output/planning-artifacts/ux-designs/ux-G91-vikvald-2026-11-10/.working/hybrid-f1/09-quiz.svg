 >Feil</text><circle cx="48" cy="563" r="1.75" fill="#5C574F"/><text x="68" y="568" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#1D1C1A" text-anchor="start" >Ikke besvart ennå</text><rect x="40.75" y="816.75" width="222.5" height="46.5" rx="6" fill="#FFFFFF" stroke="#1D1C1A" stroke-width="1.5" /><text x="152.0" y="845.4" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1D1C1A" text-anchor="middle" >Avslutt økt</text><text x="368" y="136" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#5C574F" text-anchor="start" letter-spacing="1.4" >SPØRSMÅL 4 · FLERVALG</text><text x="368" y="184" font-family="Charter, 'Iowan Old Style', 'Bitstream Charter', Georgia, serif" font-size="36" font-weight="400" fill="#1D1C1A" text-anchor="start" >Hvilken av disse beskriver best posisjonering?</text><text x="368" y="218" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#5C574F" text-anchor="start" >Du svarte C. Svaret er bekreftet.</text><rect x="368.5" y="248.5" width="1007" height="63" rx="8" fill="#FFFFFF" stroke="#DAD5CB" stroke-width="1" /><rect x="384" y="264" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#DAD5CB" stroke-width="1" /><text x="400" y="285" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1D1C1A" text-anchor="middle" >A</text><text x="436" y="286" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#1D1C1A" text-anchor="start" >Å dele markedet inn i grupper med like behov</text><rect x="368.75" y="324.75" width="1006.5" height="62.5" rx="8" fill="#E6F2E9" stroke="#1D7037" stroke-width="1.5" /><rect x="384" y="340" width="32" height="32" rx="6" fill="#E6F2E9" stroke="#1D7037" stroke-width="1" /><text x="400" y="361" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1D1C1A" text-anchor="middle" >B</text><text x="436" y="362" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#1D1C1A" text-anchor="start" >Å skape et tydelig og ønsket bilde av merket i målgruppens bevissthet</text><path d="M 1255.985 356.5 L 1259.985 360.5 L 1267.985 351.5" fill="none" stroke="#1D7037" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1352" y="361" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1D7037" text-anchor="end" >Riktig svar</text><rect x="368.75" y="400.75" width="1006.5" height="62.5" rx="8" fill="#FBE8E6" stroke="#B42318" stroke-width="1.5" /><rect x="384" y="416" width="32" height="32" rx="6" fill="#FBE8E6" stroke="#B42318" stroke-width="1" /><text x="400" y="437" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1D1C1A" text-anchor="middle" >C</text><text x="436" y="438" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#1D1C1A" text-anchor="start" >Å velge hvilke segmenter bedriften skal satse på</text><path d="M 1271.505 427 L 1281.505 437 M 1281.505 427 L 1271.505 437" fill="none" stroke="#B42318" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1352" y="437" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#B42318" text-anchor="end" >Ditt svar</text><rect x="368.5" y="476.5" width="1007" height="63" rx="8" fill="#FFFFFF" stroke="#DAD5CB" stroke-width="1" /><rect x="384" y="492" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#DAD5CB" stroke-width="1" /><text x="400" y="513" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1D1C1A" text-anchor="middle" >D</text><text x="436" y="514" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#1D1C1A" text-anchor="start" >Å fastsette prisen ut fra konkurrentenes priser</text><line x1="368" y1="584" x2="1376" y2="584" stroke="#E7E3DA" stroke-width="1" /><text x="368" y="632" font-family="Charter, 'Iowan Old Style', 'Bitstream Charter', Georgia, serif" font-size="22" font-weight="700" fill="#1D1C1A" text-anchor="start" >Forklaring</text><text x="592" y="630" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#1D1C1A" text-anchor="start" >Posisjonering handler om hvilket bilde merket skal ha i målgruppens bevissthet,</text>
<text x="592" y="658" font-family="'Avenir Next', Avenir, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="400" fill="#1D1C1A" text-anchor="start" >sammenlignet med konkurrentene. C beskriver målgruppevalg: å velge segmenter. Det</text>
