<text x="80" y="186" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">SPØRSMÅL 4</text>
<text x="80" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#161311" font-weight="bold">Hvilken av disse beskriver</text>
<text x="80" y="286" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#161311" font-weight="bold">best posisjonering?</text>
<line x1="80" y1="318" x2="900" y2="318" stroke="#161311" stroke-width="1.5"/>
<text x="104" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#161311" font-weight="bold">A</text>
<text x="150" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311">Å dele markedet inn i grupper med like behov</text>
<line x1="80" y1="388" x2="900" y2="388" stroke="#B9AE9B" stroke-width="0.75"/>
<rect x="80" y="388" width="820" height="100" fill="#E3EBDD"/>
<rect x="80" y="388" width="6" height="100" fill="#2B5B34"/>
<text x="104" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#161311" font-weight="bold">B</text>
<text x="150" y="426" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311">Å skape et tydelig og ønsket bilde av merket i</text>
<text x="150" y="456" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311">målgruppens bevissthet</text>
<text x="884" y="426" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#2B5B34" font-weight="bold" text-anchor="end">✓ Riktig svar</text>
<line x1="80" y1="488" x2="900" y2="488" stroke="#B9AE9B" stroke-width="0.75"/>
<rect x="80" y="488" width="820" height="70" fill="#F2E2DC"/>
<rect x="80" y="488" width="6" height="70" fill="#7B1E17"/>
<text x="104" y="530" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#161311" font-weight="bold">C</text>
<text x="150" y="526" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311">Å velge hvilke segmenter bedriften skal satse på</text>
<text x="884" y="526" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#7B1E17" font-weight="bold" text-anchor="end">✗ Ditt svar</text>
<line x1="80" y1="558" x2="900" y2="558" stroke="#B9AE9B" stroke-width="0.75"/>
<text x="104" y="600" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#161311" font-weight="bold">D</text>
<text x="150" y="596" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311">Å fastsette prisen ut fra konkurrentenes priser</text>
<line x1="80" y1="628" x2="900" y2="628" stroke="#B9AE9B" stroke-width="0.75"/>
<text x="80" y="678" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#161311" font-weight="bold" letter-spacing="1.6">FORKLARING</text>
<text x="80" y="714" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">Posisjonering handler om hvilken plass merket skal ha i hodet til kundene.</text>
<text x="80" y="743" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">Alternativ C beskriver målgruppevalg, som kommer før posisjoneringen.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 1</tspan></text>
<line x1="80" y1="773" x2="200" y2="773" stroke="#161311" stroke-width="1"/>
<text x="80" y="801" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">1</tspan> Kilde: merkevare-notater.pdf, side 7</text>
<line x1="940" y1="170" x2="940" y2="860" stroke="#161311" stroke-width="0.75"/>
<text x="980" y="186" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4E473F" font-weight="bold" letter-spacing="1.6">DITT SVAR</text>
<text x="980" y="244" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#7B1E17" font-weight="bold">✗ Feil</text>
<text x="980" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311">Du valgte C. Riktig svar er B.</text>
<line x1="980" y1="340" x2="1360" y2="340" stroke="#161311" stroke-width="0.75"/>
