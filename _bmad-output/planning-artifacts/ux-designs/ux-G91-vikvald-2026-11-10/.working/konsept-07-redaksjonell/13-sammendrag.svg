<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Studiekamerat – sammendrag Uke 37: Merkevare">
<title>Studiekamerat – sammendrag Uke 37: Merkevare</title>
<rect x="0" y="0" width="1440" height="900" fill="#F5F0E6"/>
<text x="80" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#161311" font-weight="bold">Studiekamerat</text>
<text x="338" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#4E473F" font-style="italic">Øvingsstoff fra dine egne notater</text>
<text x="1110" y="49" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#161311" font-weight="bold">Emner</text>
<line x1="1110" y1="58" x2="1158.0" y2="58" stroke="#7B1E17" stroke-width="3"/>
<text x="1210" y="49" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#161311" font-weight="bold">Konto</text>
<text x="1300" y="49" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#161311" font-weight="bold">Logg ut</text>
<line x1="80" y1="74" x2="1360" y2="74" stroke="#161311" stroke-width="3"/>
<line x1="80" y1="80" x2="1360" y2="80" stroke="#161311" stroke-width="0.75"/>
<text x="80" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4E473F" font-weight="bold" letter-spacing="1.6">EMNER  ›  MARKEDSFØRING  ›  UKE 37  ›  SAMMENDRAG</text>
<text x="1360" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4E473F" font-weight="bold" text-anchor="end" letter-spacing="1.6">TIRSDAG 10. NOVEMBER 2026</text>
<text x="80" y="162" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">SAMMENDRAG · UKE 37 · 11.09.2026</text>
<text x="80" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#161311" font-weight="bold" letter-spacing="-1">Merkevare</text>
<text x="80" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#4E473F" font-style="italic">Tre temaer fra to filer og 18 sider. Hvert punkt har en fotnote som viser hvor i notatene det står.</text>
<rect x="1100" y="176" width="260" height="50" fill="#FFFDF8" stroke="#161311" stroke-width="1.5"/>
<text x="1230.0" y="206.6" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#161311" font-weight="bold" text-anchor="middle">Lag nytt sammendrag</text>
<text x="1360" y="254" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F" text-anchor="end">Erstatter dette sammendraget.</text>
<line x1="80" y1="296" x2="1360" y2="296" stroke="#161311" stroke-width="2"/>
<text x="80" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#161311" font-weight="bold">Hva er en merkevare</text>
<rect x="80" y="387" width="8" height="8" fill="#7B1E17"/>
<text x="100" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">Et navn, symbol eller design som skiller</text>
<text x="100" y="425" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">et produkt fra konkurrentenes.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 1</tspan></text>
<rect x="80" y="458" width="8" height="8" fill="#7B1E17"/>
<text x="100" y="469" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">Merket er et løfte til kunden om hva hun</text>
<text x="100" y="496" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">kan vente seg av produktet.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 2</tspan></text>
<line x1="500" y1="320" x2="500" y2="680" stroke="#B9AE9B" stroke-width="1"/>
<text x="520" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#161311" font-weight="bold">Merkevareekvitet</text>
<rect x="520" y="387" width="8" height="8" fill="#7B1E17"/>
<text x="540" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">Merverdien et merke gir et produkt, ut</text>
<text x="540" y="425" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">over de funksjonelle egenskapene.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 3</tspan></text>
<rect x="520" y="458" width="8" height="8" fill="#7B1E17"/>
<text x="540" y="469" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">Bygges av kjennskap, assosiasjoner,</text>
<text x="540" y="496" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">oppfattet kvalitet og lojalitet.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 4</tspan></text>
<rect x="520" y="529" width="8" height="8" fill="#7B1E17"/>
<text x="540" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">Sterk ekvitet gjør at kundene betaler mer</text>
<text x="540" y="567" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">og bytter sjeldnere.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 5</tspan></text>
<line x1="940" y1="320" x2="940" y2="680" stroke="#B9AE9B" stroke-width="1"/>
<text x="960" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#161311" font-weight="bold">Merkevarestrategier</text>
<rect x="960" y="387" width="8" height="8" fill="#7B1E17"/>
<text x="980" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">Paraplymerke: flere produkter selges</text>
<text x="980" y="425" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">under samme merkenavn.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 6</tspan></text>
<rect x="960" y="458" width="8" height="8" fill="#7B1E17"/>
<text x="980" y="469" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">Individuelle merker: hvert produkt får</text>
<text x="980" y="496" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">eget navn, så en feil ikke smitter over.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 7</tspan></text>
<rect x="960" y="529" width="8" height="8" fill="#7B1E17"/>
<text x="980" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">Merkeutvidelse: et kjent merke tas inn i</text>
<text x="980" y="567" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">en ny produktkategori.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 8</tspan></text>
<line x1="80" y1="704" x2="1360" y2="704" stroke="#161311" stroke-width="1"/>
<text x="80" y="734" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#161311" font-weight="bold" letter-spacing="1.6">KILDER</text>
<text x="80" y="772" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">1</tspan> merkevare-notater.pdf, side 2</text>
<text x="80" y="802" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">2</tspan> merkevare-notater.pdf, side 3</text>
<text x="80" y="832" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">3</tspan> merkevare-notater.pdf, side 4</text>
<text x="520" y="772" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">4</tspan> merkevare-notater.pdf, side 5</text>
<text x="520" y="802" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">5</tspan> merkevare-forelesning2.pdf, side 1</text>
<text x="520" y="832" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">6</tspan> merkevare-forelesning2.pdf, side 2</text>
<text x="960" y="772" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">7</tspan> merkevare-forelesning2.pdf, side 3</text>
<text x="960" y="802" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">8</tspan> merkevare-forelesning2.pdf, side 4</text>
</svg>
