<text x="520" y="194" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#161311" font-weight="bold">Fire spørsmål å se på igjen</text>
<line x1="520" y1="214" x2="1360" y2="214" stroke="#161311" stroke-width="2"/>
<text x="520" y="256" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">SPØRSMÅL 4</text>
<text x="520" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311" font-weight="bold">Hvilken av disse beskriver best</text>
<text x="520" y="315" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311" font-weight="bold">posisjonering?</text>
<text x="520" y="347" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#7B1E17" font-weight="bold">✗ Ditt svar: Å velge hvilke segmenter</text>
<text x="520" y="370" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#7B1E17" font-weight="bold">bedriften skal satse på.</text>
<text x="520" y="396" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2B5B34" font-weight="bold">✓ Riktig: Å skape et tydelig og ønsket</text>
<text x="520" y="419" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2B5B34" font-weight="bold">bilde av merket i målgruppens</text>
<text x="520" y="442" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2B5B34" font-weight="bold">bevissthet.</text>
<text x="520" y="472" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">Segmentvalg kommer før posisjoneringen.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 1</tspan></text>
<text x="520" y="500" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">1</tspan> merkevare-notater.pdf, side 7</text>
<text x="960" y="256" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">SPØRSMÅL 7</text>
<text x="960" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311" font-weight="bold">Hva er et eksempel på en</text>
<text x="960" y="315" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311" font-weight="bold">merkevareassosiasjon?</text>
<text x="960" y="347" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#7B1E17" font-weight="bold">✗ Ditt svar: Merkets markedsandel.</text>
<text x="960" y="373" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2B5B34" font-weight="bold">✓ Riktig: At et bilmerke forbindes med</text>
<text x="960" y="396" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2B5B34" font-weight="bold">sikkerhet.</text>
<text x="960" y="426" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">Assosiasjoner er det kunden tenker på når hun</text>
<text x="960" y="451" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">ser merket.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 2</tspan></text>
<text x="960" y="479" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">2</tspan> merkevare-notater.pdf, side 5</text>
<text x="520" y="576" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">SPØRSMÅL 11</text>
<text x="520" y="608" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311" font-weight="bold">Hva kjennetegner en</text>
<text x="520" y="635" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311" font-weight="bold">paraplymerkevare?</text>
<text x="520" y="667" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#7B1E17" font-weight="bold">✗ Ditt svar: Hvert produkt får sitt eget</text>
<text x="520" y="690" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#7B1E17" font-weight="bold">navn.</text>
<text x="520" y="716" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2B5B34" font-weight="bold">✓ Riktig: Flere produkter selges under</text>
<text x="520" y="739" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2B5B34" font-weight="bold">samme merkenavn.</text>
<text x="520" y="769" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">Det du valgte, beskriver individuelle merker.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 3</tspan></text>
<text x="520" y="797" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">3</tspan> merkevare-forelesning2.pdf, side 2</text>
<text x="960" y="576" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">SPØRSMÅL 13</text>
<text x="960" y="608" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311" font-weight="bold">Hva er oppfattet kvalitet?</text>
<text x="960" y="640" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#7B1E17" font-weight="bold">✗ Ditt svar: Produktets faktiske</text>
<text x="960" y="663" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#7B1E17" font-weight="bold">holdbarhet.</text>
<text x="960" y="689" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2B5B34" font-weight="bold">✓ Riktig: Kundens vurdering av</text>
<text x="960" y="712" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2B5B34" font-weight="bold">kvaliteten sammenlignet med</text>
<text x="960" y="735" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#2B5B34" font-weight="bold">alternativer.</text>
<text x="960" y="765" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">Det er kundens bilde som teller, ikke</text>
<text x="960" y="790" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">målinger.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 4</tspan></text>
<text x="960" y="818" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">4</tspan> merkevare-notater.pdf, side 6</text>
