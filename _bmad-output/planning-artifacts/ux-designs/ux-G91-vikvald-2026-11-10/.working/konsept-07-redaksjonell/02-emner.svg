<text x="80" y="312" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">EMNE · 8 FORELESNINGER</text>
<text x="80" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="76" fill="#161311" font-weight="bold" letter-spacing="-1">Markedsføring</text>
<text x="80" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#161311">Siste forelesning: Uke 41, Markedskommunikasjon (09.10). 162 flashcards</text>
<text x="80" y="472" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#161311">og 88 quizspørsmål er klare til øving.</text>
<rect x="80" y="508" width="200" height="50" fill="#161311"/>
<text x="180.0" y="538.95" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#F5F0E6" font-weight="bold" text-anchor="middle">Åpne emnet</text>
<rect x="300" y="508" width="240" height="50" fill="#FFFDF8" stroke="#161311" stroke-width="1.5"/>
<text x="420.0" y="538.95" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#161311" font-weight="bold" text-anchor="middle">Øv på hele emnet</text>
<line x1="80" y1="636" x2="860" y2="636" stroke="#161311" stroke-width="3"/>
<text x="80" y="664" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4E473F" font-weight="bold" letter-spacing="1.6">SLIK VIRKER DET</text>
<text x="80" y="728" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#7B1E17" font-weight="bold">1</text>
<text x="124" y="722" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#161311" font-weight="bold">Last opp</text>
<text x="80" y="766" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">Legg notatene (PDF) under</text>
<text x="80" y="792" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">riktig forelesning.</text>
<text x="350" y="728" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#7B1E17" font-weight="bold">2</text>
<text x="394" y="722" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#161311" font-weight="bold">Lag</text>
<text x="350" y="766" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">Velg flashcards, quiz,</text>
<text x="350" y="792" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">huskeregler, fritekst eller</text>
<text x="350" y="818" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">sammendrag.</text>
<line x1="332" y1="690" x2="332" y2="850" stroke="#B9AE9B" stroke-width="1"/>
<text x="620" y="728" font-family="Georgia, 'Times New Roman', serif" font-size="48" fill="#7B1E17" font-weight="bold">3</text>
<text x="664" y="722" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#161311" font-weight="bold">Øv</text>
<text x="620" y="766" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">Øv på én forelesning, eller</text>
<text x="620" y="792" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">på hele emnet før eksamen.</text>
<line x1="602" y1="690" x2="602" y2="850" stroke="#B9AE9B" stroke-width="1"/>
<line x1="900" y1="280" x2="900" y2="860" stroke="#161311" stroke-width="0.75"/>
<text x="940" y="312" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">EMNE · 5 FORELESNINGER</text>
<text x="940" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#161311" font-weight="bold">Samfunnsøkonomi</text>
<text x="940" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">Siste: Uke 39, Pengepolitikk (24.09). 64</text>
<text x="940" y="427" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">flashcards og 30 quizspørsmål.</text>
<text x="940" y="467" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#7B1E17" font-weight="bold" text-decoration="underline">Åpne emnet →</text>
<line x1="940" y1="499" x2="1360" y2="499" stroke="#161311" stroke-width="0.75"/>
<text x="940" y="547" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">EMNE · 2 FORELESNINGER</text>
<text x="940" y="597" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#161311" font-weight="bold">Organisasjon</text>
<text x="940" y="643" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#161311" font-weight="bold">og ledelse</text>
<text x="940" y="683" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">Siste: Uke 36, Motivasjon (03.09). Ikke øvd</text>
<text x="940" y="710" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">ennå – lag øvingsstoff fra notatene først.</text>
<text x="940" y="750" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#7B1E17" font-weight="bold" text-decoration="underline">Åpne emnet →</text>
