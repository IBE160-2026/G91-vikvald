<text x="80" y="184" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">SPØRSMÅL 2 · LANGSVAR</text>
<text x="80" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#161311" font-weight="bold">Forklar forskjellen på segmentering og posisjonering,</text>
<text x="80" y="274" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#161311" font-weight="bold">og gi et eksempel.</text>
<text x="80" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#161311" font-weight="bold">Ditt svar</text>
<rect x="80" y="354" width="600" height="300" fill="#FFFDF8" stroke="#161311" stroke-width="1.5"/>
<text x="100" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">Segmentering er å dele markedet inn i grupper med like behov,</text>
<text x="100" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">for eksempel studenter og pensjonister. Posisjonering handler</text>
<text x="100" y="448" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">om hvordan merket skal oppfattes. Et eksempel er en</text>
<text x="100" y="476" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">treningskjede som satser på studenter og vil fremstå som</text>
<text x="100" y="504" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">billig og enkel.</text>
<text x="680" y="680" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4E473F" text-anchor="end" font-style="italic">Svaret ditt er lagret</text>
<line x1="720" y1="320" x2="720" y2="660" stroke="#161311" stroke-width="0.75"/>
<text x="760" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">MODELLSVAR</text>
<text x="760" y="382" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">Segmentering er å dele markedet inn i grupper med like behov</text>
<text x="760" y="411" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">og kjennetegn. Posisjonering er å skape et tydelig og ønsket</text>
<text x="760" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">bilde av merket hos segmentet man har valgt. Eksempel: Et</text>
<text x="760" y="469" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">bilmerke velger barnefamilier som segment, og posisjonerer seg</text>
<text x="760" y="498" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">som det tryggeste valget.<tspan font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="bold" fill="#7B1E17" dy="-8"> 1</tspan></text>
<line x1="760" y1="532" x2="880" y2="532" stroke="#161311" stroke-width="1"/>
<text x="760" y="560" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F"><tspan fill="#7B1E17" font-weight="bold">1</tspan> Kilde: merkevare-notater.pdf, side 7</text>
<line x1="80" y1="696" x2="1360" y2="696" stroke="#161311" stroke-width="0.75"/>
<text x="80" y="728" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311" font-weight="bold">Hvordan gikk det? Vurder svaret ditt selv.</text>
<rect x="80" y="748" width="230" height="56" fill="#FFFDF8" stroke="#161311" stroke-width="1.5"/>
<text x="195.0" y="782.3" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#161311" font-weight="bold" text-anchor="middle">✓ Riktig</text>
<rect x="330" y="748" width="230" height="56" fill="#161311"/>
<text x="445.0" y="782.3" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#F5F0E6" font-weight="bold" text-anchor="middle">◐ Delvis riktig</text>
<rect x="325" y="743" width="240" height="66" fill="none" stroke="#7B1E17" stroke-width="3"/>
<rect x="580" y="748" width="230" height="56" fill="#FFFDF8" stroke="#161311" stroke-width="1.5"/>
<text x="695.0" y="782.3" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#161311" font-weight="bold" text-anchor="middle">✗ Feil</text>
<text x="80" y="840" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#4E473F">Valgt: Delvis riktig. Valget er markert med fylt felt og tekst, ikke bare farge.</text>
<rect x="1120" y="748" width="240" height="56" fill="#FFFDF8" stroke="#161311" stroke-width="1.5"/>
