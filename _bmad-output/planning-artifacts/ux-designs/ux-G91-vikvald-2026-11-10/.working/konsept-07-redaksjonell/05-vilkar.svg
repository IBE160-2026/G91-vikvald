<text x="396" y="104" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">FØR FØRSTE OPPLASTING</text>
<text x="396" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#161311" font-weight="bold">Vilkår for opplasting</text>
<text x="396" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#4E473F" font-style="italic">Les dette før notatene dine sendes videre.</text>
<line x1="396" y1="208" x2="1044" y2="208" stroke="#161311" stroke-width="0.75"/>
<text x="396" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#7B1E17" font-weight="bold">§ 1</text>
<text x="452" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">Du er selv ansvarlig for materialet du laster opp.</text>
<text x="396" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#7B1E17" font-weight="bold">§ 2</text>
<text x="452" y="306" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">Last bare opp egne notater eller materiale du har rett til å</text>
<text x="452" y="334" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">bruke.</text>
<text x="396" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#7B1E17" font-weight="bold">§ 3</text>
<text x="452" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">Notatene sendes til språkmodellen hos Google i EU, som lager</text>
<text x="452" y="416" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">øvingsstoffet.</text>
<text x="396" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#7B1E17" font-weight="bold">§ 4</text>
<text x="452" y="470" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">Google kan logge forespørslene en periode for å oppdage</text>
<text x="452" y="498" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">misbruk.</text>
<text x="396" y="552" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#7B1E17" font-weight="bold">§ 5</text>
<text x="452" y="552" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">Ikke last opp personopplysninger, for eksempel navn på</text>
<text x="452" y="580" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#161311">medstudenter.</text>
