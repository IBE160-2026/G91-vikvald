<svg xmlns="http://www.w3.org/2000/svg" lang="nb" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="Studiekamerat – konto">
<title>Studiekamerat – konto</title>
<rect x="0" y="0" width="1440" height="900" fill="#F5F0E6"/>
<text x="80" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#161311" font-weight="bold">Studiekamerat</text>
<text x="338" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#4E473F" font-style="italic">Øvingsstoff fra dine egne notater</text>
<text x="1110" y="49" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#161311" font-weight="bold">Emner</text>
<text x="1210" y="49" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#161311" font-weight="bold">Konto</text>
<line x1="1210" y1="58" x2="1258.0" y2="58" stroke="#7B1E17" stroke-width="3"/>
<text x="1300" y="49" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#161311" font-weight="bold">Logg ut</text>
<line x1="80" y1="74" x2="1360" y2="74" stroke="#161311" stroke-width="3"/>
<line x1="80" y1="80" x2="1360" y2="80" stroke="#161311" stroke-width="0.75"/>
<text x="80" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4E473F" font-weight="bold" letter-spacing="1.6">KONTO</text>
<text x="1360" y="108" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#4E473F" font-weight="bold" text-anchor="end" letter-spacing="1.6">TIRSDAG 10. NOVEMBER 2026</text>
<rect x="80" y="128" width="1280" height="44" fill="#EBE3D3"/>
<rect x="80" y="128" width="6" height="44" fill="#7B1E17"/>
<text x="104" y="156" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">DEMOMODUS</text>
<text x="240" y="157" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#161311">Innholdet lages av en testmodell, ikke av den ekte språkmodellen.</text>
<text x="80" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#161311" font-weight="bold" letter-spacing="-1">Konto</text>
<text x="80" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#161311" font-weight="bold" letter-spacing="1.6">E-POST</text>
<line x1="80" y1="322" x2="620" y2="322" stroke="#161311" stroke-width="2"/>
<text x="80" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#161311">klara@eksempel.no</text>
<text x="80" y="392" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F">Du logger inn med denne adressen.</text>
<text x="80" y="452" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#161311" font-weight="bold" letter-spacing="1.6">LOGG UT</text>
<line x1="80" y1="464" x2="620" y2="464" stroke="#161311" stroke-width="2"/>
<text x="80" y="500" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#4E473F" font-style="italic">Du kan logge inn igjen når som helst.</text>
<rect x="80" y="522" width="160" height="50" fill="#FFFDF8" stroke="#161311" stroke-width="1.5"/>
<text x="160.0" y="552.95" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#161311" font-weight="bold" text-anchor="middle">Logg ut</text>
<text x="80" y="632" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#161311" font-weight="bold" letter-spacing="1.6">VILKÅR OG PERSONVERN</text>
<line x1="80" y1="644" x2="620" y2="644" stroke="#161311" stroke-width="2"/>
<text x="80" y="680" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">Notatene dine sendes til språkmodellen hos Google i EU når</text>
<text x="80" y="707" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#161311">du lager innhold.</text>
<text x="80" y="743" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#7B1E17" font-weight="bold" text-decoration="underline">Les vilkårene</text>
<line x1="680" y1="290" x2="680" y2="860" stroke="#161311" stroke-width="0.75"/>
<text x="720" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#7B1E17" font-weight="bold" letter-spacing="1.6">SLETT KONTOEN</text>
<line x1="720" y1="322" x2="1360" y2="322" stroke="#7B1E17" stroke-width="3"/>
<text x="720" y="372" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#161311" font-weight="bold">Slette kontoen for godt?</text>
<text x="720" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311">Alle emnene dine, alle opplastede filer og alt generert</text>
<text x="720" y="451" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311">innhold – flashcards, quiz, huskeregler, fritekstspørsmål og</text>
<text x="720" y="482" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#161311">sammendrag – slettes for godt. Det kan ikke angres.</text>
<text x="720" y="528" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#161311" font-weight="bold">Det gjelder nå: 3 emner, 15 forelesninger og 24 filer.</text>
<rect x="720" y="562" width="220" height="54" fill="#7B1E17"/>
<text x="830.0" y="594.95" font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#F5F0E6" font-weight="bold" text-anchor="middle">Slett kontoen</text>
<text x="720" y="654" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#4E473F">Du må bekrefte før noe slettes.</text>
</svg>
